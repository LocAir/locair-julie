<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mon espace — Loc'Air</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,700;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --blue:#1b3a5f;--blue-d:#142d4a;--blue-lt:#eef3fa;
  --gold:#c5a96c;--gold-d:#b08c48;
  --black:#141e30;--black2:#1e2d45;
  --grey:#5a6577;--rule:#ddd8cf;--rule-lt:#edeae4;
  --bg:#ede8e0;
  --green:#3f7d52;--green-bg:#eaf6ee;
  --amber:#92400e;--amber-bg:#fff8ee;
  --red:#b91c1c;--red-bg:#fef2f2;--red-border:#fecaca;
  --disp:'Cormorant Garamond',Georgia,serif;
  --body:'Inter',system-ui,sans-serif;
  --r:16px;
  --sh:0 1px 3px rgba(20,30,48,.04),0 4px 20px rgba(20,30,48,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--black);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}

/* ── Navigation ── */
.nav{position:sticky;top:0;z-index:100;min-height:58px;background:rgba(237,232,224,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:10px clamp(16px,5vw,64px);flex-shrink:0}
.nav-logo{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--black);letter-spacing:-.01em}
.nav-logo em{font-style:italic;font-weight:300;color:var(--gold)}
.nav-logout{font-size:12.5px;color:var(--grey);background:none;border:1.5px solid var(--rule);border-radius:100px;padding:6px 14px;cursor:pointer;font-family:var(--body);transition:border-color .15s,color .15s}
.nav-logout:hover{border-color:var(--grey);color:var(--black2)}

/* ── Layout ── */
main{flex:1}
.page-wrap{max-width:640px;margin:0 auto;padding:36px clamp(16px,5vw,32px) 100px}

/* ── Login form ── */
.form-group{margin-bottom:20px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--black2);margin-bottom:7px}
input[type="text"],input[type="email"]{width:100%;padding:13px 15px;border:1.5px solid var(--rule);border-radius:10px;background:#fff;font-family:var(--body);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,58,95,.08)}

/* ── Boutons ── */
.btn-submit{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--body);transition:opacity .15s,transform .12s}
.btn-submit:hover:not(:disabled){opacity:.87;transform:translateY(-1px)}
.btn-submit:active:not(:disabled){transform:translateY(0)}
.btn-submit:disabled{opacity:.5;cursor:default}
.btn-outline{display:block;width:100%;text-align:center;padding:13px;border:1.5px solid var(--rule);border-radius:12px;font-weight:600;font-size:14px;color:var(--black2)}
.btn-prolong{display:block;width:100%;text-align:center;padding:16px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-d) 100%);color:#fff;border-radius:12px;font-weight:700;font-size:15px;margin:0 0 14px;letter-spacing:.01em;transition:opacity .15s,transform .12s;box-shadow:0 2px 12px rgba(197,169,108,.35)}
.btn-prolong:hover{opacity:.9;transform:translateY(-1px)}
.btn-prolong:active{transform:translateY(0)}

/* ── Alertes ── */
.alert-error{background:var(--red-bg);border:1.5px solid var(--red-border);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--red);line-height:1.6}
.alert-info{background:var(--amber-bg);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--amber);line-height:1.6}
.alert-success{background:var(--green-bg);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--green);line-height:1.6}

/* ── Écran login : typo ── */
h1{font-family:var(--disp);font-size:clamp(30px,6vw,44px);font-weight:300;letter-spacing:-.02em;margin-bottom:8px}
h1 em{font-style:italic}
.page-sub{font-size:13.5px;color:var(--grey);margin-bottom:28px;line-height:1.65}

/* ── Dashboard : header ── */
.dash-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.dash-h1{font-family:var(--disp);font-size:clamp(30px,6vw,42px);font-weight:300;letter-spacing:-.02em;margin-bottom:18px}
.dash-h1 em{font-style:italic}

/* ── Countdown ── */
.countdown{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border-radius:100px;padding:7px 16px;font-size:13px;font-weight:600;margin-bottom:20px;letter-spacing:-.01em}

/* ── Progress barre ── */
.progress-card{background:#fff;border:1px solid var(--rule-lt);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.progress-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.progress-stage-lbl{font-size:15px;font-weight:700;color:var(--black2);line-height:1.3}
.progress-counter{font-size:12px;color:var(--grey);white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0}
.progress-track{height:6px;background:var(--rule-lt);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:100px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.next-step{display:flex;align-items:flex-start;gap:11px;background:var(--blue-lt);border-left:3px solid var(--blue);border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600;color:var(--black2);margin-bottom:14px;line-height:1.4}
.banner-cancel{background:var(--red-bg);border-left:3px solid var(--red);border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600;color:var(--red);margin-bottom:14px}

/* ── Cards ── */
.card{background:#fff;border:1px solid var(--rule-lt);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.card-div{border:none;border-top:1px solid var(--rule-lt);margin:16px 0}

/* En-tête de card (icône + label) */
.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.card-ico{width:38px;height:38px;border-radius:11px;background:var(--blue-lt);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.card-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--grey);margin-bottom:2px}
.card-sublbl{font-size:13.5px;color:var(--black2);font-weight:500;line-height:1.4}

/* Lignes label : valeur */
.card-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f2efe9;font-size:13.5px}
.card-row:last-child{border-bottom:none}
.card-row .lbl{color:var(--grey)}
.card-row .val{font-weight:600;text-align:right;color:var(--black2)}

/* Section micro-label (remplace les h2) */
.sect-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--grey);margin:26px 0 10px}
.sect-lbl:first-of-type{margin-top:0}

/* ── Mission card : date hero + créneau ── */
.mission-date{font-family:var(--disp);font-size:27px;font-weight:300;letter-spacing:-.02em;color:var(--black);text-transform:capitalize;line-height:1.15;margin-bottom:9px}
.mission-creneau{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-lt);border-radius:100px;padding:5px 13px;margin-bottom:14px}

/* ── Consignes récupération ── */
.consigne{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f2efe9;font-size:13px;color:var(--grey);line-height:1.5}
.consigne:last-child{border-bottom:none}
.consigne-check{width:20px;height:20px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* ── Créneau selection (avancement) ── */
.creneau-btns{display:flex;gap:8px;margin-bottom:14px}
.creneau-opt{flex:1;display:flex;align-items:center;justify-content:center;padding:13px;border:1.5px solid var(--rule);border-radius:11px;cursor:pointer;font-size:14px;font-weight:600;color:var(--black2);background:#fff;transition:border-color .15s,background .15s,color .15s;user-select:none}
.creneau-opt:hover{border-color:rgba(27,58,95,.3)}

/* ── Ma location ── */
.clim-name{font-size:15px;font-weight:600;color:var(--black2);margin-bottom:2px}
.clim-sub{font-size:12.5px;color:var(--grey)}
.date-range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--grey);flex-wrap:wrap}
.date-range strong{color:var(--black2);font-weight:600}
.price-display{font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.02em;color:var(--black);margin-top:8px}

/* ── Documents ── */
.doc-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f2efe9;font-size:14px}
.doc-row:last-child{border-bottom:none}
.doc-ico{width:34px;height:34px;border-radius:9px;background:#f5f2ed;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-name{font-weight:600;color:var(--black2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-sub{font-size:12px;color:var(--grey);margin-top:1px}
.doc-btn{font-size:12px;font-weight:600;color:var(--blue);border:1.5px solid rgba(27,58,95,.2);border-radius:100px;padding:6px 14px;white-space:nowrap;flex-shrink:0;transition:background .15s,color .15s,border-color .15s}
.doc-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── Centre d'aide ── */
.aide-item{border-bottom:1px solid #f2efe9}
.aide-item:last-child{border-bottom:none}
.aide-q{width:100%;text-align:left;background:none;border:none;padding:14px 0;font-size:14px;font-weight:600;color:var(--black);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--body)}
.aide-q .aide-icon{font-size:18px;line-height:1;color:var(--grey);flex-shrink:0;transition:transform .2s}
.aide-item.open .aide-icon{transform:rotate(45deg)}
.aide-a{font-size:13.5px;color:var(--grey);line-height:1.65;padding:0 0 14px;display:none;white-space:pre-line}
.aide-item.open .aide-a{display:block}

/* ── Notifications ── */
.notif-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f2efe9;font-size:13.5px}
.notif-row:last-child{border-bottom:none}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.notif-date{color:var(--grey);font-size:12px;margin-left:auto;white-space:nowrap}

/* ── Assistance : boutons d'action ── */
.assist-btn{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1.5px solid var(--rule);border-radius:13px;background:#fff;font-family:var(--body);font-size:14px;font-weight:600;color:var(--black2);text-decoration:none;transition:border-color .15s,background .15s;cursor:pointer}
.assist-btn+.assist-btn{margin-top:9px}
.assist-btn:hover{border-color:var(--blue);background:var(--blue-lt)}
.assist-ico{width:40px;height:40px;border-radius:11px;background:var(--blue-lt);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.assist-txt{flex:1;min-width:0}
.assist-sub{font-size:12px;font-weight:400;color:var(--grey);margin-top:1px}
.assist-arrow{color:var(--rule);font-size:20px;flex-shrink:0;line-height:1}

/* ── Spec chips ── */
.spec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.spec-chip{font-size:11.5px;font-weight:600;background:var(--blue-lt);color:var(--blue);border-radius:100px;padding:5px 13px}

/* ── Face ID ── */
.fid-screen{text-align:center;padding:40px 0 0}
.fid-icon{font-size:52px;margin-bottom:18px}
.fid-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-family:var(--body);font-size:16px;font-weight:600;cursor:pointer;min-height:54px;margin-top:4px;transition:opacity .15s}
.fid-btn:hover:not(:disabled){opacity:.87}
.fid-btn:disabled{opacity:.5;cursor:not-allowed}
.fid-switch{display:block;text-align:center;font-size:13px;color:var(--grey);text-decoration:underline;cursor:pointer;border:none;background:none;font-family:var(--body);margin-top:16px;padding:4px}
.fid-offer{background:var(--blue-lt);border-radius:12px;padding:18px;margin-bottom:16px;text-align:center}

/* ── Footer ── */
.footer{background:#0e1f35;border-top:1px solid rgba(197,169,108,.12);padding:22px clamp(16px,5vw,64px);text-align:center;flex-shrink:0}
.footer p{font-size:11px;color:rgba(255,255,255,.3)}

@media(max-width:480px){.page-wrap{padding-top:24px}h1{font-size:30px}.mission-date{font-size:24px}}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">Loc<em>'Air</em></a>
  <button class="nav-logout hidden" id="btn-logout" onclick="logout()">Se déconnecter</button>
</nav>

<main>
  <div class="page-wrap">

    <!-- ÉCRAN 1 : identification -->
    <div id="screen-login">
      <p class="page-sub" style="margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)">Mon espace</p>
      <h1>Suivez votre <em>location</em></h1>
      <p class="page-sub">Retrouvez le statut de votre commande, vos documents et l'assistance — avec votre numéro de commande et votre email.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="f-email">Email</label>
          <input type="email" id="f-email" autocomplete="email" placeholder="marie@exemple.fr" required/>
        </div>
        <div class="form-group">
          <label for="f-ref">Numéro de commande</label>
          <input type="text" id="f-ref" autocomplete="off" placeholder="LOC-260710-8129" style="text-transform:uppercase" required/>
        </div>
        <div id="login-error" class="alert-error hidden" role="alert"></div>
        <button type="submit" class="btn-submit" id="btn-login" style="margin-top:8px">Accéder à mon espace</button>
      </form>
    </div>

    <!-- ÉCRAN Face ID -->
    <div id="screen-faceid" class="hidden">
      <div class="fid-screen">
        <div class="fid-icon">🔒</div>
        <h1 id="c-fid-greet">Bonjour 👋</h1>
        <p class="page-sub">Authentifie-toi pour accéder à ton espace.</p>
        <button class="fid-btn" id="c-fid-btn" onclick="clientFidLogin()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-1a6 6 0 0112 0v1"/><path d="M17 13s1 1.5 1 3"/><path d="M7 13s-1 1.5-1 3"/><path d="M15 9.5a3 3 0 010 5"/><path d="M9 9.5a3 3 0 000 5"/></svg>
          Face ID / Touch ID
        </button>
        <div id="c-fid-err" class="alert-error hidden" style="margin-top:14px"></div>
        <button class="fid-switch" onclick="showLoginForm()">Utiliser mon email →</button>
      </div>
    </div>

    <!-- ÉCRAN 2 : tableau de bord -->
    <div id="screen-dashboard" class="hidden">
      <div id="dash-loading" style="text-align:center;padding:60px 0;color:var(--grey)">Chargement…</div>
      <div id="dash-content" class="hidden"></div>
    </div>

  </div>
</main>

<div class="footer">
  <p>© <span id="year"></span> Loc'Air · Nice — <a href="/cgv" style="color:rgba(255,255,255,.5)">CGV</a></p>
</div>

<script src="https://js.stripe.com/v3/" defer></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

const STRIPE_PK = 'pk_live_51TeLMfFs0bamd26ewOCytZvuoYxnZvhIEYnHMxJEVjrW593LTrHWpYcFY8Sj4cL4pK64YO5v49flzW8SWlLek1dr00nJtbX09Y';
let _stripe = null;
function _getStripe(){ if(!_stripe && typeof Stripe !== 'undefined') _stripe = Stripe(STRIPE_PK); return _stripe; }
let _offreElements = {};

let _offreReturnStatus = null;
(function _captureOffreReturn(){
  const p = new URLSearchParams(window.location.search);
  if(p.get('offre_return') === '1'){
    _offreReturnStatus = p.get('redirect_status') || 'echec';
    window.history.replaceState({}, '', '/client/');
  }
})();

function escHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso+'T12:00:00Z').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function euros(cents){ return ((cents||0)/100).toFixed(2).replace('.',',')+' €'; }

const STAGES = [1,2,3,4,5,6,7];

async function apiClient(path, body){
  const token = localStorage.getItem('client_token');
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...body, token})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || 'Erreur');
  return d;
}

document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const email = document.getElementById('f-email').value.trim();
  const ref = document.getElementById('f-ref').value.trim();
  const btn = document.getElementById('btn-login');
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Recherche…';
  try{
    const r = await fetch('/api/client-login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, ref})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Erreur');
    localStorage.setItem('client_token', d.token);
    localStorage.setItem('client_ref', d.ref);
    // Réutilisé par /prolongation (même origine, localStorage partagé) pour
    // pré-remplir email + référence si jamais l'auto-connexion par jeton y
    // échoue — le client n'a alors jamais à retaper ces informations.
    localStorage.setItem('client_email', email);
    showDashboard();
  }catch(err){
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }finally{
    btn.disabled = false; btn.textContent = 'Accéder à mon espace';
  }
});

function logout(){
  localStorage.removeItem('client_token');
  localStorage.removeItem('client_ref');
  localStorage.removeItem('client_email');
  location.reload();
}

const STAGE_LABELS_FALLBACK = {
  1:'Réservation confirmée', 2:'Préparation de votre livraison', 3:'Livraison programmée',
  4:'Installation réalisée', 5:'Location en cours', 6:'Retour programmé', 7:'Location terminée',
};

function renderProgress(progress){
  if(progress.banner){
    return `<div class="banner-cancel">${escHtml(progress.banner)}</div>`;
  }
  const stage = Math.max(1, Math.min(7, progress.stage));
  const pct = Math.round((stage / 7) * 100);
  const stageLabel = progress.stageLabel || STAGE_LABELS_FALLBACK[stage] || '';
  return `
    <div class="progress-card">
      <div class="progress-header">
        <div class="progress-stage-lbl">${escHtml(stageLabel)}</div>
        <div class="progress-counter">Étape ${stage} / 7</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>
    ${progress.nextStep ? `<div class="next-step"><span>📍</span><span>${escHtml(progress.nextStep)}</span></div>` : ''}`;
}

function renderDashboard(d){
  const c = d.client, ml = d.ma_location;

  // Climatiseur résumé
  const climHead = ml.climatiseur
    ? `<div class="clim-name">${escHtml(ml.climatiseur.marque||'')} ${escHtml(ml.climatiseur.modele||'')}</div>
       <div class="clim-sub">Unité N°${escHtml(ml.climatiseur.numero)}${ml.climatiseur.puissance_btu?' · '+escHtml(ml.climatiseur.puissance_btu):''}</div>`
    : `<div class="clim-sub">Climatiseur attribué à la livraison</div>`;

  // Livraison
  const livraisonHtml = d.livraison ? `
    <div class="sect-lbl">Livraison</div>
    <div class="card">
      <div class="card-head">
        <div class="card-ico">🚚</div>

async function submitEarlyRecup(){
  const dateEl  = document.getElementById('early-recup-date');
  const btn     = document.getElementById('early-recup-btn');
  const alertEl = document.getElementById('early-recup-alert');
  if(!dateEl || !btn || !alertEl) return;
  const date = dateEl.value;
  if(!date){ alertEl.className='alert-error'; alertEl.textContent='Veuillez sélectionner une date.'; alertEl.classList.remove('hidden'); return; }
  if(!_earlyRecupCreneau){ alertEl.className='alert-error'; alertEl.textContent='Veuillez choisir un créneau.'; alertEl.classList.remove('hidden'); return; }
  alertEl.className='hidden'; alertEl.textContent='';
  btn.disabled=true; btn.textContent='Envoi…';
  try{
    await apiClient('/api/client-recup', { action:'request_early_recup', date, creneau: _earlyRecupCreneau });
    alertEl.className='alert-success';
    alertEl.textContent='Votre demande a été prise en compte. Vous allez recevoir un SMS de confirmation.';
    alertEl.classList.remove('hidden');
    btn.disabled=true; btn.textContent='Confirmé';
    dateEl.disabled=true;
    document.getElementById('lbl-creneau-1').style.pointerEvents='none';
    document.getElementById('lbl-creneau-2').style.pointerEvents='none';
  }catch(err){
    alertEl.className='alert-error';
    alertEl.textContent=err.message||'Erreur. Veuillez réessayer.';
    alertEl.classList.remove('hidden');
    btn.disabled=false; btn.textContent='Confirmer';
  }
}

async function startOffrePrivilegePayment(offreId){
  const btn = document.getElementById('offre-privilege-start-btn-'+offreId);
  const errEl = document.getElementById('offre-privilege-error-'+offreId);
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Chargement…';
  try{
    const stripe = _getStripe();
    if(!stripe) throw new Error('Paiement indisponible — désactivez votre bloqueur de publicités et réessayez.');
    const d = await apiClient('/api/offre-privilege-pay', { offre_id: offreId });
    if(!d.clientSecret) throw new Error(d.error || 'Erreur');
    const appearance = { theme:'stripe', variables:{ colorPrimary:'#1b3a5f', borderRadius:'10px', fontFamily:'Inter,system-ui,sans-serif' } };
    _offreElements[offreId] = stripe.elements({ clientSecret: d.clientSecret, appearance, locale:'fr' });
    const payEl = _offreElements[offreId].create('payment', { layout:'tabs' });
    payEl.mount('#offre-privilege-stripe-element-'+offreId);
    document.getElementById('offre-privilege-stripe-section-'+offreId).classList.remove('hidden');
    btn.classList.add('hidden');
  }catch(e){
    btn.disabled = false; btn.textContent = 'Je le garde — payer maintenant';
    errEl.textContent = e.message || 'Erreur de connexion. Réessayez.';
    errEl.classList.remove('hidden');
  }
}
async function confirmOffrePrivilegePayment(offreId){
  const payBtn = document.getElementById('offre-privilege-pay-btn-'+offreId);
  const errEl = document.getElementById('offre-privilege-error-'+offreId);
  errEl.classList.add('hidden');
  payBtn.disabled = true; payBtn.textContent = 'Paiement en cours…';
  try{
    const { error, paymentIntent } = await _getStripe().confirmPayment({
      elements: _offreElements[offreId], redirect: 'if_required',
      confirmParams: { return_url: window.location.origin + '/client/?offre_return=1' },
    });
    if(error){
      errEl.textContent = error.message || 'Paiement refusé.';
      errEl.classList.remove('hidden');
      payBtn.disabled = false; payBtn.textContent = 'Réessayer le paiement';
    }else if(paymentIntent?.status === 'succeeded'){
      document.getElementById('offre-privilege-stripe-section-'+offreId).innerHTML =
        '<div class="alert-success">✅ Merci ! Ce climatiseur est à vous.</div>';
    }else{
      errEl.textContent = 'Paiement en attente de confirmation. Vérifie ton email.';
      errEl.classList.remove('hidden');
      payBtn.disabled = false; payBtn.textContent = 'Réessayer';
    }
  }catch(e){
    errEl.textContent = 'Erreur inattendue. Réessaie.';
    errEl.classList.remove('hidden');
    payBtn.disabled = false; payBtn.textContent = 'Confirmer le paiement';
  }
}

// ── Face ID (WebAuthn plateforme) ──────────────────────────────────
const C_FID_KEY = 'c_fid';
async function cFidAvailable(){
  if(!window.PublicKeyCredential) return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return false; }
}
function cFidB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
function cFidBytes(s){ return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)); }
function showLoginForm(){
  document.getElementById('screen-faceid').classList.add('hidden');
  document.getElementById('screen-login').classList.remove('hidden');
}
async function clientFidLogin(){
  const stored = localStorage.getItem(C_FID_KEY);
  if(!stored){ showLoginForm(); return; }
  const btn = document.getElementById('c-fid-btn');
  const errEl = document.getElementById('c-fid-err');
  btn.disabled = true; btn.textContent = 'Authentification…';
  errEl.classList.add('hidden');
  try{
    await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{ type:'public-key', id:cFidBytes(stored) }],
      userVerification:'required', timeout:60000
    }});
    showDashboard();
  }catch(e){
    btn.disabled = false;
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-1a6 6 0 0112 0v1"/><path d="M17 13s1 1.5 1 3"/><path d="M7 13s-1 1.5-1 3"/><path d="M15 9.5a3 3 0 010 5"/><path d="M9 9.5a3 3 0 000 5"/></svg> Face ID / Touch ID';
    if(e.name==='NotAllowedError'){ errEl.textContent='Annulé — réessaie.'; errEl.classList.remove('hidden'); }
    else{ showLoginForm(); }
  }
}
async function offerClientFaceId(){
  if(!(await cFidAvailable()) || localStorage.getItem(C_FID_KEY)) return;
  if(document.getElementById('c-fid-offer')) return;
  const content = document.getElementById('dash-content');
  if(!content) return;
  content.insertAdjacentHTML('afterbegin',`
    <div class="fid-offer" id="c-fid-offer">
      <p style="font-size:14px;font-weight:700;margin-bottom:6px">🔒 Activer Face ID / Touch ID</p>
      <p style="font-size:12.5px;color:var(--grey);margin-bottom:14px">Se connecter d'un coup d'œil la prochaine fois.</p>
      <button class="btn-submit" style="max-width:220px;margin:0 auto 10px" onclick="activateClientFaceId()">Activer</button>
      <br><button class="fid-switch" onclick="document.getElementById('c-fid-offer').remove()">Non merci</button>
    </div>`);
}
async function activateClientFaceId(){
  try{
    const cred = await navigator.credentials.create({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp:{ name:"Loc'Air", id:location.hostname },
      user:{ id:crypto.getRandomValues(new Uint8Array(16)), name:'client', displayName:'Mon espace Loc\'Air' },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
      timeout:60000
    }});
    localStorage.setItem(C_FID_KEY, cFidB64(cred.rawId));
    const offer = document.getElementById('c-fid-offer');
    if(offer) offer.outerHTML = '<div class="alert-info" style="margin-bottom:16px">✓ Face ID activé — plus besoin de saisir vos informations à la prochaine visite.</div>';
  }catch(e){
    if(e.name!=='NotAllowedError') console.warn('Face ID register error:', e);
  }
}

  const cFidId = localStorage.getItem(C_FID_KEY);
  if(cFidId){
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-faceid').classList.remove('hidden');
    setTimeout(clientFidLogin, 350);
  } else {
    showDashboard();
  }
}
</script>
