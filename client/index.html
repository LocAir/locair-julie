<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mon espace — Loc'Air</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,700;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  /* Brand navy (issu de la charte PDF) */
  --navy:#1a2b4a;--navy-d:#12203a;
  --navy-bg:#f4f6f9;--navy-bg2:#e8ecf2;
  /* Or — accent réservé au créneau, countdown, btn-prolong */
  --gold:#c5a96c;--gold-d:#b08c48;
  /* Texte sur fond clair */
  --text:#1a1a1a;--text-2:#555555;--text-3:#888888;
  /* Surfaces */
  --bg:#f4f6f9;--card:#ffffff;
  /* Séparateurs */
  --rule:#e4e4e4;--rule-l:#f0f0f0;
  /* Status */
  --green:#16a34a;--green-bg:rgba(22,163,74,.08);
  --amber:#d97706;--amber-bg:rgba(217,119,6,.08);
  --red:#dc2626;--red-bg:rgba(220,38,38,.07);--red-border:rgba(220,38,38,.18);
  --disp:'Cormorant Garamond',Georgia,serif;
  --body:'Inter',system-ui,sans-serif;
  --r:14px;
  --sh:0 1px 3px rgba(26,43,74,.06),0 4px 16px rgba(26,43,74,.05);
  /* Compat inline JS (anciennes variables) */
  --grey:var(--text-3);--black:var(--text);--black2:var(--text-2);--rule-lt:var(--rule-l);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--navy);text-decoration:none}
.hidden{display:none!important}

/* ── Navigation ── */
.nav{position:sticky;top:0;z-index:100;min-height:58px;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:10px clamp(16px,5vw,64px);flex-shrink:0}
.nav-logo{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.nav-logo em{font-style:italic;font-weight:300;color:var(--gold)}
.nav-logout{font-size:12.5px;color:var(--text-3);background:none;border:1.5px solid var(--rule);border-radius:100px;padding:6px 14px;cursor:pointer;font-family:var(--body);transition:border-color .15s,color .15s}
.nav-logout:hover{border-color:var(--navy);color:var(--navy)}

/* ── Layout ── */
main{flex:1}
.page-wrap{max-width:640px;margin:0 auto;padding:36px clamp(16px,5vw,32px) 100px}

/* ── Login form ── */
.form-group{margin-bottom:20px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:7px}
input[type="text"],input[type="email"]{width:100%;padding:13px 15px;border:1.5px solid var(--rule);border-radius:10px;background:#fff;color:var(--text);font-family:var(--body);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--text-3)}
input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,43,74,.1)}

/* ── Boutons ── */
.btn-submit{width:100%;padding:15px;background:var(--navy);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--body);transition:opacity .18s cubic-bezier(.4,0,.2,1),transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1)}
.btn-submit:hover:not(:disabled){opacity:.9;transform:translateY(-2px);box-shadow:0 8px 24px rgba(26,43,74,.28)}
.btn-submit:active:not(:disabled){transform:translateY(0);box-shadow:0 2px 8px rgba(26,43,74,.15)}
.btn-submit:disabled{opacity:.4;cursor:default}
.btn-outline{display:block;width:100%;text-align:center;padding:13px;border:1.5px solid var(--rule);border-radius:12px;font-weight:600;font-size:14px;color:var(--text-2)}
.btn-prolong{display:block;width:100%;text-align:center;padding:16px;border:1.5px solid rgba(197,169,108,.45);border-radius:12px;font-weight:700;font-size:15px;margin:0 0 14px;letter-spacing:.01em;color:var(--gold);background:rgba(197,169,108,.08);transition:opacity .15s,transform .12s,background .15s}
.btn-prolong:hover{opacity:.9;transform:translateY(-1px);background:rgba(197,169,108,.14)}
.btn-prolong:active{transform:translateY(0)}

/* ── Actions accordion ── */
.action-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--sh)}
.action-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:20px 22px;background:none;border:none;cursor:pointer;font-family:var(--body);text-align:left;gap:12px;transition:background .18s cubic-bezier(.4,0,.2,1)}
.action-toggle:hover{background:rgba(26,43,74,.03)}
.action-toggle:hover .action-chevron{color:rgba(26,43,74,.5)}
.action-toggle-left{display:flex;align-items:center;gap:13px;flex:1;min-width:0}
.action-ico-wrap{width:38px;height:38px;border-radius:11px;background:rgba(26,43,74,.1);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.action-lbl{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:2px}
.action-sub{font-size:12px;color:var(--text-3);line-height:1.35}
.action-chevron{display:flex;align-items:center;color:rgba(26,43,74,.22);flex-shrink:0;transition:transform .22s,color .15s}
.action-chevron.open{transform:rotate(90deg);color:var(--navy)}
.action-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.action-body.open{max-height:1200px}
.action-divider{border:none;border-top:1px solid var(--rule);margin:0}

/* ── Alertes ── */
.alert-error{background:var(--red-bg);border:1px solid var(--red-border);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--red);line-height:1.6}
.alert-info{background:var(--amber-bg);border:1px solid rgba(217,119,6,.2);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--amber);line-height:1.6}
.alert-success{background:var(--green-bg);border:1px solid rgba(22,163,74,.2);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--green);line-height:1.6}

/* ── Écran login : typo ── */
h1{font-family:var(--disp);font-size:clamp(30px,6vw,44px);font-weight:300;letter-spacing:-.02em;margin-bottom:8px}
h1 em{font-style:italic}
.page-sub{font-size:13.5px;color:var(--text-3);margin-bottom:28px;line-height:1.65}

/* ── Dashboard : header ── */
.dash-eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.dash-h1{font-family:var(--disp);font-size:clamp(26px,5vw,36px);font-weight:300;letter-spacing:-.02em;margin-bottom:4px}
.dash-h1 em{font-style:italic}

/* ── Countdown ── */
.countdown{display:inline-flex;align-items:center;gap:7px;background:rgba(197,169,108,.1);color:var(--gold);border:1px solid rgba(197,169,108,.3);border-radius:100px;padding:8px 18px;font-size:13.5px;font-weight:700;margin-bottom:16px;letter-spacing:-.01em}

/* ── Progress barre ── */
.progress-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:22px 24px;margin-bottom:16px;box-shadow:var(--sh)}
.progress-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.progress-stage-lbl{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.progress-counter{font-size:12px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0}
.progress-track{height:6px;background:var(--navy-bg2);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--navy),rgba(26,43,74,.7));border-radius:100px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.next-step{display:flex;align-items:flex-start;gap:11px;background:rgba(22,163,74,.08);border-left:3px solid var(--green);border-radius:12px;padding:16px 18px;font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;line-height:1.5}
.next-step::before{content:'✓';display:flex;align-items:center;justify-content:center;width:20px;height:20px;min-width:20px;background:var(--green);color:#fff;border-radius:50%;font-size:10px;font-weight:700;margin-top:1px}
.banner-cancel{background:var(--red-bg);border-left:3px solid var(--red);border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600;color:var(--red);margin-bottom:14px}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.card-div{border:none;border-top:1px solid var(--rule);margin:16px 0}

/* En-tête de card (icône + label) */
.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.card-ico{width:38px;height:38px;border-radius:11px;background:rgba(26,43,74,.1);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.card-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--navy);opacity:.6;margin-bottom:2px}
.card-sublbl{font-size:13.5px;color:var(--text-2);font-weight:500;line-height:1.4}

/* Lignes label : valeur */
.card-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.card-row:last-child{border-bottom:none}
.card-row .lbl{color:var(--text-3)}
.card-row .val{font-weight:700;text-align:right;color:var(--navy)}

/* Section micro-label (remplace les h2) */
.sect-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:var(--navy);margin:32px 0 12px;display:flex;align-items:center;gap:8px}
.sect-lbl::before{content:'';display:block;width:3px;height:11px;background:var(--navy);border-radius:2px;flex-shrink:0;opacity:.7}
.sect-lbl:first-of-type{margin-top:0}

/* ── Mission card : date hero + créneau ── */
.mission-date{font-family:var(--disp);font-size:clamp(24px,5vw,30px);font-weight:300;letter-spacing:-.03em;color:var(--text);text-transform:capitalize;line-height:1.15;margin-bottom:9px}
.mission-creneau{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--gold);background:rgba(197,169,108,.1);border:1px solid rgba(197,169,108,.25);border-radius:100px;padding:5px 13px;margin-bottom:14px}

/* ── Consignes récupération ── */
.consigne{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;color:var(--text-3);line-height:1.5}
.consigne:last-child{border-bottom:none}
.consigne-check{width:20px;height:20px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* ── Créneau selection ── */
.creneau-btns{display:flex;gap:8px;margin-bottom:14px}
.creneau-opt{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;border:1.5px solid var(--rule);border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text-2);background:#fff;transition:border-color .18s cubic-bezier(.4,0,.2,1),background .18s,color .18s,transform .18s cubic-bezier(.4,0,.2,1);user-select:none}
.creneau-opt:hover{border-color:rgba(26,43,74,.35);background:rgba(26,43,74,.02);transform:translateY(-1px)}
.creneau-opt.active{border-color:var(--navy);background:rgba(26,43,74,.07);color:var(--navy);box-shadow:inset 0 0 0 0.5px var(--navy)}

/* ── Ma location ── */
.clim-name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:2px}
.clim-sub{font-size:12.5px;color:var(--text-3)}
.date-range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);flex-wrap:wrap}
.date-range strong{color:var(--navy);font-weight:700}
.price-display{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--navy);margin-top:8px}

/* ── Documents ── */
.doc-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.doc-row:last-child{border-bottom:none}
.doc-ico{width:34px;height:34px;border-radius:9px;background:rgba(26,43,74,.06);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-name{font-weight:600;color:var(--text-2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-sub{font-size:12px;color:var(--text-3);margin-top:1px}
.doc-btn{font-size:12.5px;font-weight:600;color:var(--navy);border:1.5px solid rgba(26,43,74,.2);border-radius:100px;padding:7px 16px;white-space:nowrap;flex-shrink:0;transition:background .18s cubic-bezier(.4,0,.2,1),border-color .18s,transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1);display:inline-flex;align-items:center;gap:5px}
.doc-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);transform:translateY(-1px);box-shadow:0 3px 10px rgba(26,43,74,.2)}
.doc-btn:active{transform:translateY(0);box-shadow:none}

/* ── Centre d'aide ── */
.aide-item{border-bottom:1px solid var(--rule)}
.aide-item:last-child{border-bottom:none}
.aide-q{width:100%;text-align:left;background:none;border:none;padding:14px 0;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--body)}
.aide-q .aide-icon{font-size:18px;line-height:1;color:var(--text-3);flex-shrink:0;transition:transform .2s}
.aide-item.open .aide-icon{transform:rotate(45deg)}
.aide-a{font-size:13.5px;color:var(--text-3);line-height:1.65;padding:0 0 14px;display:none;white-space:pre-line}
.aide-item.open .aide-a{display:block}

/* ── Notifications ── */
.notif-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.notif-row:last-child{border-bottom:none}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.notif-date{color:var(--text-3);font-size:12px;margin-left:auto;white-space:nowrap}

/* ── Assistance : boutons d'action ── */
.assist-btn{display:flex;align-items:center;gap:14px;padding:15px 17px;border:1.5px solid var(--rule);border-radius:14px;background:#fff;font-family:var(--body);font-size:14px;font-weight:600;color:var(--text-2);text-decoration:none;transition:border-color .18s cubic-bezier(.4,0,.2,1),background .18s,transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1);cursor:pointer}
.assist-btn+.assist-btn{margin-top:9px}
.assist-btn:hover{border-color:rgba(26,43,74,.3);background:rgba(26,43,74,.025);transform:translateY(-2px);box-shadow:0 4px 14px rgba(26,43,74,.1)}
.assist-btn:active{transform:translateY(0);box-shadow:none}
.assist-ico{width:42px;height:42px;border-radius:11px;background:rgba(26,43,74,.07);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.assist-txt{flex:1;min-width:0}
.assist-sub{font-size:12px;font-weight:400;color:var(--text-3);margin-top:1px}
.assist-arrow{color:rgba(26,43,74,.2);font-size:20px;flex-shrink:0;line-height:1}

/* ── Spec chips ── */
.spec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.spec-chip{font-size:11.5px;font-weight:600;background:rgba(26,43,74,.07);color:var(--navy);border-radius:100px;padding:5px 13px}

/* ── Face ID ── */
.fid-screen{text-align:center;padding:40px 0 0}
.fid-icon{font-size:52px;margin-bottom:18px;color:var(--navy)}
.fid-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-family:var(--body);font-size:16px;font-weight:700;cursor:pointer;min-height:54px;margin-top:4px;transition:opacity .18s cubic-bezier(.4,0,.2,1),transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1)}
.fid-btn:hover:not(:disabled){opacity:.9;transform:translateY(-2px);box-shadow:0 8px 24px rgba(26,43,74,.28)}
.fid-btn:active:not(:disabled){transform:translateY(0);box-shadow:none}
.fid-btn:disabled{opacity:.4;cursor:not-allowed}
.fid-switch{display:block;text-align:center;font-size:13px;color:var(--text-3);text-decoration:underline;cursor:pointer;border:none;background:none;font-family:var(--body);margin-top:16px;padding:4px}
.fid-offer{background:rgba(197,169,108,.08);border:1px solid rgba(197,169,108,.2);border-radius:12px;padding:18px;margin-bottom:16px;text-align:center}
@media(min-width:769px){.fid-offer{display:none!important}}

/* ── Footer ── */
.footer{background:var(--navy);border-top:none;padding:22px clamp(16px,5vw,64px);text-align:center;flex-shrink:0}
.footer p{font-size:11px;color:rgba(255,255,255,.45)}
.footer a{color:rgba(255,255,255,.6)}

@media(max-width:480px){.page-wrap{padding-top:24px}h1{font-size:30px}.mission-date{font-size:24px}}
/* Icônes SVG — héritent la couleur navy du conteneur */
.card-ico,.action-ico-wrap{color:var(--navy)}
.doc-ico{color:var(--text-3)}
.card-ico svg,.action-ico-wrap svg,.assist-ico svg,.doc-ico svg{display:block}
/* Icône FaceID */
.fid-icon{margin-bottom:22px;color:var(--navy)}
/* Status badge */
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:100px;margin-bottom:18px;letter-spacing:.02em}
.sb-green{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.sb-amber{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
.sb-navy{background:rgba(26,43,74,.1);color:#1a2b4a;border:1px solid rgba(26,43,74,.2)}
/* Jours restants hero */
.days-left{display:flex;align-items:center;gap:8px;margin-top:10px}
.days-left-num{font-family:var(--disp);font-size:clamp(36px,7vw,44px);font-weight:300;letter-spacing:-.03em;color:var(--navy);line-height:1}
.days-left-lbl{font-size:14px;color:var(--text-3);align-self:center}
.days-left-urgent .days-left-num{color:var(--amber)}
/* ── Skeleton loader ── */
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk{background:linear-gradient(90deg,var(--rule) 25%,var(--navy-bg2) 50%,var(--rule) 75%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:10px}
/* ── Fade-in dashboard ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#dash-content:not(.hidden){animation:fadeUp .3s cubic-bezier(.4,0,.2,1)}
/* ── Nav logo hover ── */
.nav-logo{transition:opacity .15s}
.nav-logo:hover{opacity:.75}
/* ── Btn prolong transition ── */
.btn-prolong{transition:opacity .18s cubic-bezier(.4,0,.2,1),transform .18s cubic-bezier(.4,0,.2,1),background .18s,box-shadow .18s}
.btn-prolong:hover{opacity:.9;transform:translateY(-2px);background:rgba(197,169,108,.14);box-shadow:0 4px 14px rgba(197,169,108,.2)}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">Loc<em>'Air</em></a>
  <button class="nav-logout hidden" id="btn-logout" onclick="logout()">Se déconnecter</button>
</nav>

<main>
  <div class="page-wrap">

    <!-- ÉCRAN 1 : identification -->
    <div id="screen-login">
      <p class="page-sub" style="margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)">Mon espace</p>
      <h1>Suivez votre <em>location</em></h1>
      <p class="page-sub">Retrouvez le statut de votre commande, vos documents et l'assistance — avec votre numéro de commande et votre email.</p>
      <form id="login-form">

async function apiClient(path, body){
  const token = localStorage.getItem('client_token');
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...body, token})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || 'Erreur');

  const btn = document.getElementById('btn-login');
  const errEl = document.getElementById('login-error');

function renderProgress(progress){
  if(!progress) return '';
  if(progress.banner){
    return `<div class="banner-cancel">${escHtml(progress.banner)}</div>`;
  }
  const stage = Math.max(1, Math.min(7, progress.stage));
  const pct = Math.round((stage / 7) * 100);
  const stageLabel = progress.stageLabel || STAGE_LABELS_FALLBACK[stage] || '';
  return `
    <div class="progress-card">
      <div class="progress-header">
        <div class="progress-stage-lbl">${escHtml(stageLabel)}</div>
        <div class="progress-counter">Étape ${stage} / 7</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>
    ${progress.nextStep ? `<div class="next-step">${escHtml(progress.nextStep)}</div>` : ''}`;
}

function renderStatusBadge(progress){
  if(!progress||progress.banner) return '';
  const stage=Math.max(1,Math.min(7,progress.stage||0));
  const labels={1:'Réservation confirmée',2:'En préparation',3:'Livraison programmée',4:'Installation réalisée',5:'Location active',6:'Récupération programmée',7:'Terminée'};
  const cls=stage===5?'sb-green':stage===7?'sb-navy':'sb-amber';
  return `<div class="status-badge ${cls}">${labels[stage]||''}</div>`;
}

let _earlyRecupCreneau = '';
function selectCreneau(val){
  _earlyRecupCreneau = val;
  document.getElementById('lbl-creneau-1')?.classList.toggle('active', val === '8h-10h');
  document.getElementById('lbl-creneau-2')?.classList.toggle('active', val === '10h-12h');
}

async function submitEarlyRecup(){
  const dateEl  = document.getElementById('early-recup-date');
  const btn     = document.getElementById('early-recup-btn');
  const alertEl = document.getElementById('early-recup-alert');
  if(!dateEl || !btn || !alertEl) return;
  const date = dateEl.value;
  if(!date){ alertEl.className='alert-error'; alertEl.textContent='Veuillez sélectionner une date.'; alertEl.classList.remove('hidden'); return; }
  if(!_earlyRecupCreneau){ alertEl.className='alert-error'; alertEl.textContent='Veuillez choisir un créneau.'; alertEl.classList.remove('hidden'); return; }
  alertEl.className='hidden'; alertEl.textContent='';
  btn.disabled=true; btn.textContent='Envoi…';
  try{
    await apiClient('/api/client-recup', { action:'request_early_recup', date, creneau: _earlyRecupCreneau });
    alertEl.className='alert-success';
    alertEl.textContent='Votre demande a été prise en compte. Vous allez recevoir un SMS de confirmation.';
    alertEl.classList.remove('hidden');
    btn.disabled=true; btn.textContent='Confirmé';
    dateEl.disabled=true;
    document.getElementById('lbl-creneau-1').style.pointerEvents='none';
    document.getElementById('lbl-creneau-2').style.pointerEvents='none';
    // Met à jour la date ET le créneau affichés dans la card récupération sans
    // rechargement — avant ce correctif, seule la date était rafraîchie : le
    // client qui venait de choisir un créneau (8h-10h / 10h-12h) ne le voyait
    // jamais apparaître (le chip créneau n'existe même pas dans le DOM tant
    // qu'aucun créneau n'était déjà défini côté serveur).
    const recupDateDisplay = document.getElementById('recup-date-display');
    if(recupDateDisplay) recupDateDisplay.textContent = fmtDate(date);
    const recupCreneauDisplay = document.getElementById('recup-creneau-display');
    if(recupCreneauDisplay){
      recupCreneauDisplay.innerHTML = _ICO.clock + ' ' + _earlyRecupCreneau;
      recupCreneauDisplay.style.display = '';
    }
  }catch(err){
    if(err.message === 'Non autorisé'){ logout(); return; }
    alertEl.className='alert-error';
    alertEl.textContent=err.message||'Erreur. Veuillez réessayer.';
    alertEl.classList.remove('hidden');
    btn.disabled=false; btn.textContent='Confirmer';
  }
}

// ── Actions accordion ──
function toggleAction(id){
  const body=document.getElementById('action-body-'+id);
  const chev=document.getElementById('action-chevron-'+id);
  if(!body) return;
  const open=body.classList.toggle('open');
  if(chev) chev.classList.toggle('open',open);
  if(open && id==='prolong') initProlongSection();
  // Reset au fermeture pour charger des données fraîches à la prochaine ouverture
  if(!open && id==='prolong') _prolongData=null;
}

// ── Prolongation inline ──
let _prolongData=null,_prolongStripeEl=null,_prolongNewDate='',_prolongCents=0;
function _pAddDay(iso){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10);}
function _pBase(d){d=Math.max(1,d);if(d<=7)return d*12;if(d<=14)return 84+(d-7)*10;if(d<=21)return 154+(d-14)*9;return 217+(d-21)*8;}
function _pDiff(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000);}
function _pFmtLong(iso){if(!iso) return '—'; return new Date(iso+'T12:00:00Z').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}

async function initProlongSection(){
  if(_prolongData) return;
  const loadEl=document.getElementById('prolong-loading');
  const step2=document.getElementById('prolong-step-2');
  const errEl=document.getElementById('prolong-error');
  try{
    const r=await fetch('/api/prolong-lookup',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({token:localStorage.getItem('client_token')})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Erreur serveur');
    _prolongData=d;
    if(loadEl) loadEl.style.display='none';
    const inp=document.getElementById('prolong-newdate');
    if(inp) inp.min=_pAddDay(_prolongData.date_fin);
    const dl=document.getElementById('prolong-dates-lbl');
    if(dl) dl.textContent=`Contrat en cours : ${fmtDate(_prolongData.date_debut)} → ${fmtDate(_prolongData.date_fin)} (${_prolongData.orig_days} j)`;
    if(step2) step2.style.display='block';
  }catch(e){
    if(loadEl) loadEl.style.display='none';
    if(errEl){errEl.textContent=e.message;errEl.classList.remove('hidden');}
  }
}

function updateProlongPrice(){
  if(!_prolongData) return;
  _prolongNewDate=document.getElementById('prolong-newdate')?.value||'';
  const priceBox=document.getElementById('prolong-price-box');
  if(!_prolongNewDate||_prolongNewDate<=_prolongData.date_fin){
    if(priceBox) priceBox.classList.add('hidden');
    updateProlongBtnState(); return;
  }
  document.getElementById('prolong-error')?.classList.add('hidden');
  const ext=_pDiff(_prolongData.date_fin,_prolongNewDate);
  const tot=_prolongData.orig_days+ext;
  const price=(_pBase(tot)-_pBase(_prolongData.orig_days))*(_prolongData.quantite||1);
  _prolongCents=price*100;
  document.getElementById('prolong-price-days').textContent=`+ ${ext} jour${ext>1?'s':''}`;
  document.getElementById('prolong-price-amount').textContent=`${price.toFixed(2).replace('.',',')} €`;
  document.getElementById('prolong-price-note').textContent=`Récupération le ${_pFmtLong(_pAddDay(_prolongNewDate))}`;
  if(priceBox) priceBox.classList.remove('hidden');
  updateProlongBtnState();
}

function updateProlongBtnState(){
  const payBtn=document.getElementById('prolong-pay-btn');
  const payLbl=document.getElementById('prolong-pay-label');
  const valid=_prolongData&&_prolongNewDate&&_prolongNewDate>_prolongData.date_fin&&document.getElementById('prolong-cgv')?.checked;
  if(payBtn) payBtn.disabled=!valid;
  if(payLbl) payLbl.textContent=_prolongCents>0?`${(_prolongCents/100).toFixed(2).replace('.',',')} €`:'—';
}

async function submitProlong(){
  if(!_prolongData||!_prolongNewDate) return;
  const payBtn=document.getElementById('prolong-pay-btn');
  const errEl=document.getElementById('prolong-error');
  payBtn.disabled=true; payBtn.textContent='Préparation…';
  errEl?.classList.add('hidden');
  try{
    const r=await fetch('/api/prolong-pay',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({email:_prolongData.email,ref:_prolongData.ref,new_date_fin:_prolongNewDate,cgv_accepted:true,cgv_accepted_at:new Date().toISOString()})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Erreur serveur');
    _prolongCents=d.amountCents;
    document.getElementById('prolong-step-2').style.display='none';
    document.getElementById('prolong-step-3').style.display='block';
    document.getElementById('prolong-summary-detail').textContent=`+${d.jours} jour${d.jours>1?'s':''} — jusqu'au ${_pFmtLong(d.newDateFin)}`;
    document.getElementById('prolong-summary-price').textContent=(d.amountCents/100).toLocaleString('fr-FR')+' €';
    const cb=document.getElementById('prolong-confirm-btn');
    if(cb) cb.textContent=`Payer ${(d.amountCents/100).toLocaleString('fr-FR')} €`;
    const stripe=_getStripe();
    if(!stripe) throw new Error('Module paiement indisponible. Désactivez votre bloqueur de pub.');
    const app={theme:'night',variables:{colorPrimary:'#c5a96c',colorBackground:'#0d1d33',colorText:'#f0ece4',colorTextSecondary:'#a09880',borderRadius:'10px',fontFamily:'Inter,system-ui,sans-serif'}};
    _prolongStripeEl=stripe.elements({clientSecret:d.clientSecret,appearance:app,locale:'fr'});
    const pe=_prolongStripeEl.create('payment');
    document.getElementById('prolong-payment-element').innerHTML='';
    pe.mount('#prolong-payment-element');
    pe.on('ready',()=>{const b=document.getElementById('prolong-confirm-btn');if(b)b.disabled=false;});
  }catch(e){
    if(errEl){errEl.textContent=e.message;errEl.classList.remove('hidden');}
    payBtn.disabled=false;
    payBtn.innerHTML=`Payer <span id="prolong-pay-label">${_prolongCents>0?_prolongCents/100+' €':'—'}</span>`;
  }
}

function backToStep2Prolong(){
  document.getElementById('prolong-step-2').style.display='block';
  document.getElementById('prolong-step-3').style.display='none';
  _prolongStripeEl=null;
}

async function confirmProlong(){
  const cb=document.getElementById('prolong-confirm-btn');
  const errEl=document.getElementById('prolong-payment-error');
  cb.disabled=true; cb.textContent='Paiement en cours…';
  errEl?.classList.add('hidden');
  try{
    const{error,paymentIntent}=await _getStripe().confirmPayment({elements:_prolongStripeEl,redirect:'if_required',confirmParams:{return_url:window.location.origin+'/client/?prolong_return=1'}});
    if(error){
      if(errEl){errEl.textContent=error.message;errEl.classList.remove('hidden');}
      cb.disabled=false; cb.textContent='Réessayer le paiement';
    }else if(paymentIntent?.status==='succeeded'){
      document.getElementById('prolong-step-3').style.display='none';
      document.getElementById('prolong-step-success').style.display='block';
      const msg=document.getElementById('prolong-success-msg');
      if(msg) msg.textContent=`Votre location est prolongée jusqu'au ${_pFmtLong(_prolongNewDate)}. Un email de confirmation vous a été envoyé.`;
    }else{
      if(errEl){errEl.textContent='Paiement en attente de confirmation. Vérifiez votre email.';errEl.classList.remove('hidden');}
      cb.disabled=false; cb.textContent='Réessayer';
    }
  }catch(e){
    if(errEl){errEl.textContent='Erreur inattendue. Réessayez.';errEl.classList.remove('hidden');}
    cb.disabled=false; cb.textContent='Réessayer le paiement';
  }
}

async function startOffrePrivilegePayment(offreId){
  const btn = document.getElementById('offre-privilege-start-btn-'+offreId);
  const errEl = document.getElementById('offre-privilege-error-'+offreId);
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Chargement…';
  try{
    const stripe = _getStripe();
    if(!stripe) throw new Error('Paiement indisponible — désactivez votre bloqueur de publicités et réessayez.');
    const d = await apiClient('/api/offre-privilege-pay', { offre_id: offreId });
    if(!d.clientSecret) throw new Error(d.error || 'Erreur');
    const appearance = { theme:'stripe', variables:{ colorPrimary:'#1a2b4a', borderRadius:'10px', fontFamily:'Inter,system-ui,sans-serif' } };
    _offreElements[offreId] = stripe.elements({ clientSecret: d.clientSecret, appearance, locale:'fr' });
    const payEl = _offreElements[offreId].create('payment', { layout:'tabs' });
    payEl.mount('#offre-privilege-stripe-element-'+offreId);
    document.getElementById('offre-privilege-stripe-section-'+offreId).classList.remove('hidden');
    btn.classList.add('hidden');
  }catch(e){
    btn.disabled = false; btn.textContent = 'Je le garde — payer maintenant';
    errEl.textContent = e.message || 'Erreur de connexion. Réessayez.';
    errEl.classList.remove('hidden');
  }
}
async function confirmOffrePrivilegePayment(offreId){
  const payBtn = document.getElementById('offre-privilege-pay-btn-'+offreId);
  const errEl = document.getElementById('offre-privilege-error-'+offreId);
  errEl.classList.add('hidden');
  payBtn.disabled = true; payBtn.textContent = 'Paiement en cours…';
  try{
    const { error, paymentIntent } = await _getStripe().confirmPayment({
      elements: _offreElements[offreId], redirect: 'if_required',
      confirmParams: { return_url: window.location.origin + '/client/?offre_return=1' },
    });
    if(error){
      errEl.textContent = error.message || 'Paiement refusé.';
      errEl.classList.remove('hidden');
      payBtn.disabled = false; payBtn.textContent = 'Réessayer le paiement';
    }else if(paymentIntent?.status === 'succeeded'){
      document.getElementById('offre-privilege-stripe-section-'+offreId).innerHTML =
        '<div class="alert-success">✅ Merci ! Ce climatiseur est à vous.</div>';
    }else{
      errEl.textContent = 'Paiement en attente de confirmation. Vérifie ton email.';
      errEl.classList.remove('hidden');
      payBtn.disabled = false; payBtn.textContent = 'Réessayer';
    }
  }catch(e){
    errEl.textContent = 'Erreur inattendue. Réessaie.';
    errEl.classList.remove('hidden');
    payBtn.disabled = false; payBtn.textContent = 'Confirmer le paiement';
  }
}

async function showDashboard(){
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('screen-faceid').classList.add('hidden');
  document.getElementById('screen-dashboard').classList.remove('hidden');
  document.getElementById('dash-loading').classList.remove('hidden');
  document.getElementById('dash-content').classList.add('hidden');
  document.getElementById('btn-logout').classList.remove('hidden');
  try{
    const d = await apiClient('/api/client-dashboard', {});
    renderDashboard(d);
    document.getElementById('dash-loading').classList.add('hidden');
    document.getElementById('dash-content').classList.remove('hidden');
    if(_offreReturnStatus){
      const status = _offreReturnStatus; _offreReturnStatus = null;
      const banner = status === 'succeeded'
        ? '<div class="alert-success" style="margin-bottom:14px">✅ Paiement confirmé après vérification bancaire — ce climatiseur est à vous !</div>'
        : status === 'processing'
        ? '<div class="alert-info" style="margin-bottom:14px">⏳ Votre banque valide encore le paiement. Ça peut prendre quelques minutes — revenez un peu plus tard pour confirmer.</div>'
        : '<div class="alert-error" style="margin-bottom:14px">❌ Le paiement n\'a pas abouti après la vérification bancaire. Vous pouvez réessayer depuis l\'offre ci-dessous.</div>';
      document.getElementById('dash-content').insertAdjacentHTML('afterbegin', banner);
    }
    if(_prolongReturnStatus){
      const status = _prolongReturnStatus; _prolongReturnStatus = null;
      const banner = status === 'succeeded'
        ? '<div class="alert-success" style="margin-bottom:14px">✅ Prolongation confirmée après vérification bancaire — votre location est bien prolongée !</div>'
        : status === 'processing'
        ? '<div class="alert-info" style="margin-bottom:14px">⏳ Votre banque valide encore le paiement de votre prolongation. Ça peut prendre quelques minutes — revenez un peu plus tard pour confirmer.</div>'
        : '<div class="alert-error" style="margin-bottom:14px">❌ Le paiement de votre prolongation n\'a pas abouti après la vérification bancaire. Vous pouvez réessayer depuis « Prolonger ma location » ci-dessous.</div>';
      document.getElementById('dash-content').insertAdjacentHTML('afterbegin', banner);
    }
    setTimeout(offerClientFaceId, 1200);
  }catch(err){
    document.getElementById('dash-loading').innerHTML = `<div class="alert-error" style="text-align:left">${escHtml(err.message)}</div><button class="btn-outline" onclick="logout()" style="margin-top:12px">Retour</button>`;
  }
}

// ── Face ID (WebAuthn plateforme) ──────────────────────────────────
const C_FID_KEY = 'c_fid';
async function cFidAvailable(){
  if(!window.PublicKeyCredential) return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return false; }
}
function cFidB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
function cFidBytes(s){ return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)); }
function showLoginForm(){
  document.getElementById('screen-faceid').classList.add('hidden');
  document.getElementById('screen-login').classList.remove('hidden');
}
async function clientFidLogin(){
  const stored = localStorage.getItem(C_FID_KEY);
  if(!stored){ showLoginForm(); return; }
  const btn = document.getElementById('c-fid-btn');
  const errEl = document.getElementById('c-fid-err');
  btn.disabled = true; btn.textContent = 'Authentification…';
  errEl.classList.add('hidden');
  try{
    await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{ type:'public-key', id:cFidBytes(stored) }],
      userVerification:'required', timeout:60000
    }});
    showDashboard();
  }catch(e){
    btn.disabled = false;
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-1a6 6 0 0112 0v1"/><path d="M17 13s1 1.5 1 3"/><path d="M7 13s-1 1.5-1 3"/><path d="M15 9.5a3 3 0 010 5"/><path d="M9 9.5a3 3 0 000 5"/></svg> Face ID / Touch ID';
    if(e.name==='NotAllowedError'){ errEl.textContent='Annulé — réessaie.'; errEl.classList.remove('hidden'); }
    else{ showLoginForm(); }
  }
}
async function offerClientFaceId(){
  if(!(await cFidAvailable()) || localStorage.getItem(C_FID_KEY)) return;
  if(document.getElementById('c-fid-offer')) return;
  const content = document.getElementById('dash-content');
  if(!content) return;
  content.insertAdjacentHTML('afterbegin',`
    <div class="fid-offer" id="c-fid-offer">
      <p style="font-size:14px;font-weight:700;margin-bottom:6px">Activer Face ID / Touch ID</p>
      <p style="font-size:12.5px;color:var(--grey);margin-bottom:14px">Se connecter d'un coup d'œil la prochaine fois.</p>
      <button class="btn-submit" style="max-width:220px;margin:0 auto 10px" onclick="activateClientFaceId()">Activer</button>
      <br><button class="fid-switch" onclick="document.getElementById('c-fid-offer').remove()">Non merci</button>
    </div>`);
}
async function activateClientFaceId(){
  try{
    const cred = await navigator.credentials.create({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp:{ name:"Loc'Air", id:location.hostname },
      user:{ id:crypto.getRandomValues(new Uint8Array(16)), name:'client', displayName:'Mon espace Loc\'Air' },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
      timeout:60000
    }});
    localStorage.setItem(C_FID_KEY, cFidB64(cred.rawId));
    const offer = document.getElementById('c-fid-offer');
    if(offer) offer.outerHTML = '<div class="alert-info" style="margin-bottom:16px">✓ Face ID activé — plus besoin de saisir vos informations à la prochaine visite.</div>';
  }catch(e){
    if(e.name!=='NotAllowedError') console.warn('Face ID register error:', e);
  }
}

if(localStorage.getItem('client_token')){
  const cFidId = localStorage.getItem(C_FID_KEY);
  if(cFidId){
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-faceid').classList.remove('hidden');
    setTimeout(clientFidLogin, 350);
  } else {
    showDashboard();
  }
}
</script>
