/* ————————————————————————————————————————————————————————————
   Icônes : wrapper autour de la version "vanilla" de Lucide (UMD),
   chargée en <script> classique (compatible avec la CSP du site,
   qui n'autorise que 'self' + quelques domaines précis en script-src,
   pas d'import ES module depuis un CDN tiers). React ne possède que le
   <span> conteneur : le SVG interne est posé une fois en DOM impérative,
   jamais diffé par React → pas de conflit entre les deux moteurs.
   ———————————————————————————————————————————————————————————— */
function Icon({ name, size = 18, className = "", strokeWidth = 2 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.lucide || !window.lucide[name]) return;
    const svg = window.lucide.createElement(window.lucide[name]);
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("stroke-width", strokeWidth);
    ref.current.innerHTML = "";
    ref.current.appendChild(svg);
  }, [name, size, strokeWidth]);
  return <span ref={ref} className={`inline-flex shrink-0 ${className}`} style={{ lineHeight: 0 }} />;
}

  const profile = profiles.find((p) => p.id === profileId) || profiles[0];

  const [generating, setGenerating] = useState(false);
  const [generated, setGenerated] = useState(false);
  const [tab, setTab] = useState("template");
  const [editMode, setEditMode] = useState(false);
  const [values, setValues] = useState({ title: CONTENT.en.title, price: PROPERTY.priceValue, body: CONTENT.en.body });

  // Les textes affichés suivent la langue choisie tant qu'on n'a pas commencé à éditer à la main.
  useEffect(() => {
    if (!editMode) setValues({ title: CONTENT[lang].title, price: PROPERTY.priceValue, body: CONTENT[lang].body });
  }, [lang]);

  async function handleAnalyze() {
    if (!templateUrl.trim() || analyzing) return;
    setAnalyzing(true);
    setAnalyzed(false);
    setTab("template");
    await sleep(1500);
    setAnalyzing(false);
    setAnalyzed(true);
    pushToast("6 blocs détectés dans la mise en page du modèle.", "success");
  }

  async function handleGenerate() {
    if (generating) return;
    setGenerating(true);
    setGenerated(false);
    setEditMode(false);
    if (!analyzed) { setAnalyzing(true); await sleep(900); setAnalyzing(false); setAnalyzed(true); }
    const steps = [
      "Extraction des données de la fiche…",
      "Extraction des images…",
      `Traduction en cours (→ ${LANGS.find((l) => l.code === lang).label})…`,
      "Application de la charte graphique de l'agence…",
    ];
    for (const s of steps) {
      pushToast(s, "progress");
      await sleep(700);
    }
    setValues({ title: CONTENT[lang].title, price: PROPERTY.priceValue, body: CONTENT[lang].body });
    setGenerating(false);
    setGenerated(true);
    setTab("generated");
    pushToast("Rendu PDF prêt !", "success");
  }

  function onDrop(e) {
    e.preventDefault();
    setDragging(false);
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) setFileName(f.name);
  }

  function handleShare() {
    const url = `https://rebrand-immo.app/f/${uid()}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).catch(() => {});
    }
    pushToast("Lien de partage copié dans le presse-papiers !", "success");
  }

  function handleDownload() {
    pushToast("Ouverture de l'export PDF…", "progress");
    setTimeout(() => window.print(), 400);
  }

  return (
    <div className="p-4 md:p-8 max-w-[1400px] mx-auto">
      {/* Setup modèle */}
      <div className="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm">
        <label className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2 block">URL de l'Annonce Modèle (Template)</label>
        <div className="flex flex-col sm:flex-row gap-2.5">
          <div className="relative flex-1">
            <Icon name="Link2" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
            <input
              value={templateUrl}
              onChange={(e) => setTemplateUrl(e.target.value)}
              placeholder="https://www.orpi.com/vente-appartement..."
              className="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-300"
            />
          </div>
          <button onClick={handleAnalyze} disabled={analyzing}
            className="shrink-0 inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white text-sm font-bold px-4 py-2.5 rounded-xl transition-colors">
            {analyzing ? <Icon name="Loader2" size={16} className="animate-spin" /> : <Icon name="Search" size={16} />}
            {analyzing ? "Analyse en cours…" : "Analyser & Enregistrer la Structure"}
          </button>
        </div>
        {analyzed && !analyzing && (
          <div className="mt-3 flex flex-wrap gap-1.5">
            {STRUCTURE_BLOCKS.map((b) => (
              <span key={b.label} className="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 text-[11px] font-semibold px-2 py-1 rounded-full border border-emerald-100">
                <Icon name="CheckCircle2" size={11} /> {b.label}
              </span>
            ))}
          </div>
        )}
      </div>

      <div className="grid lg:grid-cols-[380px_1fr] gap-6">
        {/* Colonne gauche */}
        <div className="space-y-5">
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
            <p className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2.5">Nouvelle Fiche / Photo / PDF à transposer</p>
            <div
              onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
              onDragLeave={() => setDragging(false)}
              onDrop={onDrop}
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              className={`rounded-xl border-2 border-dashed p-6 text-center cursor-pointer transition-colors
                ${dragging ? "border-indigo-400 bg-indigo-50" : "border-slate-200 bg-slate-50 hover:border-indigo-300 hover:bg-indigo-50/50"}`}
            >
              <input ref={fileInputRef} type="file" className="hidden" onChange={(e) => e.target.files[0] && setFileName(e.target.files[0].name)} />
              <Icon name="UploadCloud" size={26} className="mx-auto text-indigo-400 mb-2" />
              <p className="text-xs text-slate-500">Glissez-déposez un fichier ici, ou cliquez pour parcourir</p>
              <p className="text-[10px] text-slate-400 mt-1">PDF, JPG, PNG — 20 Mo max</p>
            </div>
            {fileName && (
              <div className="mt-2.5 flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                <span className="flex items-center gap-2 text-xs font-medium text-slate-600 truncate">
                  <Icon name="FileText" size={14} className="text-indigo-500 shrink-0" /> <span className="truncate">{fileName}</span>
                </span>
                <button onClick={(e) => { e.stopPropagation(); setFileName(null); }} className="text-slate-400 hover:text-red-500 shrink-0">
                  <Icon name="X" size={14} />
                </button>
              </div>
            )}
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <div>
              <label className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5 flex items-center gap-1.5"><Icon name="Globe" size={13} /> Langue de sortie</label>
              <div className="relative">
                <select value={lang} onChange={(e) => setLang(e.target.value)}
                  className="w-full appearance-none px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-300">
                  {LANGS.map((l) => <option key={l.code} value={l.code}>{l.label}</option>)}
                </select>
                <Icon name="ChevronDown" size={15} className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
              </div>
            </div>
            <div>
              <label className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5 flex items-center gap-1.5"><Icon name="Building2" size={13} /> Profil Agence</label>
              <div className="relative">
                <select value={profileId} onChange={(e) => setProfileId(Number(e.target.value))}
                  className="w-full appearance-none px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-300">
                  {profiles.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <Icon name="ChevronDown" size={15} className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
              </div>
            </div>
          </div>

          <button onClick={handleGenerate} disabled={generating}
            className="w-full inline-flex items-center justify-center gap-2.5 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-70 text-white font-extrabold text-sm tracking-wide py-4 rounded-2xl shadow-lg shadow-emerald-500/25 transition-colors">
            {generating ? <Icon name="Loader2" size={19} className="animate-spin" /> : <Icon name="Zap" size={19} />}
            {generating ? "GÉNÉRATION EN COURS…" : "GÉNÉRER LA FICHE (1-CLIC)"}
          </button>
        </div>

        {/* Colonne droite : aperçu */}
        <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
          <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 mb-5 w-fit">
            <button onClick={() => setTab("template")}
              className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-colors ${tab === "template" ? "bg-white text-indigo-700 shadow-sm" : "text-slate-500"}`}>
              Aperçu du Modèle
            </button>
            <button onClick={() => generated && setTab("generated")}
              className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5
                ${tab === "generated" ? "bg-white text-emerald-700 shadow-sm" : "text-slate-400"} ${!generated ? "cursor-not-allowed opacity-50" : ""}`}>
              Fiche Générée (Branded PDF) {generated && <Icon name="CheckCircle2" size={12} className="text-emerald-500" />}
            </button>
          </div>

          {tab === "template" ? (
            <TemplateSkeleton analyzed={analyzed} analyzing={analyzing} />
          ) : (
            <GeneratedFlyer profile={profile} lang={lang} edit={editMode} values={values}
              onChange={(k, v) => setValues((s) => ({ ...s, [k]: v }))} />
          )}

          {tab === "generated" && generated && (
            <div className="flex flex-wrap gap-2 justify-center mt-6 print:hidden">
              <button onClick={handleDownload} className="inline-flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-colors">
                <Icon name="Download" size={14} /> Télécharger le PDF HD
              </button>
              <button onClick={() => { setEditMode((v) => !v); if (!editMode) pushToast("Mode édition activé — modifiez les textes directement sur l'aperçu.", "success"); }}
                className={`inline-flex items-center gap-2 text-xs font-bold px-4 py-2.5 rounded-xl border transition-colors
                  ${editMode ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-600 border-slate-200 hover:border-indigo-300"}`}>
                <Icon name="Edit3" size={14} /> {editMode ? "Terminer l'édition" : "Éditer les textes"}
              </button>
              <button onClick={handleShare} className="inline-flex items-center gap-2 bg-white text-slate-600 border border-slate-200 hover:border-indigo-300 text-xs font-bold px-4 py-2.5 rounded-xl transition-colors">
                <Icon name="Share2" size={14} /> Partager le lien
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ————————————————————————————————————————————————————————————
   Page : Configuration Agence
   ———————————————————————————————————————————————————————————— */
function ConfigPage({ profiles, setProfiles, pushToast }) {
  const [editingId, setEditingId] = useState(profiles[0].id);
  const editing = profiles.find((p) => p.id === editingId);
  const [draft, setDraft] = useState(editing);
  const [logoPreview, setLogoPreview] = useState(null);
  const fileRef = useRef(null);

  useEffect(() => { setDraft(profiles.find((p) => p.id === editingId)); setLogoPreview(null); }, [editingId]);

  function save() {
    setProfiles((list) => list.map((p) => (p.id === editingId ? { ...draft } : p)));
    pushToast(`Profil « ${draft.name} » mis à jour !`, "success");
  }

  function onLogo(e) {
    const f = e.target.files[0];
    if (f) setLogoPreview(URL.createObjectURL(f));
  }

  return (
    <div className="p-4 md:p-8 max-w-3xl mx-auto">
      <p className="text-sm text-slate-500 mb-6">Gérez le logo, les couleurs et les coordonnées de chaque agence. Ces réglages alimentent automatiquement le pied de page et l'en-tête des fiches générées.</p>

      <div className="flex gap-1.5 mb-5 flex-wrap">
        {profiles.map((p) => (
          <button key={p.id} onClick={() => setEditingId(p.id)}
            className={`px-3.5 py-2 rounded-xl text-xs font-bold border transition-colors
              ${editingId === p.id ? "bg-indigo-600 border-indigo-600 text-white" : "bg-white border-slate-200 text-slate-600 hover:border-indigo-300"}`}>
            {p.name}
          </button>
        ))}
      </div>

      {draft && (
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-5">
          <div className="flex items-center gap-4">
            <div onClick={() => fileRef.current.click()} className="w-16 h-16 rounded-xl flex items-center justify-center text-white text-lg font-extrabold cursor-pointer overflow-hidden shrink-0" style={{ background: draft.color }}>
              {logoPreview ? <img src={logoPreview} className="w-full h-full object-cover" /> : draft.initials}
            </div>
            <div>
              <button onClick={() => fileRef.current.click()} className="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-700">
                <Icon name="UploadCloud" size={14} /> Changer le logo
              </button>
              <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onLogo} />
              <p className="text-[11px] text-slate-400 mt-1">PNG ou SVG, fond transparent recommandé</p>
            </div>
          </div>

          <div className="grid sm:grid-cols-2 gap-4">
            <Field label="Nom de l'agence"><input value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} className="ri-input" /></Field>
            <Field label="Site web"><input value={draft.website} onChange={(e) => setDraft({ ...draft, website: e.target.value })} className="ri-input" /></Field>
            <Field label="Téléphone"><input value={draft.phone} onChange={(e) => setDraft({ ...draft, phone: e.target.value })} className="ri-input" /></Field>
            <Field label="Email"><input value={draft.email} onChange={(e) => setDraft({ ...draft, email: e.target.value })} className="ri-input" /></Field>
            <Field label="Couleur principale">
              <div className="flex items-center gap-2">
                <input type="color" value={draft.color} onChange={(e) => setDraft({ ...draft, color: e.target.value })} className="w-10 h-10 rounded-lg border border-slate-200 cursor-pointer" />
                <input value={draft.color} onChange={(e) => setDraft({ ...draft, color: e.target.value })} className="ri-input flex-1" />
              </div>
            </Field>
            <Field label="Couleur secondaire">
              <div className="flex items-center gap-2">
                <input type="color" value={draft.secondary} onChange={(e) => setDraft({ ...draft, secondary: e.target.value })} className="w-10 h-10 rounded-lg border border-slate-200 cursor-pointer" />
                <input value={draft.secondary} onChange={(e) => setDraft({ ...draft, secondary: e.target.value })} className="ri-input flex-1" />
              </div>
            </Field>
          </div>

          <button onClick={save} className="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-5 py-2.5 rounded-xl transition-colors">
            <Icon name="Save" size={15} /> Enregistrer les modifications
          </button>
        </div>
      )}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="block">
      <span className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-1.5 block">{label}</span>
      {children}
    </label>
  );
}

/* ————————————————————————————————————————————————————————————
   Page : Modèles Sauvegardés
   ———————————————————————————————————————————————————————————— */
function TemplatesPage({ templates, setTemplates, onUse, pushToast }) {
  return (
    <div className="p-4 md:p-8 max-w-4xl mx-auto">
      <p className="text-sm text-slate-500 mb-6">Les structures de mise en page déjà analysées. Réutilisez-les en un clic sans repasser par l'étape d'analyse.</p>
      <div className="grid sm:grid-cols-2 gap-4">
        {templates.map((t) => (
          <div key={t.id} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col">
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <p className="font-bold text-slate-800 text-sm truncate">{t.name}</p>
                <p className="text-[11px] text-slate-400 truncate mt-0.5">{t.url}</p>
              </div>
              <button onClick={() => { setTemplates((l) => l.filter((x) => x.id !== t.id)); pushToast("Modèle supprimé.", "success"); }}
                className="text-slate-300 hover:text-red-500 shrink-0">
                <Icon name="Trash2" size={15} />
              </button>
            </div>
            <div className="flex items-center gap-2 mt-3">
              <span className="inline-flex items-center gap-1 bg-indigo-50 text-indigo-700 text-[10px] font-bold px-2 py-1 rounded-full"><Icon name="Layers" size={10} /> {t.blocks} blocs</span>
              <span className="text-[10px] text-slate-400">Analysé le {t.date}</span>
            </div>
            <button onClick={() => onUse(t)} className="mt-4 inline-flex items-center justify-center gap-1.5 bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 text-slate-600 text-xs font-bold py-2 rounded-xl border border-slate-200 transition-colors">
              Utiliser ce modèle <Icon name="ArrowRight" size={13} />
            </button>
          </div>
        ))}
        {templates.length === 0 && (
          <div className="sm:col-span-2 text-center py-14 text-sm text-slate-400">Aucun modèle sauvegardé pour le moment.</div>
        )}
      </div>
    </div>
  );
}

/* ————————————————————————————————————————————————————————————
   Page : Paramètres / Abonnement
   ———————————————————————————————————————————————————————————— */
function SettingsPage({ pushToast }) {
  const usage = 134, quota = 200;
  return (
    <div className="p-4 md:p-8 max-w-3xl mx-auto space-y-6">
      <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <p className="text-xs font-bold uppercase tracking-wide text-indigo-600 flex items-center gap-1.5"><Icon name="ShieldCheck" size={13} /> Plan actif</p>
            <p className="text-2xl font-extrabold text-slate-900 mt-1">Pro — 49 € / mois</p>
          </div>
          <button onClick={() => pushToast("Redirection vers le portail de facturation… (démo)", "success")}
            className="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2.5 rounded-xl transition-colors">
            <Icon name="CreditCard" size={15} /> Gérer l'abonnement
          </button>
        </div>
        <ul className="grid sm:grid-cols-2 gap-2.5 mt-5">
          {["Fiches illimitées", "6 langues de traduction", "Branding multi-agences", "Export PDF haute définition"].map((f) => (
            <li key={f} className="flex items-center gap-2 text-sm text-slate-600"><Icon name="Check" size={15} className="text-emerald-500 shrink-0" /> {f}</li>
          ))}
        </ul>
      </div>

      <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
        <p className="text-sm font-bold text-slate-700 mb-3">Utilisation ce mois-ci</p>
        <div className="flex items-center justify-between text-xs text-slate-500 mb-1.5">
          <span>{usage} fiches générées</span><span>{quota} incluses</span>
        </div>
        <div className="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
          <div className="h-full bg-indigo-500 rounded-full" style={{ width: `${Math.min(100, (usage / quota) * 100)}%` }} />
        </div>
        <p className="text-[11px] text-slate-400 mt-3">Prochaine facturation le 15/09/2026.</p>
      </div>

      <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
        <p className="text-sm font-bold text-slate-700 mb-3">Comparer les plans</p>
        <div className="grid sm:grid-cols-2 gap-3">
          <div className="rounded-xl border border-slate-200 p-4">
            <p className="text-sm font-bold text-slate-700">Starter — 19 €/mois</p>
            <p className="text-[11px] text-slate-400 mt-1">20 fiches / mois · 2 langues · 1 agence</p>
          </div>
          <div className="rounded-xl border-2 border-indigo-500 p-4 relative">
            <span className="absolute -top-2.5 right-3 bg-indigo-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full">Plan actif</span>
            <p className="text-sm font-bold text-slate-700">Pro — 49 €/mois</p>
            <p className="text-[11px] text-slate-400 mt-1">Illimité · 6 langues · multi-agences</p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ————————————————————————————————————————————————————————————
   App racine
   ———————————————————————————————————————————————————————————— */
function App() {
  const [page, setPage] = useState("dashboard");
  const [profiles, setProfiles] = useState(INITIAL_PROFILES);
  const [templates, setTemplates] = useState(INITIAL_TEMPLATES);
  const [toasts, setToasts] = useState([]);
  const [dashKey, setDashKey] = useState(0);
  const [pendingTemplate, setPendingTemplate] = useState(null);

  function pushToast(text, tone = "progress") {
    const id = uid();
    setToasts((t) => [...t, { id, text, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }

  function useTemplate(t) {
    setPendingTemplate(t.url);
    setDashKey((k) => k + 1); // force le remontage du Dashboard avec la nouvelle URL préremplie
    setPage("dashboard");
    pushToast(`Modèle « ${t.name} » chargé sur le Dashboard.`, "success");
  }

  return (
    <div className="min-h-screen flex">
      <Sidebar active={page} onNavigate={setPage} />
      <div className="flex-1 min-w-0 flex flex-col">
        <Header page={page} />
        <main className="flex-1">
          {page === "dashboard" && <DashboardPage key={dashKey} profiles={profiles} pushToast={pushToast} initialUrl={pendingTemplate} />}
          {page === "config" && <ConfigPage profiles={profiles} setProfiles={setProfiles} pushToast={pushToast} />}
          {page === "templates" && <TemplatesPage templates={templates} setTemplates={setTemplates} onUse={useTemplate} pushToast={pushToast} />}
          {page === "settings" && <SettingsPage pushToast={pushToast} />}
        </main>
      </div>
      <ToastStack toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
