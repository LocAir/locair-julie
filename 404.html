<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page introuvable | Loc'Air</title>
<meta name="robots" content="noindex,follow"/>
<meta name="theme-color" content="#1b3558"/>
<style>
:root{
  --navy:#1b3558;--navy-2:#162d4a;--gold:#b8952a;
  --cream:#ece7db;--paper:#faf8f4;--text:#1a2e44;
  --sub:#6e8599;--border:rgba(27,53,88,.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);background:var(--cream);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.nav{background:var(--cream);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:26px 52px}
.logo{font-family:Didot,'GFS Didot','Bodoni MT',Georgia,serif;font-size:22px;font-weight:400;color:var(--navy);text-decoration:none;letter-spacing:-.01em}
.logo em{font-style:italic;color:var(--gold)}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px}
.code{font-size:clamp(72px,15vw,120px);font-family:Didot,'GFS Didot','Bodoni MT',Georgia,serif;font-weight:400;color:var(--border);line-height:1;letter-spacing:-.04em;margin-bottom:16px}
h1{font-family:Didot,'GFS Didot','Bodoni MT',Georgia,serif;font-size:clamp(22px,4vw,32px);font-weight:400;color:var(--navy);margin-bottom:12px;letter-spacing:-.01em}
p{font-size:16px;color:var(--sub);max-width:420px;line-height:1.7;margin-bottom:32px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:14px 28px;border-radius:2px;font-size:15px;font-weight:500;text-decoration:none;transition:background .15s}
.cta:hover{background:var(--navy-2)}
.footer{padding:20px 52px;text-align:center;font-size:11px;color:var(--sub);border-top:1px solid var(--border)}
.footer a{color:var(--sub);text-decoration:none}
.footer a:hover{opacity:.7}
@media(max-width:540px){.nav,.footer{padding:20px 24px}}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="logo">Loc<em>'Air</em></a>
</nav>
<div class="wrap">
  <div class="code">404</div>
  <h1>Cette page n'existe pas</h1>
  <p>Il fait peut-être trop chaud pour retrouver votre chemin. Retournez à l'accueil — le climatiseur vous attend.</p>
  <a href="/" class="cta">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    Retour à l'accueil
  </a>
</div>
<footer class="footer">
  <p>© 2026 Loc'Air · <a href="/mentions-legales">Mentions légales</a> · <a href="/cgv">CGV</a> · <a href="/confidentialite">Confidentialité</a></p>
</footer>
</body>
</html>
