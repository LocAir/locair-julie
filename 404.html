<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page introuvable | Loc'Air</title>
<meta name="robots" content="noindex,follow"/>
<meta name="theme-color" content="#0E1F35"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="/marque.css">
<style>
:root{
  --navy:var(--ink); /* le marine de la charte */
  --navy-d:var(--ink); /* le marine de la charte */
  --navy-bg:var(--mist); /* la brume */
  --navy-bg2:var(--line); /* le gris des filets */
  --gold:var(--gold-txt); /* l'or sur fond clair — voir MARQUE.md */
  --gold-d:var(--gold-txt); /* l'or sur fond clair */
  --text:var(--ink); /* le marine de la charte */
  --text-2:var(--ink-2); /* texte secondaire */
  --text-3:var(--ink-3); /* texte discret */
  --card:var(--paper); /* le blanc */
  --rule:var(--line); /* le gris des filets */
  --rule-l:var(--line); /* le gris des filets */
  --r:14px;
  --sh:0 1px 3px rgba(14,31,53,.06),0 4px 16px rgba(14,31,53,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--text);
  background:var(--navy-bg);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ── Navigation ── */
.nav{
  height:64px;
  background:var(--card);
  border-bottom:1px solid var(--rule);
  display:flex;
  align-items:center;
  padding:0 clamp(20px,5vw,80px);
  box-shadow:var(--sh);
}
.logo{
  
  font-size:22px;
  font-weight:700;
  color:var(--navy);
  text-decoration:none;
  letter-spacing:-.03em;
}
.logo span{color:var(--gold)}

/* ── Contenu central ── */
.wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 24px 60px;
}

.code{
  font-family:var(--font-titre);
  font-size:clamp(100px,18vw,160px);
  font-weight:700;
  color:rgba(14,31,53,.12);
  line-height:1;
  letter-spacing:-.04em;
  margin-bottom:8px;
  user-select:none;
}

.icon-wrap{
  width:72px;
  height:72px;
  background:var(--navy-bg2);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 24px;
}
.icon-wrap svg{
  color:var(--navy);
  opacity:.6;
}

h1{
  font-family:var(--font-titre);
  font-size:clamp(26px,4vw,38px);
  font-weight:700;
  color:var(--navy);
  margin-bottom:14px;
  letter-spacing:-.01em;
  line-height:1.2;
}

p{
  font-family:var(--font);
  font-size:16px;
  color:var(--text-2);
  max-width:400px;
  line-height:1.7;
  margin-bottom:36px;
}

.cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--vif);
  color:#fff;
  padding:14px 28px;
  border-radius:12px;
  font-family:var(--font);
  font-size:15px;
  font-weight:700;
  text-decoration:none;
  transition:background .15s,transform .12s;
  box-shadow:0 2px 8px rgba(14,31,53,.18);
}
.cta:hover{
  background:var(--navy-d);
  transform:translateY(-1px);
}
.cta svg{flex-shrink:0}

/* ── Footer ── */
.footer{
  background:var(--navy);
  padding:24px 24px;
  text-align:center;
}
.footer p{
  font-size:12px;
  color:rgba(255,255,255,.5);
  margin-bottom:0;
  max-width:none;
}
.footer a{
  color:rgba(255,255,255,.65);
  text-decoration:none;
  transition:color .15s;
}
.footer a:hover{color:#fff}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="logo">Loc<i class="gt">'</i>Air</a>
</nav>

<div class="wrap">
  <div class="code">404</div>

  <div class="icon-wrap">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </div>

  <h1>Cette page est introuvable</h1>
  <p>On a cherché partout — elle n'existe pas (ou plus). Retournez à l'accueil, on vous trouve quelque chose de mieux.</p>

  <a href="/" class="cta">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Retourner à l'accueil
  </a>
</div>

<footer class="footer">
  <p>© 2026 Loc'Air · <a href="/mentions-legales">Mentions légales</a> · <a href="/cgv">CGV</a> · <a href="/confidentialite">Confidentialité</a></p>
</footer>

</body>
</html>
