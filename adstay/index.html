<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<meta name="theme-color" content="#060b17"/>
<title>AdStay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap"/>
<style>
:root{
  --encre:#060b17; --encre2:#0c1322; --ivoire:#f2ede4; --doux:#9298a6; --discret:#5f6676;
  --champagne:#c9a66b; --trait:rgba(242,237,228,.12);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:Jost,system-ui,sans-serif;
  --marge:clamp(16px,4vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--encre);color:var(--ivoire);font-family:var(--sans);font-weight:300;
  user-select:none;-webkit-user-select:none;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
main{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.petit{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:400}

/* Bandeau photo */
.hero{position:relative;height:clamp(300px,42vh,460px);background:#0b1a2e center/cover no-repeat;display:flex;flex-direction:column;
  justify-content:space-between;padding:clamp(18px,3vw,36px) var(--marge)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,23,.45),rgba(6,11,23,0) 35%,rgba(6,11,23,.35) 65%,var(--encre))}
.hero > *{position:relative}
.hero .haut{display:flex;justify-content:space-between;align-items:center}
.hero .logo{height:clamp(44px,5vw,64px);width:auto}
.hero .region{color:rgba(242,237,228,.85)}
.hero .bas{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.hero .bienvenue .petit{color:var(--champagne)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(72px,10vw,150px);line-height:.9;letter-spacing:-.01em;margin:10px 0 6px}
.hero .date{color:rgba(242,237,228,.8);font-size:17px;text-transform:capitalize}
.meteo{text-align:right;white-space:nowrap}
.meteo .heure{font-size:clamp(34px,4vw,56px);font-weight:300;line-height:1;display:flex;gap:16px;justify-content:flex-end;align-items:baseline}
.meteo .degres{font-family:var(--serif);font-size:.85em;color:var(--champagne)}
.meteo .degres:empty{display:none}
.meteo .temps{margin-top:8px;color:rgba(242,237,228,.75)}

/* Navigation */
nav{position:sticky;top:0;z-index:5;background:rgba(6,11,23,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--trait);
  display:flex;align-items:center;gap:24px;padding:0 var(--marge)}
.onglets{flex:1;display:flex;gap:clamp(18px,2.4vw,36px);overflow-x:auto;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:none;padding:24px 0 22px;color:var(--doux);border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.onglet[aria-pressed="true"]{color:var(--ivoire);border-color:var(--champagne)}
.recherche{flex:none;display:flex;align-items:center;gap:10px;width:clamp(180px,22vw,320px);border-bottom:1px solid var(--trait);padding:8px 0}
.recherche svg{width:18px;height:18px;stroke:var(--doux);flex:none}
.recherche input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ivoire);font:inherit;font-size:16px}
.recherche input::placeholder{color:var(--discret)}

/* Contenu */
.contenu{padding:0 var(--marge) 60px}
section{padding-top:clamp(40px,5vw,64px)}
.titre-section{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
.titre-section .petit{color:var(--champagne);display:block;margin-bottom:10px}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.6vw,52px);line-height:1}
.titre-section p{color:var(--doux);max-width:36ch;text-align:right}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border-top:1px solid var(--trait)}
.service{display:flex;flex-direction:column;gap:14px;padding:26px 22px 26px 0;border-bottom:1px solid var(--trait);transition:opacity .2s}
.service:active{opacity:.6}
.service svg{width:30px;height:30px;stroke:var(--champagne);stroke-width:1.2}
.service b{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.1}
.service span{color:var(--doux);font-size:15px}

.une{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(20px,2.5vw,36px)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:clamp(20px,2.5vw,36px) clamp(16px,2vw,28px)}
.carte{display:flex;flex-direction:column;gap:16px;transition:opacity .2s}
.carte:active{opacity:.7}
.image{position:relative;aspect-ratio:4/3;border-radius:4px;overflow:hidden;background:var(--encre2)}
.une .image{aspect-ratio:5/4}
.image img{width:100%;height:100%;object-fit:cover;display:block}
.image .label{position:absolute;left:14px;top:14px;padding:7px 12px;background:rgba(6,11,23,.55);backdrop-filter:blur(8px);
  color:var(--ivoire);font-size:11px;letter-spacing:.24em;text-transform:uppercase;border-radius:2px}
.carte .cat{color:var(--champagne)}
.carte .nom{font-family:var(--serif);font-weight:500;font-size:clamp(26px,2.2vw,32px);line-height:1.05;margin-top:-6px}
.une .carte .nom{font-size:clamp(32px,3vw,44px)}
.carte .acc{color:var(--doux);font-size:16px;margin-top:-6px}
.carte .offre{color:var(--ivoire);font-size:15px;display:flex;gap:12px;align-items:center}
.carte .offre::before{content:"";width:22px;height:1px;background:var(--champagne);flex:none}
.vide{color:var(--doux);text-align:center;padding:80px 0;font-family:var(--serif);font-size:28px}
.signature{text-align:center;color:var(--discret);margin-top:72px}

/* Fiche détaillée */
.voile{position:fixed;inset:0;background:rgba(3,6,12,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;
  padding:clamp(12px,3vw,48px);z-index:20}
.voile.ouvert{display:flex}
.fiche{position:relative;width:min(1080px,100%);max-height:100%;overflow-y:auto;background:var(--encre2);display:grid;grid-template-columns:1fr 1fr;
  border-radius:4px;animation:monte .35s cubic-bezier(.2,.7,.2,1)}
@keyframes monte{from{transform:translateY(16px);opacity:0}}
.fiche .photo{min-height:420px;background:var(--encre) center/cover no-repeat}
.fiche .photo.sans{display:grid;place-items:center;background:linear-gradient(160deg,#16233b,#0a1120)}
.fiche .photo.sans svg{width:90px;height:90px;stroke:var(--champagne);stroke-width:.8}
.fiche .texte{padding:clamp(28px,4vw,56px);display:flex;flex-direction:column;gap:18px}
.fiche .petit{color:var(--champagne)}
.fiche h3{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4vw,60px);line-height:.95}
.fiche .desc{color:#cfd2da;font-size:18px;line-height:1.6}
.fiche .offre{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--champagne);padding:16px 0;border-top:1px solid var(--trait);border-bottom:1px solid var(--trait)}
.infos{list-style:none;display:flex;flex-direction:column;gap:12px;font-size:16px;color:#cfd2da}
.infos li{display:flex;gap:14px;align-items:center}
.infos svg{width:18px;height:18px;stroke:var(--champagne);flex:none}
.qr{display:flex;gap:18px;align-items:center;margin-top:auto;padding-top:10px;color:var(--doux);font-size:15px}
.qr img{width:120px;height:120px;background:#fff;padding:8px;border-radius:2px;flex:none}
.fermer{position:absolute;right:18px;top:18px;z-index:2;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:rgba(6,11,23,.55);backdrop-filter:blur(8px);border:1px solid var(--trait)}
.fermer svg{width:20px;height:20px;stroke:var(--ivoire)}

/* Diaporama de veille */
.veille{position:fixed;inset:0;z-index:50;background:#000;display:none;cursor:pointer}
.veille.active{display:block}
.diapo{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(28px,6vw,96px);
  opacity:0;transition:opacity 1.4s;overflow:hidden}
.diapo .fond{position:absolute;inset:0;z-index:0;background:#0b1a2e center/cover no-repeat}
.diapo.visible .fond{animation:zoom 12s ease-out both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.diapo.visible{opacity:1}
.diapo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.72))}
.diapo > :not(.fond){position:relative;z-index:2}
.diapo .cat{color:var(--champagne)}
.diapo .titre{font-family:var(--serif);font-size:clamp(64px,9vw,150px);font-weight:400;line-height:.95;margin:14px 0 18px}
.diapo .acc{font-size:clamp(20px,2.2vw,32px);font-weight:300;max-width:28ch;color:rgba(242,237,228,.9)}
.diapo .offre{margin-top:26px;font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.4vw,34px);color:var(--champagne);display:flex;align-items:center;gap:16px}
.diapo .offre::before{content:"";width:40px;height:1px;background:var(--champagne)}
.diapo.accueil{justify-content:center;align-items:center;text-align:center}
.diapo.accueil .ville{font-family:var(--serif);font-weight:400;font-size:clamp(120px,22vw,340px);line-height:.9;color:#fbf6ec;text-shadow:0 4px 40px rgba(0,0,0,.2)}
.diapo.accueil .sous{margin-top:clamp(14px,2vw,30px);font-size:clamp(14px,1.6vw,22px);letter-spacing:.3em;text-transform:uppercase;font-weight:400}
.diapo.accueil .trait{width:clamp(50px,6vw,90px);height:1px;background:rgba(255,255,255,.8);margin:clamp(18px,2.5vw,34px) auto 0}
.veille .logo{position:absolute;left:clamp(28px,6vw,96px);top:clamp(24px,4vw,56px);height:clamp(48px,6vw,80px);z-index:2}
.veille .haut{position:absolute;right:clamp(28px,6vw,96px);top:clamp(36px,5vw,70px);z-index:2;display:flex;gap:clamp(20px,4vw,60px);color:rgba(255,255,255,.85)}
.veille .heure{position:absolute;right:clamp(28px,6vw,96px);bottom:clamp(28px,6vw,96px);z-index:2;font-size:clamp(40px,5vw,80px);font-weight:300}
.veille .touche{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);z-index:2;animation:pulse 3s infinite}
@keyframes pulse{50%{opacity:.3}}

@media (max-width:800px){
  nav{flex-direction:column;align-items:stretch;gap:0}
  .recherche{width:auto;margin:6px 0 10px}
  .onglet{padding:16px 0 14px}
  .titre-section{flex-direction:column;align-items:flex-start} .titre-section p{text-align:left}
  .fiche{grid-template-columns:1fr} .fiche .photo{min-height:240px}
  .hero .region{display:none}
  .veille .heure{display:none}
}
</style>
</head>
<body>
<main id="defile">
  <header class="hero" id="hero">
    <div class="haut">
      <img class="logo" src="/adstay/logo-transparent.webp" alt="AdStay"/>
      <span class="petit region" id="regionHaut"></span>
    </div>
    <div class="bas">
      <div class="bienvenue">
        <span class="petit">Bienvenue chez vous</span>
        <h1 id="ville"></h1>
        <p class="date" id="date"></p>
      </div>
      <div class="meteo">
        <div class="heure"><span id="heure"></span><span class="degres" id="degres"></span></div>
        <div class="temps petit" id="temps"></div>
      </div>
    </div>
  </header>

  <nav>
    <div class="onglets petit" id="chips"></div>
    <label class="recherche">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Rechercher" autocomplete="off"/>
    </label>
  </nav>

  <div class="contenu" id="liste"></div>
</main>

<div class="voile" id="voile"><div class="fiche" id="fiche"></div></div>

<div class="veille" id="veille">
  <img class="logo" src="/adstay/logo-transparent.webp" alt=""/>
  <div class="haut petit"><span id="region"></span><span id="compteur"></span></div>
  <div id="diapos"></div>
  <div class="heure" id="heureVeille"></div>
  <div class="touche petit">Touchez l’écran pour découvrir la sélection</div>
</div>

<script src="/adstay/donnees.js"></script>
<script>
const D = window.ADSTAY;
const $ = s => document.querySelector(s);

// Petites icônes (traits simples, couleur = currentColor ou stroke en CSS)
const ICONES = {
  tout: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  restaurant: '<path d="M7 2v9M4 2v5a3 3 0 0 0 6 0V2M7 11v11M17 2c-2 2-3 5-3 8h3v12"/>',
  bar: '<path d="M5 3h14l-7 9zM12 12v8M8 21h8"/>',
  plage: '<path d="M12 4a8 8 0 0 1 8 8H4a8 8 0 0 1 8-8zM12 12v9M3 21h18"/>',
  activite: '<path d="M3 20l6-11 4 6 3-4 5 9z"/><circle cx="17" cy="5" r="2"/>',
  voiture: '<path d="M3 13l2-6h14l2 6v5h-3M6 18H3v-5h18"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/>',
  scooter: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-2-7h-3M15 5h3l1 5"/>',
  boutique: '<path d="M4 8h16l-1 13H5zM8 8V6a4 4 0 0 1 8 0v2"/>',
  cadeau: '<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8c-2-4-6-4-6-1s6 1 6 1c2-4 6-4 6-1s-6 1-6 1"/>',
  lieu: '<path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  tel: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
  menage: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/>',
  linge: '<path d="M8 3 3 6l2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 0 1-8 0z"/>',
  bebe: '<path d="M3 10h18v8H3zM3 18v3M21 18v3M7 10v8M11 10v8M15 10v8M3 10V6M21 10V6"/>',
  cle: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/>',
  courses: '<path d="M3 4h2l2.5 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>',
  horloge: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  croix: '<path d="M6 6l12 12M18 6 6 18"/>',
};
const svg = (nom, cls = '') =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONES[nom] || ''}</svg>`;
const echap = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const formule = id => D.formules.find(f => f.id === id) || { rang: 0, diaporama: 0, badge: '' };
const categorie = id => D.categories.find(c => c.id === id) || { nom: '', icone: 'boutique' };
// Photo à la bonne taille (les photos Unsplash sont redimensionnées à la volée)
const photo = (c, w) => !c.photo ? '' : c.photo.includes('images.unsplash.com')
  ? `${c.photo}${c.photo.includes('?') ? '&' : '?'}w=${w}&q=70&auto=format&fit=crop` : c.photo;
const degrade = c => `linear-gradient(135deg,${c.couleur?.[0] || '#16233b'},${c.couleur?.[1] || '#0a1120'})`;
const fond = (c, w) => c.photo ? `background-image:url('${encodeURI(photo(c, w))}')` : `background-image:${degrade(c)}`;

// Ordre : la formule la plus chère d'abord. À formule égale, l'ordre change chaque jour
// (tirage stable sur la journée) pour que personne ne soit toujours dernier.
const graine = new Date().toDateString();
const hash = s => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) | 0, 7);
const tries = [...D.commercants].sort((a, b) =>
  formule(b.formule).rang - formule(a.formule).rang || hash(graine + a.id) - hash(graine + b.id));

let filtreCat = 'tout', filtreTexte = '';

function chips() {
  const services = D.services?.length ? [{ id: 'services', nom: 'Services' }] : [];
  const toutes = [{ id: 'tout', nom: 'Accueil' }, ...services, ...D.categories]
    .filter(c => c.id === 'tout' || c.id === 'services' || D.commercants.some(m => m.categorie === c.id));
  $('#chips').innerHTML = toutes.map(c =>
    `<button class="onglet" data-cat="${c.id}" aria-pressed="${c.id === filtreCat}">${echap(c.nom)}</button>`).join('');
}

function carte(c, grand) {
  const f = formule(c.formule), cat = categorie(c.categorie);
  return `<button class="carte" data-id="${c.id}">
    <div class="image" style="${c.photo ? '' : `background:${degrade(c)}`}">
      ${c.photo ? `<img src="${echap(photo(c, grand ? 1100 : 700))}" alt="" loading="lazy"/>` : ''}
      ${f.badge ? `<span class="label">${echap(f.badge)}</span>` : ''}
    </div>
    <span class="cat petit">${echap(cat.nom)}</span>
    <span class="nom">${echap(c.nom)}</span>
    <span class="acc">${echap(c.accroche)}</span>
    ${c.offre ? `<span class="offre">${echap(c.offre)}</span>` : ''}
  </button>`;
}

function tuile(s) {
  return `<button class="service" data-service="${s.id}">
    ${svg(s.icone)}
    <b>${echap(s.nom)}</b>
    <span>${echap(s.prix || 'Sur demande')}</span>
  </button>`;
}

function liste() {
  const q = filtreTexte.trim().toLowerCase();
  const servicesVus = (D.services || []).filter(s =>
    ['tout', 'services'].includes(filtreCat) &&
    (!q || [s.nom, s.description].join(' ').toLowerCase().includes(q)));
  const visibles = filtreCat === 'services' ? [] : tries.filter(c =>
    (filtreCat === 'tout' || c.categorie === filtreCat) &&
    (!q || [c.nom, c.accroche, c.description, categorie(c.categorie).nom].join(' ').toLowerCase().includes(q)));
  // « À la une » : uniquement sur l'accueil, pour la formule la plus haute.
  const rangMax = Math.max(...D.formules.map(f => f.rang));
  const une = filtreCat === 'tout' && !q ? visibles.filter(c => formule(c.formule).rang === rangMax) : [];
  const reste = visibles.filter(c => !une.includes(c));
  const titre = (surtitre, t, texte = '') => `<div class="titre-section"><div><span class="petit">${surtitre}</span><h2>${t}</h2></div>${texte ? `<p>${texte}</p>` : ''}</div>`;
  let html = '';
  if (servicesVus.length) html += `<section>${titre('Conciergerie', 'Pour votre séjour', 'Touchez un service, puis scannez le code avec votre téléphone pour le demander.')}<div class="services">${servicesVus.map(tuile).join('')}</div></section>`;
  if (une.length) html += `<section>${titre('À la une', 'Notre sélection')}<div class="une">${une.map(c => carte(c, true)).join('')}</div></section>`;
  if (reste.length) html += `<section>${titre(filtreCat === 'tout' ? 'Les adresses' : 'Catégorie', filtreCat === 'tout' ? 'Autour de vous' : echap(categorie(filtreCat).nom))}<div class="grille">${reste.map(c => carte(c)).join('')}</div></section>`;
  if (!visibles.length && !servicesVus.length) html = `<p class="vide">Aucune adresse ne correspond à votre recherche.</p>`;
  html += `<p class="signature petit">Sélection AdStay · ${echap(D.ville.nom)}</p>`;
  $('#liste').innerHTML = html;
  // Après un changement d'onglet : on remonte juste sous la photo
  const dessous = $('#hero').offsetHeight;
  if ($('#defile').scrollTop > dessous) $('#defile').scrollTop = dessous;
}

function lienQR(c) {
  const cible = c.lien || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.nom + ', ' + c.adresse);
  return 'https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=0&data=' + encodeURIComponent(cible);
}

function ouvrir(id) {
  const c = D.commercants.find(m => m.id === id); if (!c) return;
  const f = formule(c.formule), cat = categorie(c.categorie);
  $('#fiche').innerHTML = `
    <button class="fermer" data-fermer aria-label="Fermer">${svg('croix')}</button>
    <div class="photo ${c.photo ? '' : 'sans'}" style="${fond(c, 1200)}">${c.photo ? '' : svg(cat.icone)}</div>
    <div class="texte">
      <span class="petit">${echap(cat.nom)}${f.badge ? ` · ${echap(f.badge)}` : ''}</span>
      <h3>${echap(c.nom)}</h3>
      <p class="desc">${echap(c.description || c.accroche)}</p>
      ${c.offre ? `<p class="offre">${echap(c.offre)}</p>` : ''}
      <ul class="infos">
        ${c.adresse ? `<li>${svg('lieu')}${echap(c.adresse)}</li>` : ''}
        ${c.tel ? `<li>${svg('tel')}${echap(c.tel)}</li>` : ''}
        ${c.horaires ? `<li>${svg('horloge')}${echap(c.horaires)}</li>` : ''}
      </ul>
      <div class="qr"><img src="${lienQR(c)}" alt="QR code"/>
        <span>Scannez avec votre téléphone pour ${c.lien ? 'réserver' : 'obtenir l’itinéraire'}.</span></div>
    </div>`;
  $('#voile').classList.add('ouvert');
}
// Demande de service : QR code vers WhatsApp (message déjà écrit), sinon vers le téléphone.
const logement = new URLSearchParams(location.search).get('logement') || '';
function ouvrirService(id) {
  const s = (D.services || []).find(x => x.id === id); if (!s) return;
  const cc = D.conciergerie || {};
  const message = `Bonjour, je souhaite commander : ${s.nom}${logement ? ` (logement ${logement})` : ''}.`;
  const cible = cc.whatsapp ? `https://wa.me/${cc.whatsapp}?text=${encodeURIComponent(message)}`
    : cc.tel ? `tel:${cc.tel.replace(/\s/g, '')}` : '';
  $('#fiche').innerHTML = `
    <button class="fermer" data-fermer aria-label="Fermer">${svg('croix')}</button>
    <div class="photo sans">${svg(s.icone)}</div>
    <div class="texte">
      <span class="petit">Service · ${echap(cc.nom || 'votre hôte')}</span>
      <h3>${echap(s.nom)}</h3>
      <p class="desc">${echap(s.description)}</p>
      <p class="offre">${echap(s.prix || 'Prix sur demande')}</p>
      ${cc.tel ? `<ul class="infos"><li>${svg('tel')}${echap(cc.tel)}</li></ul>` : ''}
      ${cible ? `<div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=0&data=${encodeURIComponent(cible)}" alt="QR code"/>
        <span>Scannez avec votre téléphone pour ${cc.whatsapp ? 'commander sur WhatsApp' : 'appeler'}.</span></div>`
        : `<p class="qr">Pour commander, contactez votre hôte avec votre messagerie habituelle.</p>`}
    </div>`;
  $('#voile').classList.add('ouvert');
}
const fermer = () => $('#voile').classList.remove('ouvert');

// Interactions
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.onglet'); if (!b) return;
  filtreCat = b.dataset.cat; chips(); liste();
});
$('#q').addEventListener('input', e => { filtreTexte = e.target.value; liste(); });
$('#liste').addEventListener('click', e => {
  const b = e.target.closest('.carte'); if (b) return ouvrir(b.dataset.id);
  const s = e.target.closest('.service'); if (s) ouvrirService(s.dataset.service);
});
$('#voile').addEventListener('click', e => { if (e.target.id === 'voile' || e.target.closest('[data-fermer]')) fermer(); });

// Horloge, date, météo
function horloge() {
  const n = new Date();
  const h = n.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const deg = $('#degres').textContent;
  $('#heure').textContent = h; $('#heureVeille').textContent = deg ? `${h} · ${deg}` : h;
  $('#date').textContent = n.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
// Météo via notre serveur (une seule demande partagée par toutes les tablettes)
const CIEL = [[0,'Ensoleillé','Ciel dégagé'],[1,'Peu nuageux','Peu nuageux'],[3,'Nuageux','Nuageux'],[45,'Brouillard','Brouillard'],
  [51,'Bruine','Bruine'],[61,'Pluie','Pluie'],[71,'Neige','Neige'],[80,'Averses','Averses'],[95,'Orage','Orage']];
let meteoRetry;
async function meteo() {
  clearTimeout(meteoRetry);
  try {
    const r = await fetch(`/api/adstay-meteo?lat=${D.ville.lat}&lon=${D.ville.lon}`);
    if (!r.ok) throw new Error(r.status);
    const m = await r.json();
    const ciel = CIEL.filter(([c]) => m.code >= c).pop();
    $('#degres').textContent = `${m.temperature}°`;
    $('#temps').textContent = m.jour ? ciel[1] : ciel[2];
    horloge();
  } catch {
    meteoRetry = setTimeout(meteo, 2 * 60000); // nouvel essai dans 2 minutes
  }
}

// Diaporama de veille : seulement les formules qui y donnent droit
const diapos = D.commercants.flatMap(c => Array(formule(c.formule).diaporama || 0).fill(c));
// On évite deux fois la même marque d'affilée
for (let i = 1; i < diapos.length; i++) if (diapos[i] === diapos[i - 1]) {
  const j = diapos.findIndex((d, k) => k > i && d !== diapos[i] && d !== diapos[i - 2]);
  if (j > 0) [diapos[i], diapos[j]] = [diapos[j], diapos[i]];
}
const accueil = `
  <div class="diapo accueil">
    <div class="fond" style="background-image:url('${encodeURI(D.ville.photo || '')}')"></div>
    <span class="ville">${echap(D.ville.nom)}</span>
    <span class="sous">Bienvenue chez vous · Welcome home</span>
    <span class="trait"></span>
  </div>`;
$('#region').textContent = $('#regionHaut').textContent = D.ville.region || '';
$('#hero').style.backgroundImage = D.ville.photo ? `url('${encodeURI(D.ville.photo)}')` : '';
$('#diapos').innerHTML = accueil + diapos.map(c => `
  <div class="diapo">
    <div class="fond" style="${fond(c, 1920)}"></div>
    <span class="cat petit">${echap(categorie(c.categorie).nom)}</span>
    <span class="titre">${echap(c.nom)}</span>
    <span class="acc">${echap(c.accroche)}</span>
    ${c.offre ? `<span class="offre">${echap(c.offre)}</span>` : ''}
  </div>`).join('');

let minuteur, tourne, indice = 0;
function diapoSuivante() {
  const els = document.querySelectorAll('.diapo'); if (!els.length) return;
  els.forEach(e => e.classList.remove('visible'));
  const n = indice++ % els.length;
  els[n].classList.add('visible');
  const deux = x => String(x).padStart(2, '0');
  $('#compteur').textContent = `${deux(n + 1)} / ${deux(els.length)}`;
}
function veille() {
  // Chaque mise en veille repart de la diapo « Bienvenue »
  fermer(); indice = 0; $('#veille').classList.add('active'); diapoSuivante();
  tourne = setInterval(diapoSuivante, D.veille.dureeDiapo * 1000);
}
function reveil() {
  if ($('#veille').classList.contains('active')) {
    $('#veille').classList.remove('active'); clearInterval(tourne);
    // Retour à l'accueil, propre pour le prochain voyageur
    filtreCat = 'tout'; filtreTexte = ''; $('#q').value = ''; chips(); liste(); $('#defile').scrollTop = 0;
  }
  clearTimeout(minuteur);
  minuteur = setTimeout(veille, D.veille.apresSecondes * 1000);
}
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, reveil, { passive: true }));
document.addEventListener('contextmenu', e => e.preventDefault());

// ?veille dans l'adresse : lance directement le diaporama (pratique pour tester)
$('#ville').textContent = D.ville.nom;
chips(); liste(); horloge(); meteo(); reveil();
setInterval(horloge, 15000); setInterval(meteo, 30 * 60000);
if (new URLSearchParams(location.search).has('veille')) veille();
</script>
</body>
</html>
