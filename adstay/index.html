<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<meta name="theme-color" content="#f4efe7"/>
<title>AdStay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap"/>
<style>
/* AdStay — application tablette. Ivoire, encre et laiton : l'esprit d'un palace. */
:root{
  --ivoire:#f4efe7; --papier:#fbf8f3; --sable:#e9e1d4; --encre:#1b2430; --encre2:#2a3442;
  --texte2:#5b616c; --gris:#8c9099; --laiton:#a8844c; --laiton2:#c9a66b;
  --trait:rgba(27,36,48,.09);
  --ombre:0 1px 2px rgba(27,36,48,.04),0 18px 40px -22px rgba(27,36,48,.28);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:Jost,system-ui,sans-serif;
  --r:22px; --ecart:clamp(12px,1.4vw,20px); --rail:132px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ivoire);color:var(--encre);font-family:var(--sans);font-weight:300;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.petit{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
.touche{transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .18s}
.touche:active{transform:scale(.975)}

.app{height:100%;display:grid;grid-template-columns:var(--rail) 1fr}

/* ── Menu latéral ───────────────────────────────────────── */
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 0 18px;border-right:1px solid var(--trait);background:var(--papier);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .logo{width:104px;margin-bottom:16px}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.nav button{width:112px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 4px;border-radius:18px;color:var(--texte2);font-size:13px;text-align:center;line-height:1.2}
.nav .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:background .25s,color .25s}
.nav svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.5}
.nav button[aria-current="true"]{color:var(--encre);font-weight:400}
.nav button[aria-current="true"] .ico{background:var(--encre);color:var(--ivoire)}
.rail .meteo-rail{margin-top:auto;padding-top:12px;text-align:center;color:var(--texte2);font-size:13px}
.rail .meteo-rail b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--encre);line-height:1}

/* ── Écrans ─────────────────────────────────────────────── */
main{position:relative;overflow:hidden}
.ecran{position:absolute;inset:0;overflow-y:auto;padding:clamp(18px,2.4vw,36px);-webkit-overflow-scrolling:touch;animation:entre .4s cubic-bezier(.2,.7,.2,1)}
@keyframes entre{from{opacity:0;transform:translateY(10px)}}

/* Accueil en bento */
.bento{height:100%;min-height:560px;display:grid;gap:var(--ecart);
  grid-template-columns:repeat(4,1fr);grid-template-rows:1.5fr .78fr .62fr;
  grid-template-areas:"hero hero vedette vedette" "sejour guide c4 c1" "bande bande bande bande"}
.tuile{position:relative;border-radius:var(--r);overflow:hidden;background:var(--papier);box-shadow:var(--ombre);display:flex;flex-direction:column;padding:clamp(16px,min(1.8vw,2.6vh),28px);min-height:0;min-width:0}
.tuile.photo{color:#fff;background:#2a3442 center/cover no-repeat;justify-content:flex-end}
.tuile.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.05) 35%,rgba(10,14,20,.62))}
.tuile > *{position:relative}
.tuile .petit{opacity:.85}
.hero{grid-area:hero;justify-content:space-between!important}
.hero::before{background:linear-gradient(180deg,rgba(10,14,20,.25),rgba(10,14,20,0) 35%,rgba(10,14,20,.55))!important}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,min(6.4vw,10.5vh),104px);line-height:.92;letter-spacing:-.01em;margin:10px 0 12px;text-shadow:0 2px 30px rgba(10,14,20,.25)}
.hero h1 em{font-style:italic;color:#f3e2bf}
.hero .date{font-size:clamp(15px,2vh,18px);text-transform:capitalize;opacity:.9}
.verre{display:flex;align-items:center;gap:clamp(12px,1.6vw,22px);align-self:flex-start;padding:clamp(8px,1.4vh,14px) clamp(14px,1.6vw,22px);flex-wrap:wrap;border-radius:999px;background:rgba(255,255,255,.16);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25)}
.verre .heure{font-size:clamp(24px,4vh,34px);font-weight:300;line-height:1}
.verre .temp{font-family:var(--serif);font-size:clamp(22px,3.4vh,30px);line-height:1}
.verre .temp:empty,.verre .ciel:empty{display:none}
.verre .ciel{font-size:14px;opacity:.9}
/* Carte « À la une » : réservée à la formule la plus haute (clients Exclusivité) */
.vedette{grid-area:vedette;background:#1b2430!important}
.vedette .fond{position:absolute!important;inset:0;z-index:0;background:#1b2430 center/cover no-repeat;animation:fondu 1.2s ease both,zoomlent 14s ease-out both}
@keyframes fondu{from{opacity:0}}
@keyframes zoomlent{from{transform:scale(1.07)}to{transform:scale(1)}}
.vedette::before{z-index:1;background:linear-gradient(180deg,rgba(10,14,20,.2),rgba(10,14,20,0) 30%,rgba(10,14,20,.1) 50%,rgba(10,14,20,.78))!important}
.vedette > :not(.fond){z-index:2}
.vedette > .etiquette{position:relative!important;top:auto;left:auto;align-self:flex-start;margin-bottom:auto}
.vedette .nom{font-family:var(--serif);font-weight:400;font-size:clamp(36px,min(4.6vw,8.5vh),76px);line-height:.95;margin:10px 0 10px}
.vedette .accv{font-size:clamp(15px,2.2vh,18px);opacity:.9;max-width:34ch}
.vedette .offre{font-family:var(--serif);font-style:italic;font-size:clamp(19px,2.8vh,24px);color:#f3e2bf;display:flex;align-items:center;gap:14px;margin-top:14px}
.vedette .offre::before{content:"";width:30px;height:1px;background:currentColor}
.vedette .offre:empty{display:none}
.vedette .bas{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:clamp(10px,2.4vh,22px);flex-wrap:wrap}
.vedette .meta{color:rgba(255,255,255,.88);font-size:14px}
.vedette .etat{color:#bfe3c9} .vedette .etat.ferme{color:#f0c1bb}
.vedette .decouvrir{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 24px;border-radius:999px;background:rgba(251,248,243,.94);color:var(--encre);
  font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.vedette .decouvrir::after{content:"→";letter-spacing:0;font-size:16px}
.etiquette{position:absolute!important;top:18px;left:18px;padding:7px 14px;border-radius:999px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(251,248,243,.92);color:var(--encre);font-weight:400}
.points{position:absolute!important;top:26px;right:22px;display:flex;gap:6px}
.points i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:background .3s}
.points i.on{background:#fff}
.sejour{grid-area:sejour;background:var(--encre)!important;color:var(--ivoire);justify-content:space-between}
.sejour svg{width:34px;height:34px;stroke:var(--laiton2);stroke-width:1.3}
.sejour h3,.guide h3,.cat h3{font-family:var(--serif);font-weight:400;font-size:clamp(24px,min(2.4vw,4.2vh),36px);line-height:1.02}
.sejour p{color:rgba(244,239,231,.7);font-size:15px;margin-top:6px}
.fleche{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:14px}
.fleche::after{content:"→";font-size:16px;letter-spacing:0}
.sejour .fleche{color:var(--laiton2)}
.guide{grid-area:guide;justify-content:space-between}
.guide ol{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:10px;counter-reset:e}
.guide li{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--texte2);line-height:1.35}
.guide li::before{counter-increment:e;content:counter(e);flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--laiton);color:var(--laiton);
  display:grid;place-items:center;font-size:12px;font-weight:400}
.cat h3{font-size:clamp(22px,min(2.2vw,4vh),34px)}
.cat .nb{font-size:14px;opacity:.85;margin-top:4px}
.c1{grid-area:c1}.c2{grid-area:c2}.c3{grid-area:c3}.c4{grid-area:c4}
.bento.avec-promo{grid-template-areas:"hero hero vedette vedette" "promo promo promo guide" "bande bande bande bande"}

/* ── Bandeau défilant : les annonceurs de second plan ───── */
.bande{grid-area:bande;position:relative;overflow:hidden;min-height:0;border-radius:var(--r);
  -webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.bande .piste{display:flex;gap:var(--ecart);height:100%;width:max-content;animation:defile var(--duree,60s) linear infinite}
.bande:active .piste,.bande.pause .piste{animation-play-state:paused}
@keyframes defile{to{transform:translateX(calc(-50% - var(--ecart) / 2))}}
.annonce{position:relative;flex:none;width:clamp(260px,22vw,380px);height:100%;border-radius:18px;overflow:hidden;color:#fff;background:#2a3442 center/cover no-repeat;
  display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(12px,1.6vh,18px) 18px;text-align:left}
.annonce::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,0) 35%,rgba(10,14,20,.85))}
.annonce .etiquette{display:none}
.annonce .meta{font-size:13px}
.annonce > *{position:relative}
.annonce .etiquette{top:12px;left:12px;font-size:10px;padding:5px 10px}
.annonce .nom{font-family:var(--serif);font-size:clamp(21px,min(1.6vw,3.2vh),27px);line-height:1.05}
.annonce .meta{color:rgba(255,255,255,.88);font-size:12px;margin-top:4px}
.annonce .etat{color:#bfe3c9} .annonce .etat.ferme{color:#f0c1bb}
@media (prefers-reduced-motion:reduce){.bande .piste{animation:none}.bande{overflow-x:auto}}

/* ── Offre du jour : encart « urgence » ─────────────────── */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.promo{grid-area:promo;position:relative;border-radius:var(--r);overflow:hidden;color:#fff;background:#120f0c;display:grid;
  grid-template-columns:1.25fr 1fr;align-items:stretch;padding:0!important;isolation:isolate;box-shadow:0 22px 50px -24px rgba(120,80,20,.55)}
.promo::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;z-index:4;pointer-events:none;
  background:conic-gradient(from var(--ang),#f6e3b0,#a8844c 18%,#fff6dc 30%,#7c5a26 48%,#f6e3b0 62%,#a8844c 80%,#f6e3b0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:tourne 6s linear infinite}
@keyframes tourne{to{--ang:360deg}}
.promo .fond{position:absolute;inset:0;z-index:0;background:#120f0c center/cover no-repeat;animation:zoomlent 16s ease-in-out infinite alternate}
.promo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(14,10,6,.94) 0%,rgba(14,10,6,.78) 42%,rgba(14,10,6,.25) 75%,rgba(14,10,6,.55) 100%)}
.promo .gauche,.promo .droite{position:relative;z-index:2;padding:clamp(16px,min(1.8vw,2.6vh),26px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.promo .droite{align-items:flex-end;justify-content:space-between;text-align:right}
.flash{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:6px 12px;border-radius:999px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;
  background:linear-gradient(90deg,#c23b2b,#e0613f);color:#fff;box-shadow:0 0 0 0 rgba(226,90,60,.6);animation:alerte 1.8s ease-out infinite}
.flash i{width:8px;height:8px;border-radius:50%;background:#fff;animation:clignote 1s steps(2) infinite}
.flash.bientot{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);animation:none}
.flash.bientot i{background:#f3d58c}
@keyframes alerte{0%{box-shadow:0 0 0 0 rgba(226,90,60,.55)}70%{box-shadow:0 0 0 14px rgba(226,90,60,0)}100%{box-shadow:0 0 0 0 rgba(226,90,60,0)}}
@keyframes clignote{50%{opacity:.25}}
.valeur{font-family:var(--serif);font-weight:500;font-size:clamp(40px,min(4.4vw,8vh),78px);line-height:.95;margin:clamp(6px,1.2vh,12px) 0 4px;
  background:linear-gradient(100deg,#b88a3e 0%,#f6e3b0 22%,#fff8e6 30%,#d6ae62 45%,#f6e3b0 70%,#b88a3e 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:reflet 4.5s ease-in-out infinite}
@keyframes reflet{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.promo .titre-p{font-family:var(--serif);font-size:clamp(19px,min(1.7vw,3vh),27px);line-height:1.1}
.promo .chez{font-size:13px;opacity:.82;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.chrono{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chrono .lib{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.cases{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.cases b{display:grid;place-items:center;min-width:clamp(40px,3.2vw,56px);height:clamp(42px,6vh,60px);border-radius:10px;font-family:var(--sans);font-weight:300;font-size:clamp(22px,min(2vw,3.6vh),34px);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cases span{opacity:.6;font-size:20px}
.jauge{width:min(240px,100%);height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#f6e3b0,#e0613f);transition:width 1s linear}
.rarete{font-size:13px;font-weight:400;color:#ffd7c4;display:inline-flex;align-items:center;gap:8px}
.rarete::before{content:"";width:7px;height:7px;border-radius:50%;background:#e0613f;animation:clignote 1.2s steps(2) infinite}
.promo .profiter{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:999px;background:#f6e3b0;color:#1b1206;
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.promo .profiter::after{content:"→";letter-spacing:0;font-size:15px}
.promo.urgent .cases b{border-color:rgba(226,90,60,.8);background:rgba(194,59,43,.35);animation:clignote 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.promo::after,.promo .fond,.valeur,.flash,.flash i,.rarete::before,.promo.urgent .cases b{animation:none}}

/* Offre du jour dans la fiche */
.promo-fiche{position:relative;border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(120deg,#1a120b,#3a2614);display:flex;gap:16px;align-items:center;flex-wrap:wrap;overflow:hidden}
.promo-fiche .valeur{font-size:44px;margin:0}
.promo-fiche .txt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.promo-fiche .code{font-family:var(--sans);font-size:14px;letter-spacing:.14em;padding:8px 12px;border:1px dashed rgba(246,227,176,.7);border-radius:8px;color:#f6e3b0}
.promo-fiche .cases b{min-width:38px;height:40px;font-size:20px}

/* Tuile Wi-Fi */
.wifi{justify-content:space-between}
.wifi .ligne{display:flex;gap:clamp(10px,1.2vw,16px);align-items:center;min-width:0}
.wifi .ligne > div{min-width:0}
.wifi img{width:clamp(60px,min(6vw,10vh),96px);height:clamp(60px,min(6vw,10vh),96px);border-radius:10px;background:#fff;padding:6px;border:1px solid var(--trait);flex:none}
.wifi b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(19px,min(1.7vw,3.4vh),26px);line-height:1.05;overflow-wrap:anywhere}
.wifi small{display:block;color:var(--gris);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:8px}
.wifi .mdp{font-family:var(--sans);font-weight:400;font-size:clamp(14px,min(1.2vw,2.4vh),18px);letter-spacing:.02em;overflow-wrap:anywhere}
.wifi .fleche{color:var(--laiton);margin-top:0}
.verre .coucher{font-size:14px;opacity:.9;padding-left:clamp(12px,1.6vw,22px);border-left:1px solid rgba(255,255,255,.3)}
.verre .coucher:empty{display:none}
.hero .astuce{display:inline-flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;opacity:.9}
.hero .astuce i{width:8px;height:8px;border-radius:50%;background:#f3e2bf;animation:pulse 2.4s infinite}

/* Bloc « Votre logement » */
.logement{display:grid;grid-template-columns:auto 1fr 1fr;gap:var(--ecart);margin-bottom:calc(var(--ecart) * 2)}
.logement .bloc{background:var(--papier);border-radius:var(--r);box-shadow:var(--ombre);padding:26px}
.logement .bloc.wifi-grand{display:flex;gap:22px;align-items:center;background:var(--encre);color:var(--ivoire)}
.logement .wifi-grand img{width:150px;height:150px;border-radius:12px;background:#fff;padding:10px;flex:none}
.logement .wifi-grand b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05}
.logement .wifi-grand .mdp{font-family:var(--sans);font-size:20px;letter-spacing:.04em;color:var(--laiton2);margin:6px 0 10px}
.logement .wifi-grand p{color:rgba(244,239,231,.7);font-size:14px}
.horaires{display:flex;gap:30px}
.horaires div span{display:block;color:var(--gris);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.horaires div b{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.1}
.logement ul{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--texte2)}
.logement li{display:flex;gap:10px}
.logement li::before{content:"";width:14px;height:1px;background:var(--laiton);margin-top:.75em;flex:none}
.sous-titre{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 16px}

/* En-tête des écrans intérieurs */
.entete{display:flex;align-items:center;gap:20px;margin-bottom:clamp(20px,2.4vw,34px);flex-wrap:wrap}
.retour{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px 0 18px;border-radius:999px;background:var(--papier);box-shadow:var(--ombre);font-size:15px}
.retour svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.5}
.entete .titres{flex:1;min-width:240px}
.entete .petit{color:var(--laiton)}
.entete h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.4vw,64px);line-height:1}
.entete p{color:var(--texte2);margin-top:6px;font-size:16px}

/* Cartes d'adresses */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:var(--ecart)}
.carte{display:flex;flex-direction:column;background:var(--papier);border-radius:var(--r);overflow:hidden;box-shadow:var(--ombre)}
.carte .image{position:relative;aspect-ratio:16/11;background:var(--sable) center/cover no-repeat}
.carte .image .etiquette{top:14px;left:14px}
.carte .corps{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.carte .nom{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.05}
.carte .acc{color:var(--texte2);font-size:15px}
.carte .offre{margin-top:auto;padding-top:10px;color:var(--laiton);font-size:14px;display:flex;gap:10px;align-items:center}
.carte .offre::before{content:"";width:18px;height:1px;background:currentColor}
.vide{grid-column:1/-1;text-align:center;color:var(--texte2);padding:70px 0;font-family:var(--serif);font-size:28px}

/* Services du séjour */
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:var(--ecart)}
.service{display:flex;flex-direction:column;gap:12px;padding:26px;background:var(--papier);border-radius:var(--r);box-shadow:var(--ombre)}
.service .rond{width:60px;height:60px;border-radius:50%;background:var(--ivoire);display:grid;place-items:center}
.service svg{width:28px;height:28px;stroke:var(--laiton);stroke-width:1.4}
.service b{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.05}
.service span{color:var(--texte2);font-size:15px}
.service .fleche{color:var(--encre);margin-top:auto}

/* Recherche */
.champ-recherche{display:flex;align-items:center;gap:14px;height:72px;padding:0 26px;border-radius:999px;background:var(--papier);box-shadow:var(--ombre);margin-bottom:var(--ecart)}
.champ-recherche svg{width:24px;height:24px;stroke:var(--gris);stroke-width:1.5;flex:none}
.champ-recherche input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:22px;color:var(--encre)}
.suggestions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:calc(var(--ecart) * 1.6)}
.suggestions button{height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--trait);background:var(--papier);color:var(--texte2);font-size:15px}

/* ── Fiche détaillée ────────────────────────────────────── */
.voile{position:fixed;inset:0;z-index:20;background:rgba(27,36,48,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:stretch;justify-content:flex-end}
.voile.ouvert{display:flex}
.fiche{width:min(760px,100%);height:100%;background:var(--ivoire);overflow-y:auto;animation:glisse .38s cubic-bezier(.2,.7,.2,1);
  box-shadow:-30px 0 60px -30px rgba(27,36,48,.4)}
@keyframes glisse{from{transform:translateX(40px);opacity:.4}}
.fiche .photo{position:relative;height:clamp(190px,32vh,420px);background:var(--sable) center/cover no-repeat}
.fiche .photo.sans{display:grid;place-items:center;background:var(--encre)}
.fiche .photo.sans > svg{width:80px;height:80px;stroke:var(--laiton2);stroke-width:.9}
.fermer{position:absolute;top:22px;right:22px;z-index:2;display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 22px;border-radius:999px;
  background:rgba(251,248,243,.94);color:var(--encre);font-size:15px;box-shadow:var(--ombre)}
.fermer svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6}
.fiche .texte{padding:clamp(20px,min(3vw,4vh),44px);display:flex;flex-direction:column;gap:clamp(10px,1.8vh,16px)}
.fiche .petit{color:var(--laiton)}
.fiche h3{font-family:var(--serif);font-weight:400;font-size:clamp(36px,min(4.4vw,7vh),64px);line-height:.98}
.fiche .desc{font-size:18px;line-height:1.6;color:var(--texte2)}
.cadeau{display:flex;gap:16px;align-items:center;padding:18px 22px;border-radius:16px;background:var(--papier);border:1px solid rgba(168,132,76,.35)}
.cadeau svg{width:28px;height:28px;stroke:var(--laiton);stroke-width:1.4;flex:none}
.cadeau span{font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.2}
.infos{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.infos li{display:flex;gap:12px;align-items:center;padding:16px 18px;border-radius:16px;background:var(--papier);font-size:15px}
.infos svg{width:20px;height:20px;stroke:var(--laiton);stroke-width:1.5;flex:none}
.scanner{display:flex;gap:24px;align-items:center;padding:clamp(14px,2.4vh,22px);border-radius:var(--r);background:var(--encre);color:var(--ivoire)}
.scanner img{width:clamp(110px,18vh,150px);height:clamp(110px,18vh,150px);border-radius:12px;background:#fff;padding:10px;flex:none}
.scanner b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.05;margin-bottom:10px}
.scanner ol{list-style:none;display:flex;flex-direction:column;gap:6px;color:rgba(244,239,231,.75);font-size:15px;counter-reset:e}
.scanner li::before{counter-increment:e;content:counter(e) ". ";color:var(--laiton2)}

/* Boutons d'action (téléphone uniquement) */
.actions-tel{display:none;gap:10px}
.actions-tel a{flex:1;display:inline-flex;align-items:center;justify-content:center;height:54px;border-radius:999px;border:1px solid var(--encre);
  color:var(--encre);text-decoration:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.actions-tel a.plein{background:var(--encre);color:var(--ivoire)}

/* ── Écran de veille ────────────────────────────────────── */
.veille{position:fixed;inset:0;z-index:50;background:#000;display:none;cursor:pointer;color:#fff}
.veille.active{display:block}
.diapo{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(28px,6vw,96px);padding-bottom:calc(clamp(28px,6vw,96px) + 56px);opacity:0;transition:opacity 1.4s;overflow:hidden}
.diapo.visible{opacity:1}
.diapo .fond{position:absolute;inset:0;z-index:0;background:#1b2430 center/cover no-repeat}
.diapo.visible .fond{animation:zoom 12s ease-out both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.diapo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.72))}
.diapo > :not(.fond){position:relative;z-index:2}
.diapo .cat{color:var(--laiton2)}
.diapo .titre{font-family:var(--serif);font-size:clamp(64px,9vw,150px);font-weight:400;line-height:.95;margin:14px 0 18px}
.diapo .acc{font-size:clamp(20px,2.2vw,32px);font-weight:300;max-width:28ch;opacity:.9}
.diapo .offre{margin-top:26px;font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.4vw,34px);color:#f3e2bf;display:flex;align-items:center;gap:16px}
.diapo .offre::before{content:"";width:40px;height:1px;background:currentColor}
.diapo.accueil{justify-content:center;align-items:center;text-align:center}
.diapo.accueil .ville{font-family:var(--serif);font-weight:400;font-size:clamp(120px,22vw,340px);line-height:.9;color:#fbf6ec}
.diapo.accueil .sous{margin-top:clamp(14px,2vw,30px);font-size:clamp(14px,1.6vw,22px);letter-spacing:.3em;text-transform:uppercase}
.diapo.accueil .trait{width:clamp(50px,6vw,90px);height:1px;background:rgba(255,255,255,.8);margin:clamp(18px,2.5vw,34px) auto 0}
.veille .logo{position:absolute;left:clamp(28px,6vw,96px);top:clamp(24px,4vw,56px);height:clamp(48px,6vw,80px);z-index:2}
.veille .haut{position:absolute;right:clamp(28px,6vw,96px);top:clamp(36px,5vw,70px);z-index:2;display:flex;gap:clamp(20px,4vw,60px);opacity:.85}
.veille .haut .heure{letter-spacing:.08em}
/* QR sur chaque pub : le voyageur scanne sans toucher la tablette (compté dans les stats) */
.diapo .qr-veille{position:absolute!important;right:clamp(28px,6vw,96px);bottom:calc(clamp(28px,6vw,96px) + 56px);display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:14px;border-radius:18px;background:rgba(251,248,243,.94);color:var(--encre);font-size:13px;text-align:center;max-width:180px}
.diapo .qr-veille img{width:clamp(96px,10vw,140px);height:clamp(96px,10vw,140px);display:block}
.diapo.accueil .qr-veille{display:none}
.diapo:not(.accueil){padding-right:calc(clamp(28px,6vw,96px) + 200px)}
.veille .invite{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;white-space:nowrap;
  background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);font-size:15px;animation:pulse 3s infinite}
.veille .invite i{width:10px;height:10px;border-radius:50%;background:#fff}
@keyframes pulse{50%{opacity:.55}}

/* Langue */
.langue{display:flex;gap:2px;margin:0 0 12px;flex:none;padding:3px;border-radius:999px;background:var(--ivoire);border:1px solid var(--trait)}
.langue button{width:42px;height:34px;border-radius:999px;font-size:13px;text-align:center;color:var(--texte2)}
.langue button[aria-pressed="true"]{background:var(--encre);color:var(--ivoire)}

/* Ouvert / fermé et distance */
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--texte2)}
.meta > span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6}
.etat i{width:7px;height:7px;border-radius:50%;background:#4f8a62}
.etat{color:#3f7a52}
.etat.ferme{color:#a5524a} .etat.ferme i{background:#b5574f}
.meta.grand{font-size:15px}

/* Idées de journée */
.guides{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:var(--ecart)}
.guide-carte{display:flex;flex-direction:column;background:var(--papier);border-radius:var(--r);overflow:hidden;box-shadow:var(--ombre)}
.guide-carte .image{aspect-ratio:16/9;background:var(--sable) center/cover no-repeat}
.guide-carte .corps{padding:22px 26px 26px;display:flex;flex-direction:column;gap:6px}
.guide-carte .petit{color:var(--laiton)}
.guide-carte .nom{font-family:var(--serif);font-size:38px;line-height:1.02}
.guide-carte .acc{color:var(--texte2);font-size:16px}
.parcours{list-style:none;max-width:980px;position:relative}
.parcours::before{content:"";position:absolute;left:118px;top:10px;bottom:10px;width:1px;background:rgba(168,132,76,.4)}
.parcours li{display:grid;grid-template-columns:100px 1fr;gap:38px;padding-bottom:26px;position:relative}
.parcours li::before{content:"";position:absolute;left:113px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--ivoire);border:1px solid var(--laiton)}
.parcours .quand{font-family:var(--serif);font-size:26px;color:var(--laiton);text-align:right;line-height:1.2}
.parcours .etape b{display:block;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1}
.parcours .etape p{color:var(--texte2);font-size:16px;margin:6px 0 14px;max-width:60ch}
.parcours .lieu{display:flex;align-items:center;gap:16px;padding:12px 18px 12px 12px;border-radius:18px;background:var(--papier);box-shadow:var(--ombre);max-width:560px}
.parcours .vignette{width:84px;height:64px;border-radius:12px;background:var(--sable) center/cover no-repeat;flex:none}
.parcours .lieu > span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:4px}
.parcours .lieu .nom{font-family:var(--serif);font-size:22px;line-height:1.1}
.parcours .lieu .fleche{margin:0;color:var(--laiton);white-space:nowrap}
.idee .etiquette{background:var(--laiton)!important;color:#fff!important}

/* ── Écrans peu hauts : accueil allégé pour que tout tienne ─ */
@media (max-height:820px) and (min-width:761px) and (min-aspect-ratio:1/1){
  .bento{grid-template-rows:1.3fr .95fr .62fr}
  .hero .region,.hero .astuce,.hero > .petit{display:none}
  .hero h1{font-size:clamp(40px,min(5vw,9vh),80px);margin:4px 0 6px}
  .verre{padding:6px 14px} .verre .coucher{display:none}
  .promo .profiter{display:none} .promo .chez{margin-top:2px}
  .valeur{font-size:clamp(34px,min(3.6vw,7vh),60px)}
  .cases b{height:clamp(34px,5vh,48px)}
  .vedette .accv{display:none}
}
/* ── Écrans peu hauts : menu resserré ───────────────────── */
@media (max-height:860px) and (min-width:761px){
  .rail{padding:14px 0 10px} .rail .logo{width:80px;margin-bottom:10px}
  .nav button{gap:3px;padding:3px 4px;font-size:12px} .nav .ico{width:38px;height:38px} .nav svg{width:21px;height:21px}
  .rail .meteo-rail{display:none}
}

/* ── Portrait et petits écrans ──────────────────────────── */
@media (max-aspect-ratio:1/1){
  .logement{grid-template-columns:1fr 1fr} .logement .bloc.wifi-grand{grid-column:1/-1}
  .bento{height:auto;min-height:100%;grid-template-columns:1fr 1fr;grid-template-rows:none;grid-auto-rows:minmax(230px,1fr);
    grid-template-areas:"hero hero" "hero hero" "vedette vedette" "vedette vedette" "sejour guide" "c4 c1"}
  .bento.avec-promo{grid-template-areas:"hero hero" "hero hero" "vedette vedette" "vedette vedette" "promo promo" "guide guide" "bande bande"}
  .bento:not(.avec-promo){grid-template-areas:"hero hero" "hero hero" "vedette vedette" "vedette vedette" "sejour guide" "c4 c1" "bande bande"}
  .bande{min-height:230px}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{grid-row:2;flex-direction:row;padding:8px 10px;border-right:0;border-top:1px solid var(--trait);overflow-x:auto}
  .rail .logo,.rail .meteo-rail{display:none}
  .langue{margin:0 0 0 8px;align-self:center;flex:none}
  .parcours::before,.parcours li::before{display:none} .parcours li{grid-template-columns:1fr;gap:6px} .parcours .quand{text-align:left}
  .nav{flex-direction:row;width:auto}
  .nav button{width:82px;font-size:11px;padding:4px}
  .nav .ico{width:44px;height:44px}
  .bento{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:auto;grid-template-areas:"hero" "vedette" "sejour" "guide" "c4" "c1"}
  .bento.avec-promo{grid-template-areas:"hero" "promo" "vedette" "bande" "guide"}
  .bento:not(.avec-promo){grid-template-areas:"hero" "vedette" "bande" "sejour" "guide" "c4" "c1"}
  .bande{min-height:220px} .annonce{width:250px}
  .promo{grid-template-columns:1fr;min-height:360px} .promo .droite{align-items:flex-start;text-align:left;gap:14px} .chrono{align-items:flex-start}
  .promo::before{background:linear-gradient(180deg,rgba(14,10,6,.55),rgba(14,10,6,.92))}
  .hero{min-height:440px} .vedette{min-height:500px;padding-top:70px!important} .sejour,.guide{min-height:200px} .cat{min-height:220px}
  .vedette .bas{flex-direction:column;align-items:flex-start}
  .infos{grid-template-columns:1fr}
  .logement{grid-template-columns:1fr}
  .logement .bloc.wifi-grand{flex-direction:column;text-align:center}
  .scanner{display:none} .actions-tel{display:flex}
  .veille .heure{display:none}
  .diapo .qr-veille{display:none} .diapo:not(.accueil){padding-right:28px}
}
</style>
</head>

  <aside class="rail">

    <div class="langue" id="langue"></div>
    <nav class="nav" id="nav"></nav>
    <div class="meteo-rail"><b id="tempRail"></b><span id="cielRail"></span></div>
  </aside>
  <main id="ecrans"></main>
</div>

<div class="voile" id="voile"><div class="fiche" id="fiche"></div></div>

<div class="veille" id="veille">
  <img class="logo" src="/adstay/logo-transparent.webp" alt=""/>
  <div class="haut petit"><span id="region"></span><span class="heure" id="heureVeille"></span><span id="compteur"></span></div>

<script src="/adstay/donnees.js"></script>
<script src="/adstay/config.js"></script>

// ── Distance à pied depuis le logement ──────────────────
function distance(c) {
  if (!L?.lat || !c?.lat) return '';
  const r = Math.PI / 180, dLat = (c.lat - L.lat) * r, dLon = (c.lon - L.lon) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(L.lat * r) * Math.cos(c.lat * r) * Math.sin(dLon / 2) ** 2;
  const km = 12742 * Math.asin(Math.sqrt(a)) * 1.25; // à vol d'oiseau × 1,25 pour suivre les rues
  const min = Math.max(1, Math.round(km / 4.8 * 60));
  return min <= 30 ? t('aPied')(min) : t('km')(km);
}

// ── Ouvert maintenant ? (creneaux '12:00-14:30 19:00-22:30', fermes ['lun']) ──
const JOURS = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
const minutes = h => { const [H, M = '0'] = h.split(':'); return +H * 60 + +M; };
const plagesDe = c => String(c.creneaux || '').trim().split(/\s+/).filter(Boolean)
  .map(p => p.split('-').map(minutes)).filter(([a, b]) => !isNaN(a) && !isNaN(b));
function heure(m) {
  m = ((m % 1440) + 1440) % 1440;

  if (lang === 'fr') return `${H}h${M ? String(M).padStart(2, '0') : ''}`;

}
// « 16h00 », « 16h », « 16:00 » → affiché dans la langue (16h / 4 pm) ; autre texte laissé tel quel
function heureLibre(txt) {

function ouverture(c, now = new Date()) {

  for (const [a, b0] of plages) {
    const b = b0 <= a ? b0 + 1440 : b0;
    if (!fermes.includes(JOURS[j]) && min >= a && min < b) return { ouvert: true, texte: `${t('ouvert')} · ${t('fermeA')(heure(b))}` };
    if (b > 1440 && !fermes.includes(JOURS[(j + 6) % 7]) && min < b - 1440) return { ouvert: true, texte: `${t('ouvert')} · ${t('fermeA')(heure(b))}` };
  }
  for (let d = 0; d < 8; d++) {

    return { ouvert: false, texte: `${t('ferme')} · ${quand}` };

}

function horairesTexte(c) {

function promoDuJour(now = new Date()) {
  const min = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60, j = JOURS[now.getDay()];
  const liste = (D.promos || []).map(p => ({ p, c: parId(p.commercant), a: minutes(p.debut || '00:00'), b: minutes(p.fin || '24:00') }))

      return `<button class="annonce touche" data-fiche="${echap(c.id)}" style="${fond(c, 900)}">
        <span class="nom">${echap(c.nom)}</span><span class="meta">${etatHtml(c)}${d ? `<span>${svg('marche')}${d}</span>` : ''}</span></button>`; };
    const bande = secondPlan.length ? `<div class="bande" style="--duree:${secondPlan.length * 9}s"><div class="piste">${
      [...secondPlan, ...secondPlan].map(annonce).join('')}</div></div>` : '';
    html = `<div class="bento ${promo ? 'avec-promo' : ''}">
      <div class="tuile photo hero" style="${fond(D.ville, 1800)}">
        <span class="petit">${echap(D.ville.region || '')}</span>
        <div><span class="petit">${salutation()}</span><h1>${t('bienvenue')} <em>${echap(D.ville.nom)}</em></h1>
          <p class="date" id="date"></p><span class="astuce"><i></i>${t('commencer')}</span></div>
        <div class="verre"><span class="heure" id="heure"></span><span class="temp" id="temp"></span><span class="ciel" id="ciel"></span><span class="coucher" id="coucher"></span></div>
      </div>
      ${v ? `<button class="tuile photo vedette touche" id="vedette" data-fiche="${echap(v.id)}">
        <div class="fond" style="${fond(v, 1800)}"></div>
        <span class="etiquette" id="vEtiq">${etiquetteV(v)}</span>
        ${vedettes.length > 1 ? `<span class="points">${vedettes.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</span>` : ''}
        <span class="petit" id="vCat">${echap(tr(categorie(v.categorie), 'nom'))}</span><span class="nom" id="vNom">${echap(v.nom)}</span>
        <span class="accv" id="vAcc">${echap(tr(v, 'accroche'))}</span><span class="offre" id="vOffre">${echap(offre(v))}</span>
        <span class="bas"><span class="meta" id="vMeta">${metaV(v)}</span><span class="decouvrir">${t('decouvrir')}</span></span></button>` : ''}
      ${!promo && D.services?.length ? `<button class="tuile sejour touche" data-aller="services">${svg('sejour')}
        <div><h3>${t('votreSejour')}</h3><p>${t('sejourTexte')}</p><span class="fleche">${t('demander')}</span></div></button>` : ''}
      ${L?.wifi ? `<button class="tuile guide wifi touche" data-aller="services"><span class="petit" style="color:var(--laiton)">${t('wifiLogement')}</span>
        <div class="ligne"><img src="${qrWifi}" alt="QR Wi-Fi"/><div><b>${echap(L.wifi.reseau)}</b><small>${t('mdp')}</small><span class="mdp">${echap(L.wifi.motdepasse)}</span></div></div>
        <span class="fleche">${t('infosLogement')}</span></button>` : ''}
      ${promo ? promoHtml(promo) : tuilesCat}
      ${bande}
    </div>`;
    $('#ecrans').innerHTML = `<section class="ecran">${html}</section>`;
    horloge(); meteoAffiche(); if (promo) lancerChrono();
    // La tuile « suggestion » fait défiler les adresses du moment
    if (vedettes.length > 1) {
      let i = 0;
      rotation = setInterval(() => {
        const el = $('#vedette'); if (!el) return;
        const c = vedettes[++i % vedettes.length];
        // Nouvelle photo en fondu par-dessus l'ancienne, qu'on retire ensuite
        // La nouvelle photo se pose PAR-DESSUS l'ancienne (fondu), puis l'ancienne est retirée
        const anciens = [...el.querySelectorAll('.fond')];
        anciens[anciens.length - 1].insertAdjacentHTML('afterend', `<div class="fond" style="${fond(c, 1800)}"></div>`);
        setTimeout(() => anciens.forEach(f => f.remove()), 1300);
        el.dataset.fiche = c.id;
        $('#vEtiq').textContent = etiquetteV(c); $('#vCat').textContent = tr(categorie(c.categorie), 'nom'); $('#vNom').textContent = c.nom;
        $('#vAcc').textContent = tr(c, 'accroche'); $('#vOffre').textContent = offre(c); $('#vMeta').innerHTML = metaV(c);
        el.querySelectorAll('.points i').forEach((p, k) => p.classList.toggle('on', k === i % vedettes.length));
      }, 7000);
    }
    return;
  }
  if (ecran === 'cat') {
    const c = categorie(param), liste = dans(param);
    html = entete(t('adresses')(liste.length), echap(tr(c, 'nom')), t('toucherAdresse'))
      + `<div class="grille">${liste.map(carte).join('')}</div>`;
  }
  if (ecran === 'services') {
    html = entete(L?.nom ? echap(L.nom) : t('conciergerie'), t('votreSejour'), t('sejourIntro'))
      + (L ? `<div class="logement">
        ${L.wifi ? `<div class="bloc wifi-grand"><img src="${qrWifi}" alt="QR Wi-Fi"/><div><span class="petit" style="color:var(--laiton2)">Wi-Fi</span>
          <b>${echap(L.wifi.reseau)}</b><div class="mdp">${echap(L.wifi.motdepasse)}</div><p>${t('wifiScan')}</p></div></div>` : ''}
        <div class="bloc"><div class="horaires">${L.arrivee ? `<div><span>${t('arrivee')}</span><b>${echap(heureLibre(L.arrivee))}</b></div>` : ''}${L.depart ? `<div><span>${t('depart')}</span><b>${echap(heureLibre(L.depart))}</b></div>` : ''}</div></div>
        ${tr(L, 'infos')?.length ? `<div class="bloc"><ul>${tr(L, 'infos').map(i => `<li>${echap(i)}</li>`).join('')}</ul></div>` : ''}
      </div>` : '')
      + (D.services?.length ? `<h3 class="sous-titre">${t('servicesDemande')}</h3><div class="services">${D.services.map(s => `<button class="service touche" data-service="${s.id}">
        <span class="rond">${svg(s.icone)}</span><b>${echap(tr(s, 'nom'))}</b><span>${echap(tr(s, 'prix') || t('surDemande'))}</span>
        <span class="fleche">${t('demander')}</span></button>`).join('')}</div>` : '');
  }
  if (ecran === 'idees') {
    html = entete(t('ideesSur'), t('ideesTitre'), t('ideesTexte'))
      + `<div class="guides">${D.guides.map(g => `<button class="guide-carte touche" data-aller="guide:${g.id}">
        <div class="image" style="${fond(g, 1400)}"></div>
        <div class="corps"><span class="petit">${t('etapes')(g.etapes.length)}</span><span class="nom">${echap(tr(g, 'titre'))}</span>
          <span class="acc">${echap(tr(g, 'accroche'))}</span></div></button>`).join('')}</div>`;
  }
  if (ecran === 'guide') {
    const g = D.guides.find(x => x.id === param) || D.guides[0];
    html = entete(t('ideesSur'), echap(tr(g, 'titre')), echap(tr(g, 'accroche')), 'idees', t('idees'))
      + `<ol class="parcours">${g.etapes.map(e => {
        const c = e.commercant ? parId(e.commercant) : null, dist = distance(c);
        return `<li><span class="quand">${echap(tr(e, 'heure'))}</span><div class="etape">
          <b>${echap(tr(e, 'titre'))}</b><p>${echap(tr(e, 'texte'))}</p>
          ${c ? `<button class="lieu touche" data-fiche="${echap(c.id)}"><span class="vignette" style="${fond(c, 300)}"></span>
            <span><span class="nom">${echap(c.nom)}</span><span class="meta">${etatHtml(c)}${dist ? `<span>${svg('marche')}${dist}</span>` : ''}</span></span>
            <span class="fleche">${t('voir')}</span></button>` : ''}</div></li>`;
      }).join('')}</ol>`;
  }
  if (ecran === 'recherche') {
    html = entete(t('trouver'), t('rechercher'), '')
      + `<label class="champ-recherche">${svg('recherche')}<input id="q" type="search" placeholder="${t('placeholder')}" autocomplete="off" value="${echap(recherche)}"/></label>
      <div class="suggestions">${t('motsCles').map(m => `<button class="touche" data-mot="${m}">${m}</button>`).join('')}</div>
      <div class="grille" id="resultats"></div>`;
  }
  $('#ecrans').innerHTML = `<section class="ecran">${html}</section>`;
  if (ecran === 'recherche') {
    const maj = () => {
      const q = recherche.trim().toLowerCase();
      const r = q ? tries.filter(c => [c.nom, c.accroche, c.accroche_en, c.description, c.description_en,
        categorie(c.categorie).nom, categorie(c.categorie).nom_en].join(' ').toLowerCase().includes(q)) : tries;
      $('#resultats').innerHTML = r.length ? r.map(carte).join('') : `<p class="vide">${t('aucun')}</p>`;
    };
    $('#q').addEventListener('input', e => { recherche = e.target.value; maj(); });
    maj();
  }
}

// ── Fiche d'une adresse ──────────────────────────────────
// Fiche de la base : le lien passe par /adstay/go qui compte le scan puis redirige
const cibleAdresse = c => window.adstayEstUuid(c.id)
  ? `${location.origin}/adstay/go?f=${c.id}${logement ? '&l=' + encodeURIComponent(logement) : ''}`
  : lienDe(c) || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.nom + ', ' + c.adresse);
const lienQR = c => 'https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=0&data=' + encodeURIComponent(cibleAdresse(c));
// Sur téléphone, pas de QR à scanner : de vrais boutons
const boutonsTel = liens => `<div class="actions-tel">${liens.filter(Boolean).map(([href, txt, plein]) =>
  `<a class="${plein ? 'plein' : ''}" href="${echap(href)}" target="_blank" rel="noopener">${echap(txt)}</a>`).join('')}</div>`;
const boutonFermer = () => `<button class="fermer touche" data-fermer>${svg('croix')}${t('fermer')}</button>`;
const etapesScan = (fin = t('scan')[2]) => `<ol><li>${t('scan')[0]}</li><li>${t('scan')[1]}</li><li>${fin}</li></ol>`;
function ouvrir(id) {
  const c = parId(id); if (!c) return;
  const f = formule(c.formule), cat = categorie(c.categorie), o = ouverture(c), dist = distance(c);
  window.adstayNoter(c.id, 'vue', logement);
  $('#fiche').innerHTML = `
    <div class="photo" style="${fond(c, 1600)}">${boutonFermer()}${badgeTablette(c) ? `<span class="etiquette" style="top:30px;left:28px">${badgeTablette(c)}</span>` : ''}</div>
    <div class="texte">
      <span class="petit">${echap(tr(cat, 'nom'))}</span>
      <h3>${echap(c.nom)}</h3>
      ${o || dist ? `<span class="meta grand">${etatHtml(c)}${dist ? `<span>${svg('marche')}${dist}</span>` : ''}</span>` : ''}
      ${(() => { const x = promoDuJour(); return x && String(x.c.id) === String(c.id) ? `<div class="promo-fiche">
        <span class="valeur">${echap(tr(x.p, 'valeur'))}</span>
        <div class="txt"><span class="petit" style="color:#f6e3b0">${t('offreJour')} · ${x.etat === 'direct' ? echap(t('jusqua')(heure(x.b))) : echap(t('aPartirDe')(heure(x.a)))}</span>
          <b style="font-family:var(--serif);font-weight:400;font-size:22px">${echap(tr(x.p, 'titre'))}</b>
          ${x.p.code ? `<span><span class="code">${t('codePromo')} : ${echap(x.p.code)}</span></span>` : ''}</div>
        <div class="cases" id="promoChronoFiche" data-id="${echap(c.id)}">${casesChrono(x.reste)}</div></div>` : ''; })()}
      ${offre(c) ? `<div class="cadeau">${svg('cadeau')}<span>${echap(offre(c))}</span></div>` : ''}
      <div class="scanner"><img src="${lienQR(c)}" alt="QR code"/>
        <div><b>${lienDe(c) ? t('reserverTel') : t('itineraireTel')}</b>${etapesScan()}</div></div>
      ${boutonsTel([[cibleAdresse(c), lienDe(c) ? t('btnReserver') : t('btnItineraire'), true], c.tel && [`tel:${c.tel.replace(/\s/g, '')}`, t('btnAppeler')]])}
      <p class="desc">${echap(tr(c, 'description') || tr(c, 'accroche'))}</p>
      <ul class="infos">
        ${c.adresse ? `<li>${svg('lieu')}${echap(c.adresse)}</li>` : ''}
        ${horairesTexte(c) ? `<li>${svg('horloge')}${echap(horairesTexte(c))}</li>` : ''}
        ${c.tel ? `<li>${svg('tel')}${echap(c.tel)}</li>` : ''}
      </ul>
    </div>`;
  $('#voile').classList.add('ouvert'); $('#fiche').scrollTop = 0;
  if ($('#promoChronoFiche')) lancerChrono();
}
// Demande de service : QR code vers WhatsApp (message déjà écrit), sinon vers le téléphone.
function ouvrirService(id) {
  const s = (D.services || []).find(x => x.id === id); if (!s) return;
  const cc = D.conciergerie || {};
  const message = T[lang].message(tr(s, 'nom'), logement);
  const cible = cc.whatsapp ? `https://wa.me/${cc.whatsapp}?text=${encodeURIComponent(message)}`
    : cc.tel ? `tel:${cc.tel.replace(/\s/g, '')}` : '';
  $('#fiche').innerHTML = `
    <div class="photo sans">${boutonFermer()}${svg(s.icone)}</div>
    <div class="texte">
      <span class="petit">${t('service')} · ${echap(cc.nom || t('votreHote'))}</span>
      <h3>${echap(tr(s, 'nom'))}</h3>
      <div class="cadeau">${svg('cle')}<span>${echap(tr(s, 'prix') || t('prixDemande'))}</span></div>
      ${cible ? `<div class="scanner"><img src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=0&data=${encodeURIComponent(cible)}" alt="QR code"/>
        <div><b>${cc.whatsapp ? t('whatsapp') : t('appeler')}</b>${etapesScan(cc.whatsapp ? t('messagePret') : t('lancerAppel'))}</div></div>
      ${boutonsTel([[cible, cc.whatsapp ? 'WhatsApp' : t('btnAppeler'), true]])}`
      : `<p class="desc">${t('contacterHote')}</p>`}
      <p class="desc">${echap(tr(s, 'description'))}</p>
    </div>`;
  $('#voile').classList.add('ouvert'); $('#fiche').scrollTop = 0;
}
function fermer() { $('#voile').classList.remove('ouvert'); }
$('#voile').addEventListener('click', e => { if (e.target.id === 'voile' || e.target.closest('[data-fermer]')) fermer(); });

// ── Heure et météo ───────────────────────────────────────
let meteoActuelle = null;
function horloge() {
  const n = new Date();
  const h = n.toLocaleTimeString(t('locale'), { hour: '2-digit', minute: '2-digit' });
  if ($('#heure')) $('#heure').textContent = h;
  if ($('#date')) $('#date').textContent = n.toLocaleDateString(t('locale'), { weekday: 'long', day: 'numeric', month: 'long' });
  $('#heureVeille').textContent = meteoActuelle ? `${h} · ${meteoActuelle.temperature}°` : h;
}
function meteoAffiche() {
  if (!meteoActuelle) return;
  const ciel = t('ciel').filter(([c]) => meteoActuelle.code >= c).pop();
  const txt = meteoActuelle.jour ? ciel[1] : ciel[2], deg = `${meteoActuelle.temperature}°`;
  $('#tempRail').textContent = deg; $('#cielRail').textContent = txt;
  if ($('#temp')) { $('#temp').textContent = deg; $('#ciel').textContent = txt; }
  if ($('#coucher') && meteoActuelle.coucher) $('#coucher').textContent = `${t('coucher')} ${heure(minutes(meteoActuelle.coucher))}`;
}
let meteoRetry;
async function meteo() {
  clearTimeout(meteoRetry);
  try {
    const r = await fetch(`/api/adstay-meteo?lat=${D.ville.lat}&lon=${D.ville.lon}`);
    if (!r.ok) throw new Error(r.status);
    meteoActuelle = await r.json();
    meteoAffiche(); horloge();
  } catch {
    meteoRetry = setTimeout(meteo, 2 * 60000); // nouvel essai dans 2 minutes
  }
}

// ── Diaporama de veille ──────────────────────────────────
const diapos = D.commercants.flatMap(c => Array(formule(c.formule).diaporama || 0).fill(c));
// On évite deux fois la même marque d'affilée
for (let i = 1; i < diapos.length; i++) if (diapos[i] === diapos[i - 1]) {
  const j = diapos.findIndex((d, k) => k > i && d !== diapos[i] && d !== diapos[i - 2]);
  if (j > 0) [diapos[i], diapos[j]] = [diapos[j], diapos[i]];
}
$('#region').textContent = D.ville.region || '';
function diapositives() {
  $('#diapos').innerHTML = `
  <div class="diapo accueil"><div class="fond" style="${fond(D.ville, 3840)}"></div>
    <span class="ville">${echap(D.ville.nom)}</span><span class="sous">Bienvenue chez vous · Welcome home</span><span class="trait"></span></div>`
  + diapos.map(c => `
  <div class="diapo" data-id="${echap(c.id)}"><div class="fond" style="${fond(c, 3840)}"></div>
    <span class="cat petit">${echap(tr(categorie(c.categorie), 'nom'))}</span>
    <span class="titre">${echap(c.nom)}</span><span class="acc">${echap(tr(c, 'accroche'))}</span>
    ${offre(c) ? `<span class="offre">${echap(offre(c))}</span>` : ''}
    <div class="qr-veille"><img src="${lienQR(c)}" alt="QR code" loading="lazy"/>${lienDe(c) ? t('scanResa') : t('scanIti')}</div></div>`).join('');
}

let minuteur, tourne, indice = 0;
function diapoSuivante() {
  const els = document.querySelectorAll('.diapo'); if (!els.length) return;
  els.forEach(e => e.classList.remove('visible'));
  const n = indice++ % els.length;
  els[n].classList.add('visible');
  if (els[n].dataset.id) window.adstayNoter(els[n].dataset.id, 'diaporama', logement);
  const deux = x => String(x).padStart(2, '0');
  $('#compteur').textContent = `${deux(n + 1)} / ${deux(els.length)}`;
}
function veille() {
  // Tablette allumée en continu : on recharge toutes les 6 h pour prendre les nouvelles fiches
  if (Date.now() - chargeLe > 6 * 3600 * 1000) return location.reload();
  fermer(); indice = 0; $('#veille').classList.add('active'); diapoSuivante();
  tourne = setInterval(diapoSuivante, D.veille.dureeDiapo * 1000);
}
function reveil() {
  if ($('#veille').classList.contains('active')) {
    $('#veille').classList.remove('active'); clearInterval(tourne);
    recherche = ''; aller('accueil'); // propre pour le prochain voyageur
  }
  clearTimeout(minuteur);
  minuteur = setTimeout(veille, D.veille.apresSecondes * 1000);
}
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, reveil, { passive: true }));
document.addEventListener('contextmenu', e => e.preventDefault());

document.documentElement.lang = lang; $('#inviteTexte').textContent = t('invite');
diapositives(); menu(); afficher(); horloge(); meteo(); reveil();
setInterval(horloge, 15000); setInterval(meteo, 30 * 60000);
// Les badges « ouvert / fermé » se mettent à jour toutes les 5 minutes
setInterval(() => { if (ecran !== 'accueil' && !$('#q')) afficher(); }, 5 * 60000);
// ?veille dans l'adresse : lance directement le diaporama (pratique pour tester)
if (new URLSearchParams(location.search).has('veille')) veille();
})();
</script>
</body>
</html>
