<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<meta name="theme-color" content="#f4efe7"/>
<title>Votre bon — AdStay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap"/>
<style>
:root{--ivoire:#f4efe7;--papier:#fbf8f3;--encre:#1b2430;--texte2:#5b616c;--laiton:#a8844c;--or:#d9b97f;--trait:rgba(27,36,48,.1);--vert:#3f6b4e;--rouge:#b5574f;--serif:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ivoire)}
body{min-height:100vh;color:var(--encre);font-family:Jost,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 60% at 50% -10%,#fbe9d6,transparent 60%),var(--ivoire)}
.page{max-width:480px;margin:0 auto;padding:18px 16px 50px}
.logo{display:block;width:118px;margin:4px auto 18px}
.vide{text-align:center;color:var(--texte2);padding:60px 10px}

/* Le bon : un vrai ticket, avec encoches et pointillés */
.ticket{position:relative;border-radius:26px;background:var(--papier);box-shadow:0 1px 2px rgba(27,36,48,.06),0 24px 50px -28px rgba(27,36,48,.45);overflow:hidden}
.ticket .photo{height:150px;background:#2a3442 center/cover no-repeat;position:relative}
.ticket .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.1),rgba(10,14,20,.65))}
.ticket .photo span{position:absolute;left:22px;bottom:16px;z-index:1;color:#fff;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.ticket .haut{padding:22px 24px 24px;text-align:center}
.ticket .chez{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--laiton)}
.ticket h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.05;margin-top:6px}
.ticket .offre{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.15;color:#7d6236;margin-top:16px}
.coupe{position:relative;height:0;border-top:2px dashed rgba(168,132,76,.35);margin:0 22px}
.coupe::before,.coupe::after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--ivoire)}
.coupe::before{left:-38px}.coupe::after{right:-38px}
.ticket .bas{padding:22px 24px 26px;text-align:center}
.code{font-family:Jost,monospace;font-weight:400;font-size:34px;letter-spacing:.14em;margin:4px 0 6px}
.validite{color:var(--texte2);font-size:14px}
/* Preuve que le bon est « vivant » (pas une capture d'écran) : bande qui bouge et heure qui défile */
.vivant{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;padding:10px 14px;border-radius:999px;font-size:13px;color:#fff;
  background:linear-gradient(90deg,#a8844c,#d9b97f,#a8844c);background-size:200% 100%;animation:vit 3s linear infinite}
.vivant i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pouls 1.4s infinite}
@keyframes vit{to{background-position:-200% 0}}
@keyframes pouls{50%{opacity:.3}}
/* Bon utilisé / expiré : tampon */
.ticket.fini .haut,.ticket.fini .bas > :not(.tampon){opacity:.45}
.ticket.fini .vivant{display:none}
.tampon{display:none;margin:6px auto 0;padding:10px 18px;border:3px solid var(--vert);border-radius:12px;color:var(--vert);font-weight:500;font-size:18px;letter-spacing:.14em;text-transform:uppercase;transform:rotate(-4deg);width:fit-content}
.tampon small{display:block;font-size:12px;letter-spacing:.06em;text-transform:none;font-weight:400;margin-top:2px}
.ticket.fini .tampon{display:block}
.ticket.expire .tampon{border-color:var(--rouge);color:var(--rouge)}

.mode{margin:20px 4px 0;color:var(--texte2);font-size:15px;line-height:1.5;text-align:center}
.mode b{color:var(--encre);font-weight:400}
.bouton{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:14px;border:0;border-radius:999px;font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.bouton.plein{background:var(--encre);color:var(--ivoire)}
.bouton.creux{background:transparent;border:1px solid var(--encre);color:var(--encre)}
.bouton.valider{height:48px;background:transparent;border:1px dashed rgba(27,36,48,.35);color:var(--texte2);font-size:12px}
.liens{display:flex;gap:10px}.liens .bouton{flex:1}
.infos{margin-top:22px;display:flex;flex-direction:column;gap:6px;color:var(--texte2);font-size:14px;text-align:center}
.demo{margin-top:16px;text-align:center;color:var(--laiton);font-size:13px}

/* Pavé du commerçant */
.voile{position:fixed;inset:0;z-index:5;background:rgba(12,17,24,.45);display:none;align-items:flex-end;justify-content:center}
.voile.ouvert{display:flex}
.pave{width:100%;max-width:480px;background:var(--papier);border-radius:28px 28px 0 0;padding:14px 22px 28px;animation:monte .5s cubic-bezier(.32,.72,0,1)}
@keyframes monte{from{transform:translateY(100%)}}
.pave .poignee{width:44px;height:5px;border-radius:3px;background:rgba(27,36,48,.18);margin:0 auto 14px}
.pave h2{font-family:var(--serif);font-weight:500;font-size:28px;text-align:center}
.pave p{color:var(--texte2);font-size:14px;text-align:center;margin-top:4px}
.points{display:flex;justify-content:center;gap:14px;margin:20px 0 6px}
.points i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--encre);transition:background .15s}
.points i.on{background:var(--encre)}
.erreur{min-height:22px;text-align:center;color:var(--rouge);font-size:14px}
.touches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.touches button{height:62px;border:0;border-radius:18px;background:#efe9df;font:inherit;font-size:26px;color:var(--encre);cursor:pointer}
.touches button:active{background:#e2d9ca}
.touches .vide-t{background:transparent}
.secoue{animation:secoue .4s}
@keyframes secoue{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.vivant,.vivant i,.pave{animation:none}}
</style>
</head>
<body>
<div class="page">
  <img class="logo" src="/adstay/logo-marque.webp" alt="AdStay"/>
  <div id="contenu"><p class="vide">…</p></div>
</div>
<div class="voile" id="voile"><div class="pave" id="pave"></div></div>
<script src="/adstay/donnees.js"></script>
<script src="/adstay/config.js"></script>
<script src="/adstay/charger.js"></script>
<script>
// Bon de promotion reçu en scannant le QR d'une fiche sur la tablette.
// Le voyageur le montre en caisse ; le commerçant le valide avec son code (une seule fois).
(async () => {
  await window.ADSTAY_PRET;
  const D = window.ADSTAY, C = window.ADSTAY_CONFIG || {}, q = new URLSearchParams(location.search);
  const en = q.get('lang') === 'en', id = q.get('f') || '', logement = q.get('l') || '';
  document.documentElement.lang = en ? 'en' : 'fr';
  const T = en ? {
    titre: 'Your voucher', chez: 'Your gift at', valable: d => `Valid until ${d}`, vivant: 'Live voucher', mode: '<b>Show this voucher when you pay.</b> The staff validates it with their code. One use only.',
    valider: 'For staff: validate', utilise: 'Used', le: d => `on ${d}`, expire: 'Expired', inconnu: 'This place is no longer available.', sansOffre: 'This place has no offer at the moment.',
    paveTitre: 'Validation', paveTexte: 'For the staff only: enter your validation code.', pin: n => `Wrong code${n !== undefined ? ` — ${n} attempt${n > 1 ? 's' : ''} left` : ''}`,
    bloque: 'Too many attempts: this voucher is blocked.', deja: 'This voucher has already been used.', reseau: 'No connection, please try again.', ok: 'Validated — thank you!',
    iti: 'Directions', resa: 'Book', appel: 'Call', demo: 'Demo: validation code 1234', locale: 'en-GB',
  } : {
    titre: 'Votre bon', chez: 'Votre cadeau chez', valable: d => `Valable jusqu’au ${d}`, vivant: 'Bon en direct', mode: '<b>Montrez ce bon au moment de payer.</b> Le commerçant le valide avec son code. Il ne sert qu’une fois.',
    valider: 'Réservé à l’établissement : valider', utilise: 'Utilisé', le: d => `le ${d}`, expire: 'Expiré', inconnu: 'Cette adresse n’est plus disponible.', sansOffre: 'Cette adresse n’a pas d’offre en ce moment.',
    paveTitre: 'Validation', paveTexte: 'Réservé au commerçant : tapez votre code de validation.', pin: n => `Code incorrect${n !== undefined ? ` — encore ${n} essai${n > 1 ? 's' : ''}` : ''}`,
    bloque: 'Trop d’essais : ce bon est bloqué.', deja: 'Ce bon a déjà été utilisé.', reseau: 'Pas de connexion, réessayez.', ok: 'Validé — merci !',
    iti: 'Itinéraire', resa: 'Réserver', appel: 'Appeler', demo: 'Démo : code de validation 1234', locale: 'fr-FR',
  };
  document.title = `${T.titre} — AdStay`;
  const $ = s => document.querySelector(s);
  const echap = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const tr = (o, k) => (en && o?.[k + '_en']) || o?.[k] || '';
  const c = (D.commercants || []).find(m => String(m.id) === id);
  if (!c) { $('#contenu').innerHTML = `<p class="vide">${T.inconnu}</p>`; return; }
  if (!tr(c, 'offre')) { $('#contenu').innerHTML = `<p class="vide">${T.sansOffre}</p>`; return; }

  // Base branchée + vraie fiche → bons enregistrés ; sinon (démo) bon gardé sur le téléphone
  const vrai = !!(C.supabaseUrl && C.supabaseAnonKey) && window.adstayEstUuid(id);
  const rpc = async (nom, corps) => {
    const r = await fetch(`${C.supabaseUrl}/rest/v1/rpc/${nom}`, { method: 'POST',
      headers: { apikey: C.supabaseAnonKey, Authorization: `Bearer ${C.supabaseAnonKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(corps), signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error(r.status); return r.json();
  };
  const CLE = 'adstay-bon-' + id;
  const lireLocal = () => { try { return JSON.parse(localStorage.getItem(CLE)); } catch { return null; } };
  const garder = b => { try { localStorage.setItem(CLE, JSON.stringify(b)); } catch {} };
  const lettres = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const codeDemo = () => 'AD-' + Array.from(crypto.getRandomValues(new Uint8Array(5)), x => lettres[x % lettres.length]).join('');

  // Un bon déjà reçu pour cette adresse est réutilisé ; un nouveau n'est créé que si l'ancien
  // a expiré ou a été utilisé il y a plus de 12 h (nouvelle visite).
  async function obtenir() {
    let b = lireLocal();
    if (b && vrai) { try { b = await rpc('adstay_bon_lire', { p_code: b.code }) || null; } catch {} }
    const perime = b && (new Date(b.expire_le) < new Date() || (b.utilise_le && Date.now() - new Date(b.utilise_le) > 12 * 3600e3));
    if (b && !perime) return b;
    b = vrai ? await rpc('adstay_bon_creer', { p_commercant: id, p_logement: logement })
      : { code: codeDemo(), offre: c.offre, offre_en: c.offre_en, cree_le: new Date().toISOString(), expire_le: new Date(Date.now() + 7 * 864e5).toISOString(), utilise_le: null };
    if (!b) throw new Error('refus');
    window.adstayNoter(id, 'scan', logement);
    return b;
  }
  let bon;
  try { bon = await obtenir(); garder(bon); }
  catch { bon = lireLocal(); if (!bon) { $('#contenu').innerHTML = `<p class="vide">${T.reseau}</p>`; return; } }

  const date = (d, h) => new Date(d).toLocaleDateString(T.locale, { weekday: 'long', day: 'numeric', month: 'long', ...(h ? { hour: '2-digit', minute: '2-digit' } : {}) });
  const formule = (D.formules || []).find(f => f.id === c.formule) || { rang: 0 };
  const lien = formule.rang >= 2 && /^https?:\/\//i.test(c.lien || '') ? c.lien : '';
  const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.nom + ', ' + (c.adresse || ''));
  const photo = !c.photo ? '' : c.photo.includes('images.unsplash.com') ? `${c.photo}${c.photo.includes('?') ? '&' : '?'}w=1000&q=80&auto=format&fit=crop` : c.photo;
  const categorie = tr((D.categories || []).find(x => x.id === c.categorie), 'nom');

  function afficher() {
    const utilise = !!bon.utilise_le, expire = !utilise && new Date(bon.expire_le) < new Date();
    $('#contenu').innerHTML = `
      <div class="ticket ${utilise || expire ? 'fini' : ''} ${expire ? 'expire' : ''}" id="ticket">
        <div class="photo" style="${photo ? `background-image:url('${encodeURI(photo)}')` : ''}"><span>${echap(categorie)}</span></div>
        <div class="haut"><div class="chez">${T.chez}</div><h1>${echap(c.nom)}</h1>
          <div class="offre">${echap(tr(bon, 'offre') || tr(c, 'offre'))}</div></div>
        <div class="coupe"></div>
        <div class="bas">
          <div class="code">${echap(bon.code)}</div>
          <div class="validite">${T.valable(date(bon.expire_le))}</div>
          <div class="vivant"><i></i><span>${T.vivant} · <span id="horloge"></span></span></div>
          <div class="tampon">${utilise ? T.utilise : T.expire}${utilise ? `<small>${T.le(date(bon.utilise_le, true))}</small>` : ''}</div>
        </div>
      </div>
      ${utilise || expire ? '' : `<p class="mode">${T.mode}</p><button class="bouton valider" id="btnValider">${T.valider}</button>`}
      <div class="liens"><a class="bouton creux" href="${echap(lien || maps)}" target="_blank" rel="noopener">${lien ? T.resa : T.iti}</a>
        ${c.tel ? `<a class="bouton creux" href="tel:${echap(c.tel.replace(/\s/g, ''))}">${T.appel}</a>` : ''}</div>
      <div class="infos">${c.adresse ? `<span>${echap(c.adresse)}</span>` : ''}${c.tel ? `<span>${echap(c.tel)}</span>` : ''}</div>
      ${vrai ? '' : `<p class="demo">${T.demo}</p>`}`;
    $('#btnValider')?.addEventListener('click', ouvrirPave);
  }
  setInterval(() => { const h = $('#horloge'); if (h) h.textContent = new Date().toLocaleTimeString(T.locale); }, 1000);

  // Pavé numérique du commerçant
  let saisie = '';
  function ouvrirPave() {
    saisie = '';
    $('#pave').innerHTML = `<div class="poignee"></div><h2>${T.paveTitre}</h2><p>${T.paveTexte}</p>
      <div class="points" id="pts">${'<i></i>'.repeat(4)}</div><div class="erreur" id="err"></div>
      <div class="touches">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}
        <button class="vide-t" data-fermer>✕</button><button data-n="0">0</button><button data-efface>⌫</button></div>`;
    $('#voile').classList.add('ouvert');
  }
  const maj = () => document.querySelectorAll('#pts i').forEach((p, k) => p.classList.toggle('on', k < saisie.length));
  async function envoyer() {
    let r;
    if (vrai) { try { r = await rpc('adstay_bon_utiliser', { p_code: bon.code, p_pin: saisie }); } catch { r = { ok: false, raison: 'reseau' }; } }
    else r = saisie === '1234' ? { ok: true, utilise_le: new Date().toISOString() } : { ok: false, raison: 'pin' };
    if (r.ok) {
      bon.utilise_le = r.utilise_le; garder(bon);
      $('#err').style.color = 'var(--vert)'; $('#err').textContent = T.ok;
      setTimeout(() => { $('#voile').classList.remove('ouvert'); afficher(); }, 700);
      return;
    }
    if (r.raison === 'deja') { bon.utilise_le = r.utilise_le; garder(bon); }
    $('#err').textContent = r.raison === 'bloque' ? T.bloque : r.raison === 'deja' ? T.deja : r.raison === 'reseau' ? T.reseau : T.pin(r.essais_restants);
    $('#pts').classList.remove('secoue'); void $('#pts').offsetWidth; $('#pts').classList.add('secoue');
    saisie = ''; maj();
    if (r.raison === 'deja' || r.raison === 'bloque') setTimeout(() => { $('#voile').classList.remove('ouvert'); afficher(); }, 1400);
  }
  $('#voile').addEventListener('click', e => {
    if (e.target.id === 'voile' || e.target.closest('[data-fermer]')) return $('#voile').classList.remove('ouvert');
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.efface !== undefined) saisie = saisie.slice(0, -1);
    else if (b.dataset.n !== undefined && saisie.length < 4) saisie += b.dataset.n;
    $('#err').textContent = ''; maj();
    if (saisie.length === 4) setTimeout(envoyer, 120);
  });
  afficher();
})();
</script>
</body>
</html>
