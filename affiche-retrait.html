<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiches comptoir — Loc’Air</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,900&display=swap" rel="stylesheet">
<!-- Affiches à imprimer et coller au comptoir de chaque point de retrait.
     Une affiche (format A6) par point, générée depuis /api/points-retrait :
     un nouveau point a automatiquement son affiche. ?p=<id> = un seul point.
     Le QR code ouvre /retrait?p=<id> : il sert au RETOUR (le retrait se fait avec le lien « Mon écran de retrait » de l'email/SMS). -->
<style>
:root{--vif:#1A5EDB;--ink:#0E1726;--ink-2:#4B5873}
*{box-sizing:border-box}
body{margin:0;background:#E9EEF7;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}
.barre{max-width:900px;margin:0 auto;padding:20px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.barre h1{font-size:22px;margin:0}
.barre p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.barre button{border:0;background:var(--vif);color:#fff;font:800 15px 'DM Sans',sans-serif;padding:12px 20px;border-radius:100px;cursor:pointer}
.feuilles{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:0 16px 40px}
.affiche{width:105mm;height:148mm;background:#fff;border-radius:6mm;padding:9mm 8mm;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 10px 30px -14px rgba(11,30,68,.35);page-break-after:always;break-after:page}
.logo{font-weight:900;font-size:9mm;letter-spacing:-.04em;color:var(--vif)}.logo em{font-style:italic}
.titre{font-size:7.4mm;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:5mm 0 1mm}
.en{font-size:4.6mm;color:var(--ink-2);margin:0}
.qr{width:64mm;height:64mm;margin:auto 0;border:2.5mm solid var(--vif);border-radius:4mm;padding:2mm;background:#fff}
.qr img{width:100%;height:100%;display:block}
.point{margin:0;font-size:3.2mm;color:var(--ink-2)} /* repère pour l'impression, pas imprimé */
.vide{color:var(--ink-2);padding:40px;text-align:center}
@media print{
  @page{size:A6;margin:0}
  body{background:#fff}.barre{display:none}
  .feuilles{display:block;padding:0}
  .affiche{box-shadow:none;border-radius:0;margin:0}
  .point{visibility:hidden}
}
</style>
</head>
<body>
<div class="barre">
  <div><h1>Affiches comptoir</h1><p>Une affiche par point de retrait, format A6 (carte postale). À coller près de la caisse.</p></div>
  <button type="button" onclick="window.print()">Imprimer</button>
</div>
<div class="feuilles" id="feuilles"><p class="vide">Chargement…</p></div>
<script>
(function(){
  var seul = new URLSearchParams(location.search).get('p');
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  fetch('/api/points-retrait').then(function(r){ return r.json(); }).then(function(j){
    var pts = ((j && j.points) || []).filter(function(p){ return !seul || p.id === seul; });
    var f = document.getElementById('feuilles');
    if(!pts.length){ f.innerHTML = '<p class="vide">Aucun point de retrait.</p>'; return; }
    f.innerHTML = pts.map(function(p){
      var url = 'https://www.locair.fr/retrait?p=' + encodeURIComponent(p.id);
      var qr = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&ecc=M&data=' + encodeURIComponent(url);
      return '<section class="affiche">' +
        '<div class="logo">Loc<em>’Air</em></div>' +
        '<p class="titre">Retour du climatiseur</p>' +
        '<p class="en">Air conditioner return</p>' +
        '<div class="qr"><img src="' + qr + '" alt="QR code"></div>' +
        '<p class="point">' + esc(p.nom) + (p.exemple ? ' (exemple)' : '') + '</p>' +
      '</section>';
    }).join('');
  }).catch(function(){ document.getElementById('feuilles').innerHTML = '<p class="vide">Impossible de charger les points. Rechargez la page.</p>'; });
})();
</script>
</body>
</html>
