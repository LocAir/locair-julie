<body style="margin:0;background:#fff">
<pre id="out" style="font:12px monospace;padding:8px"></pre>
<iframe id="f" style="width:320px;height:700px;border:0;position:absolute;left:-3000px"></iframe>
<script>
try{localStorage.setItem('locair_cookie_consent','refused')}catch(e){}
var pages=['/version-b.html','/pro.html'], o=[], i=0;
function suivant(){
  if(i>=pages.length){document.getElementById('out').textContent=o.join('\n');return;}
  var f=document.getElementById('f'); f.src=pages[i++];
  f.onload=function(){
    var d=f.contentDocument,w=f.contentWindow,errs=[];
    w.onerror=function(m){errs.push(String(m))};
    setTimeout(function(){
      var r=[];
      ['fr','en','zh','ru'].forEach(function(L){
        try{w.setLangue(L)}catch(e){}
        r.push(L+':'+d.documentElement.scrollWidth);
      });
      o.push(pages[i-1]+'  '+r.join(' ')+'  err='+JSON.stringify(errs));
      suivant();
    },1600);
  };
}
suivant();
</script></body>
