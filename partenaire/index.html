<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Espace ambassadeur — Loc'Air</title>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#1a2b4a"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet"/>
<style>
:root{
  --blue:#1a2b4a; --blue-d:#12203a; --blue-lt:#f4f6f9; --blue-mid:#2d5a9e;
  --black:#1a1a1a; --bg:#f4f6f9; --white:#ffffff;
  --grey:#555555; --grey2:#888888; --rule:#e4e4e4;
  --gold:#c5a96c; --gold-lt:rgba(197,169,108,.08); --gold-d:#b08c48;
  --green:#16a34a; --green-bg:rgba(22,163,74,.08);
  --red:#dc2626; --red-bg:rgba(220,38,38,.07);
  --amber:#d97706; --amber-bg:rgba(217,119,6,.08);
  --disp:'Cormorant Garamond',Georgia,serif;
  --body:'Inter',system-ui,sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --sh-xs:0 1px 2px rgba(26,43,74,.04);
  --sh-sm:0 2px 8px rgba(26,43,74,.07),0 1px 3px rgba(26,43,74,.04);
  --sh-md:0 4px 24px rgba(26,43,74,.09),0 1px 6px rgba(26,43,74,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--black);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
.hidden{display:none!important}

/* ── Topbar ── */
.topbar{
  background:var(--blue-d);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.logo{font-family:var(--disp);font-size:20px;font-weight:600;color:#fff;letter-spacing:.01em}
.logo span{color:var(--gold)}
.who{font-size:12px;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:6px}
.who strong{color:rgba(255,255,255,.85);font-weight:600}
.who button{background:none;border:none;color:var(--gold);font-size:11.5px;font-family:var(--body);cursor:pointer;padding:0;text-decoration:underline;opacity:.85}

/* ── Layout ── */
.page{max-width:520px;margin:0 auto;padding:28px 16px 72px}

/* ── Login screen ── */
.login-hero{
  text-align:center;
  padding:40px 0 32px;
}
.login-hero .badge{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--gold-lt);border:1px solid rgba(197,169,108,.3);
  border-radius:100px;padding:6px 14px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-d);
  margin-bottom:22px;
}
.login-hero h1{
  font-family:var(--disp);font-size:30px;font-weight:600;color:var(--blue);
  margin-bottom:8px;line-height:1.2;
}
.login-hero .sub{font-size:14.5px;color:var(--grey);line-height:1.6;max-width:300px;margin:0 auto}

.card{
  background:var(--white);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:24px 22px;box-shadow:var(--sh-sm);margin-bottom:12px;
}
.card-title{font-family:var(--disp);font-size:18px;font-weight:600;color:var(--blue);margin-bottom:4px}
.card-sub{font-size:13.5px;color:var(--grey);line-height:1.55;margin-bottom:18px}

label.field-lbl{
  display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--grey);margin-bottom:6px;
}
.field{margin-bottom:14px}
input[type=text],input[type=password]{
  width:100%;padding:14px 16px;border:1.5px solid var(--rule);border-radius:var(--r-sm);
  font-size:16px;font-family:var(--body);background:var(--white);color:var(--black);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
input[readonly]{background:var(--bg);color:var(--black);font-size:13.5px;cursor:text}
.field-hint{font-size:11.5px;color:var(--grey2);margin-top:5px;line-height:1.4}

.btn{
  width:100%;padding:16px 20px;border:none;border-radius:100px;font-family:var(--body);
  font-size:15.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;transition:opacity .15s,transform .1s;
}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 16px rgba(26,43,74,.22)}
.btn-secondary{background:var(--white);color:var(--blue);border:1.5px solid var(--rule)}
.btn-ghost{background:none;color:var(--grey);border:none;width:auto;min-height:auto;padding:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98);opacity:.9}
.btn+.btn{margin-top:10px}
.btn-gold{background:var(--gold);color:var(--blue-d);box-shadow:0 4px 14px rgba(197,169,108,.3)}

.err-msg{background:var(--red-bg);color:var(--red);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px;margin-top:12px;display:none;line-height:1.5}
.ok-msg{background:var(--green-bg);color:var(--green);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px;margin-top:12px;display:none;line-height:1.5}
.forgot-link{
  display:block;width:100%;background:none;border:none;color:var(--grey2);
  font-size:12.5px;font-family:var(--body);cursor:pointer;text-align:center;
  margin-top:14px;text-decoration:underline;padding:4px;
}

/* ── Face ID screen ── */
.fid-screen{text-align:center;padding:56px 0 0}
.fid-icon{font-size:56px;margin-bottom:20px;line-height:1}
.fid-name{font-family:var(--disp);font-size:26px;font-weight:600;color:var(--blue);margin-bottom:6px}
.fid-sub{font-size:14px;color:var(--grey);line-height:1.55;margin-bottom:28px}
.fid-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:16px;border:none;border-radius:100px;
  background:var(--blue);color:#fff;font-family:var(--body);font-size:15.5px;
  font-weight:700;cursor:pointer;min-height:54px;
  box-shadow:0 4px 16px rgba(26,43,74,.22);
}
.fid-btn:disabled{opacity:.5;cursor:not-allowed}
.fid-offer{
  background:var(--gold-lt);border:1px solid rgba(197,169,108,.25);
  border-radius:var(--r);padding:18px;margin-bottom:14px;text-align:center;
}
.fid-offer-title{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:5px}
.fid-offer-sub{font-size:12.5px;color:var(--grey);margin-bottom:14px;line-height:1.5}

/* ── Dashboard ── */
.topnote{
  display:flex;align-items:center;gap:10px;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--grey);padding:4px 0 18px;
}
.topnote::before{content:'';display:block;width:20px;height:1.5px;background:var(--gold);flex-shrink:0}

/* Commission hero */
.commission-hero{
  background:linear-gradient(145deg,var(--blue) 0%,var(--blue-mid) 45%,var(--blue-d) 100%);
  border-radius:var(--r-lg);padding:26px 22px;margin-bottom:12px;
  box-shadow:var(--sh-md);position:relative;overflow:hidden;
}
.commission-hero::before{
  content:'';position:absolute;right:-30px;top:-30px;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(197,169,108,.12) 0%,transparent 70%);
}
.ch-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.55);margin-bottom:8px}
.ch-amount{font-family:var(--disp);font-size:44px;font-weight:600;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.ch-caption{font-size:12.5px;color:rgba(255,255,255,.65);margin-top:8px;line-height:1.5}
.ch-actions{margin-top:18px;display:flex;flex-direction:column;gap:8px}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-cell{
  background:var(--white);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px 14px;box-shadow:var(--sh-xs);display:flex;flex-direction:column;
}
.stat-n{font-size:22px;font-weight:700;color:var(--black);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat-n.accent{color:var(--blue);font-weight:800}
.stat-l{font-size:10.5px;color:var(--grey);font-weight:600;margin-top:5px;text-transform:uppercase;letter-spacing:.04em;line-height:1.4}

/* Affiliation */
.aff-section{background:var(--white);border:1px solid var(--rule);border-radius:var(--r-lg);padding:20px 18px;margin-bottom:12px;box-shadow:var(--sh-xs)}
.aff-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);margin-bottom:3px}
.aff-desc{font-size:13px;color:var(--grey);line-height:1.5;margin-bottom:14px}
.link-copy-row{display:flex;gap:8px;align-items:stretch}
.link-copy-row input{flex:1;font-size:12.5px;padding:11px 12px;min-width:0}
.copy-btn{
  flex-shrink:0;padding:0 16px;background:var(--blue);color:#fff;border:none;
  border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;
  font-family:var(--body);display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.copy-btn:active{opacity:.85}

/* Section header */
.section-hd{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--grey);margin:22px 0 8px;display:flex;align-items:center;justify-content:space-between;
}

/* Month accordion */
.month-card{
  background:var(--white);border:1px solid var(--rule);border-radius:var(--r);
  margin-bottom:8px;box-shadow:var(--sh-xs);overflow:hidden;
}
.month-card summary{
  list-style:none;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;font-weight:600;font-size:14px;
  user-select:none;-webkit-user-select:none;
}
.month-card summary::-webkit-details-marker{display:none}
.month-card[open] summary{border-bottom:1px solid var(--rule)}
.month-sum{font-size:12.5px;color:var(--grey);font-weight:600;flex-shrink:0}
.resa-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--rule);font-size:13.5px;
}
.resa-row:last-child{border-bottom:none}
.resa-client{font-weight:600}
.resa-meta{font-size:11.5px;color:var(--grey);margin-top:2px}
.resa-right{text-align:right;flex-shrink:0}
.resa-amount{font-weight:700;font-size:14px}

/* Vchip */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 8px 3px 7px;border-radius:100px;margin-top:4px;
}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.chip-verse{background:var(--green-bg);color:var(--green)}
.chip-pending{background:var(--amber-bg);color:var(--amber)}
.chip-prolong{background:var(--blue-lt);color:var(--blue-mid);font-size:9px;margin-top:0}

/* Virements historique */
.vir-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--rule);font-size:13.5px;
}
.vir-row:last-child{border-bottom:none}
.vir-date{color:var(--grey);font-size:12.5px}
.vir-amount{font-weight:700}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(10,18,30,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(4px)}

/* Spinner */
.spinner-wrap{display:flex;justify-content:center;padding:64px 0}
.spinner{width:26px;height:26px;border:2.5px solid var(--rule);border-top-color:var(--blue);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;color:var(--grey);font-size:14px;padding:40px 10px}

/* Separator */
.sep{height:1px;background:var(--rule);margin:18px 0}

/* Stats grandes (total versé, année, prévision) */
.big-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.big-stat{background:var(--white);border:1px solid var(--rule);border-radius:var(--r);padding:14px 12px;box-shadow:var(--sh-xs);text-align:center}
.big-stat .bn{font-size:16px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.big-stat .bl{font-size:10px;color:var(--grey);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:5px;line-height:1.3}

/* Partage lien */
.share-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.share-btn{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 10px;border-radius:var(--r-sm);font-size:12.5px;font-weight:700;
  font-family:var(--body);cursor:pointer;border:none;text-decoration:none;white-space:nowrap;
}
.share-wa{background:#25d366;color:#fff}
.share-email{background:var(--blue-lt);color:var(--blue);border:1px solid rgba(26,43,74,.15)}

/* QR code */
.qr-section{margin-top:16px;display:flex;gap:16px;align-items:center}
.qr-img-wrap{flex-shrink:0;background:#fff;border:1px solid var(--rule);border-radius:var(--r-sm);padding:8px;box-shadow:var(--sh-xs)}
.qr-img-wrap img{display:block;width:88px;height:88px}
.qr-info{flex:1}
.qr-info p{font-size:12.5px;color:var(--grey);line-height:1.5;margin-bottom:8px}
.qr-dl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-lt);border:1px solid rgba(26,43,74,.12);border-radius:100px;padding:5px 12px;cursor:pointer;text-decoration:none}

/* Prévision pipeline */
.pipeline-note{
  background:var(--amber-bg);border:1px solid rgba(156,106,23,.2);border-radius:var(--r);
  padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
}
.pipeline-note .pn-amount{font-size:18px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;flex-shrink:0}
.pipeline-note .pn-text{font-size:12.5px;color:var(--amber);line-height:1.4}

/* Statut de la demande de virement en cours */
.payout-status{
  background:var(--amber-bg);border:1px solid rgba(156,106,23,.2);border-radius:var(--r);
  padding:14px;margin-bottom:12px;display:flex;align-items:flex-start;gap:12px;
}
.payout-status .ps-icon{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px}
.payout-status .ps-title{font-size:13.5px;font-weight:700;color:var(--amber);margin-bottom:2px}
.payout-status .ps-sub{font-size:12px;color:var(--amber);line-height:1.5;opacity:.9}

/* Note de confiance sur le lien */
.aff-note{
  display:flex;align-items:flex-start;gap:8px;
  background:var(--blue-lt);border:1px solid rgba(26,43,74,.1);border-radius:var(--r-sm);
  padding:10px 12px;margin-top:14px;font-size:12px;color:var(--blue);line-height:1.5;
}
.aff-note .an-icon{flex-shrink:0;line-height:1.4}

/* Export PDF */
.export-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px;border:1.5px solid var(--rule);border-radius:var(--r);
  background:var(--white);color:var(--grey);font-family:var(--body);
  font-size:13.5px;font-weight:600;cursor:pointer;
  box-shadow:var(--sh-xs);margin-top:8px;
}
.export-btn:hover{border-color:var(--blue);color:var(--blue)}

/* WhatsApp flottant */
.wa-fab{
  position:fixed;bottom:24px;right:20px;z-index:100;
  display:flex;align-items:center;gap:9px;
  background:var(--blue);color:#fff;
  border-radius:100px;padding:12px 18px 12px 14px;
  box-shadow:0 4px 18px rgba(26,43,74,.3),0 2px 8px rgba(0,0,0,.1);
  font-family:var(--body);font-size:14px;font-weight:700;
  text-decoration:none;cursor:pointer;
  transition:transform .15s,box-shadow .15s,opacity .15s;
}
.wa-fab:hover{transform:translateY(-2px);opacity:.9;box-shadow:0 8px 24px rgba(26,43,74,.35),0 3px 10px rgba(0,0,0,.12)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Loc<span>'Air</span></div>
  <div class="who hidden" id="who-badge"></div>
</div>

<!-- Bouton WhatsApp assistance -->
<a class="wa-fab" href="https://wa.me/33663798756" target="_blank" rel="noopener noreferrer" aria-label="Contacter Loc'Air sur WhatsApp">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.528 5.855L.057 23.943l6.243-1.635A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.894a9.877 9.877 0 01-5.031-1.38l-.361-.214-3.706.972.988-3.614-.235-.372A9.855 9.855 0 012.106 12C2.106 6.53 6.53 2.106 12 2.106c5.47 0 9.894 4.424 9.894 9.894 0 5.47-4.424 9.894-9.894 9.894z"/></svg>
  Assistance
</a>

<div class="page">

  <!-- Écran 1 : connexion -->
  <div id="login-screen">
    <div class="login-hero">
      <div class="badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Espace ambassadeur
      </div>
      <h1>Bienvenue</h1>
      <p class="sub">Suivez vos réservations et commissions Loc'Air en temps réel.</p>
    </div>

    <div class="card">
      <div class="field">
        <label class="field-lbl" for="lg-aff-code">Votre code partenaire (optionnel)</label>
        <input type="text" id="lg-aff-code" placeholder="ex : DUPONT" autocomplete="off" autocapitalize="none" spellcheck="false"/>
        <div class="field-hint">Vous retrouverez ce code dans l'email de bienvenue Loc'Air.</div>
      </div>
      <div class="field">
        <label class="field-lbl" for="lg-pin">Code secret (6 chiffres)</label>
        <input type="password" id="lg-pin" inputmode="numeric" autocomplete="current-password" placeholder="••••••" maxlength="6"/>
      </div>
      <button class="btn btn-primary" id="lg-btn" onclick="doLogin()">Se connecter →</button>
      <div class="err-msg" id="lg-err"></div>
      <button class="forgot-link" onclick="openForgotPin()">Code oublié ? Recevoir un nouveau code par e-mail</button>
    </div>
  </div>

  <!-- Écran Face ID -->
  <div id="faceid-screen" class="hidden">
    <div class="fid-screen">
      <div class="fid-icon">🔒</div>
      <div class="fid-name" id="fid-greet">Bonjour</div>
      <p class="fid-sub">Authentifiez-vous pour accéder à votre espace ambassadeur.</p>
      <button class="fid-btn" id="fid-login-btn" onclick="doFaceIdLogin()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-1a6 6 0 0112 0v1"/><path d="M17 13s1 1.5 1 3"/><path d="M7 13s-1 1.5-1 3"/><path d="M15 9.5a3 3 0 010 5"/><path d="M9 9.5a3 3 0 000 5"/></svg>
        Face ID / Touch ID
      </button>
      <div class="err-msg" id="fid-err" style="margin-top:14px;text-align:left"></div>
      <button class="forgot-link" onclick="showPinForm()" style="margin-top:18px">Utiliser mon code →</button>
    </div>
  </div>

  <!-- Écran 2 : tableau de bord -->
  <div id="dashboard-screen" class="hidden">
    <div id="dashboard-content"><div class="spinner-wrap"><div class="spinner"></div></div></div>
  </div>

</div>

<script>
const API = (path) => '/api/' + path;

let STATE = {
  token: localStorage.getItem('p_token') || '',
  partenaireId: localStorage.getItem('p_id') ? parseInt(localStorage.getItem('p_id')) : null,
  nom: localStorage.getItem('p_nom') || '',
  code: localStorage.getItem('p_code') || '',
  taux: localStorage.getItem('p_taux') ? parseInt(localStorage.getItem('p_taux')) : 10,
};

function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function show(id){
  ['login-screen','faceid-screen','dashboard-screen'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));
}

// ── Pré-remplir le code depuis l'URL (?p=CODE) ───────────────────────────────
(function prefillCodeFromUrl(){
  const params = new URLSearchParams(location.search);
  const p = params.get('p');
  if(p){
    const codeEl = document.getElementById('lg-aff-code');
    if(codeEl) codeEl.value = p.trim().slice(0,50);
  }
})();

// ── Face ID (WebAuthn) ────────────────────────────────────────────────────────
const FID_KEY = 'p_fid';
async function fidAvailable(){
  if(!window.PublicKeyCredential) return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return false; }
}
function fidB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
function fidBytes(s){ return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)); }
async function fidRegister(label){
  const cred = await navigator.credentials.create({ publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp:{ name:"Loc'Air", id:location.hostname },
    user:{ id:crypto.getRandomValues(new Uint8Array(16)), name:label, displayName:label },
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
    timeout:60000
  }});
  localStorage.setItem(FID_KEY, fidB64(cred.rawId));
}
async function doFaceIdLogin(){
  const stored = localStorage.getItem(FID_KEY);
  if(!stored){ showPinForm(); return; }
  const btn = document.getElementById('fid-login-btn');
  const errEl = document.getElementById('fid-err');
  btn.disabled = true; btn.textContent = 'Authentification…';
  errEl.style.display = 'none';
  try{
    await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{ type:'public-key', id:fidBytes(stored) }],
      userVerification:'required', timeout:60000
    }});
    loadDashboard();
  }catch(e){
    btn.disabled = false;
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M6 20v-1a6 6 0 0112 0v1"/></svg> Face ID / Touch ID`;
    if(e.name==='NotAllowedError'){ errEl.textContent='Annulé — réessayez.'; errEl.style.display='block'; }
    else{
      // Bascule silencieuse vers le code = confusion pour quelqu'un qui vient
      // de cliquer sur Face ID et se retrouve ailleurs sans explication.
      // Un mot de contexte sur l'écran d'arrivée suffit à rassurer.
      showPinForm();
      const lgErr = document.getElementById('lg-err');
      if(lgErr){ lgErr.textContent = "Face ID indisponible pour le moment — connectez-vous avec votre code."; lgErr.style.display = 'block'; }
    }
  }
}
function showPinForm(){ show('login-screen'); }
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && !/Win32|Win64|MacIntel/.test(navigator.platform));
}
async function offerFaceId(){
  if(!isMobileDevice()) return; // Face ID proposé uniquement sur mobile
  if(!(await fidAvailable()) || localStorage.getItem(FID_KEY)) return;
  const zone = document.getElementById('dashboard-content');
  if(!zone) return;
  zone.insertAdjacentHTML('afterbegin',`
    <div class="fid-offer" id="fid-offer">
      <div class="fid-offer-title">🔒 Activer Face ID / Touch ID</div>
      <div class="fid-offer-sub">Accédez à votre espace en un coup d'œil la prochaine fois.</div>
      <button class="btn btn-primary" style="max-width:200px;margin:0 auto 10px;min-height:44px;font-size:14px" onclick="activateFaceId()">Activer</button>
      <br><button class="forgot-link" onclick="document.getElementById('fid-offer').remove()">Non merci</button>
    </div>`);
}
async function activateFaceId(){
  try{
    await fidRegister(STATE.nom || STATE.code || "Ambassadeur Loc'Air");
    const offer = document.getElementById('fid-offer');
    if(offer) offer.outerHTML = '<div class="ok-msg" style="display:block;margin-bottom:14px">✓ Face ID activé — plus besoin de code à la prochaine visite.</div>';
  }catch(e){
    if(e.name!=='NotAllowedError') alert("Impossible d'activer Face ID : " + e.message);
  }
}

function updateWhoBadge(){
  const el = document.getElementById('who-badge');
  if(STATE.token){
    el.classList.remove('hidden');
    el.innerHTML = `<strong>${escHtml(STATE.nom || STATE.code)}</strong><button onclick="logout()">Changer</button>`;
  } else {
    el.classList.add('hidden');
    el.innerHTML = '';
  }
}
function logout(){
  STATE = { token:'', partenaireId:null, nom:'', code:'', taux:10 };
  ['p_token','p_id','p_nom','p_code','p_taux'].forEach(k=>localStorage.removeItem(k));
  const pinEl = document.getElementById('lg-pin');
  if(pinEl) pinEl.value = '';
  updateWhoBadge();
  show('login-screen');
}

async function doLogin(){
  const pin  = (document.getElementById('lg-pin').value || '').trim();
  const code = (document.getElementById('lg-aff-code').value || '').trim().toLowerCase();
  const errEl = document.getElementById('lg-err');
  const btn   = document.getElementById('lg-btn');
  errEl.style.display = 'none';
  if(!pin){ errEl.textContent = 'Entrez votre code secret.'; errEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Connexion…';
  try{
    const body = { pin };
    if(code) body.code = code;
    const r = await fetch(API('partenaire-login'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Erreur de connexion');
    STATE = { token:d.token, partenaireId:d.partenaire_id, nom:d.nom, code:d.code, taux:d.taux_commission_pct };
    localStorage.setItem('p_token', d.token);
    localStorage.setItem('p_id',    d.partenaire_id);
    localStorage.setItem('p_nom',   d.nom);
    localStorage.setItem('p_code',  d.code);
    localStorage.setItem('p_taux',  d.taux_commission_pct);
    updateWhoBadge();
    loadDashboard();
    setTimeout(offerFaceId, 1200);
  }catch(e){
    errEl.textContent = e.message; errEl.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'Se connecter →';
  }
}

function authHeaders(){ return {'Content-Type':'application/json','x-partenaire-token':STATE.token}; }

// ── Mot de passe oublié ───────────────────────────────────────────────────────
function openForgotPin(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'forgot-overlay';
  overlay.innerHTML = `
    <div class="card" style="max-width:380px;width:100%;margin:0">
      <div class="card-title">Code oublié ?</div>
      <div class="card-sub">Entrez l'e-mail associé à votre compte Loc'Air et nous vous enverrons un nouveau code.</div>
      <div class="field">
        <label class="field-lbl" for="forgot-email">Adresse e-mail</label>
        <input type="text" id="forgot-email" placeholder="votre@email.fr" autocomplete="email"/>
      </div>
      <button class="btn btn-primary" id="forgot-send-btn" onclick="sendForgotPin()">Envoyer</button>
      <button class="forgot-link" onclick="closeForgotPin()">Annuler</button>
      <div class="ok-msg" id="forgot-ok"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target===overlay) closeForgotPin(); });
  setTimeout(() => document.getElementById('forgot-email')?.focus(), 50);
}
function closeForgotPin(){ document.getElementById('forgot-overlay')?.remove(); }
async function sendForgotPin(){
  const email = (document.getElementById('forgot-email').value || '').trim();
  if(!email) return;
  const okEl = document.getElementById('forgot-ok');
  const btn  = document.getElementById('forgot-send-btn');
  if(btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Envoi…';
  try{
    const r = await fetch(API('partenaire-forgot-pin'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})});
    if(!r.ok) throw new Error('Erreur serveur');
    document.getElementById('forgot-email').style.display = 'none';
    document.querySelectorAll('#forgot-overlay .btn, #forgot-overlay .forgot-link').forEach(b=>b.style.display='none');
    okEl.textContent = "Si cet e-mail est connu, votre nouveau code vient d'être envoyé. Vérifiez votre boîte mail.";
    okEl.style.display = 'block';
  }catch(e){
    okEl.textContent = "Erreur réseau. Réessayez dans quelques instants.";
    okEl.style.color = 'var(--red)'; okEl.style.background = 'var(--red-bg)';
    okEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Envoyer';
  }
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
async function loadDashboard(){
  show('dashboard-screen');
  const zone = document.getElementById('dashboard-content');
  zone.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  try{
    const r = await fetch(API('partenaire-earnings'), {method:'POST', headers:authHeaders(), body:JSON.stringify({action:'resume'})});
    const d = await r.json();
    if(!r.ok){
      if(r.status===401){ logout(); return; }
      throw new Error(d.error || 'Erreur');
    }
    renderDashboard(d);
  }catch(e){
    zone.innerHTML = '<p class="empty">Impossible de charger votre activité. Réessayez.</p>';
  }
}

function euros(v){ return (v||0).toFixed(2).replace('.',',') + ' €'; }

function renderDashboard(d){
  const zone = document.getElementById('dashboard-content');
  const link = location.origin + '/?p=' + encodeURIComponent(STATE.code);
  const virementEnCours = (d.virements||[]).find(v=>v.statut==='demande');
  const enCours = !!virementEnCours;
  const canAsk  = (d.non_verse_euros||0) > 0 && !enCours;
  const annee   = new Date().getFullYear();
  const qrUrl   = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(link)}&size=176x176&color=1a2b4a&bgcolor=ffffff&qzone=1&format=png`;
  const prevision = d.prevision_attente_euros || 0;
  // Le bouton affiche le montant demandé pour que la personne sache
  // exactement ce qu'elle valide avant de cliquer (comme Stripe Connect
  // affiche toujours le montant sur les actions de paiement).
  const askLabel = enCours
    ? '⏳ Demande en cours'
    : canAsk ? `Demander le virement de ${euros(d.non_verse_euros)} →` : 'Aucun solde à verser';

  zone.innerHTML = `
    <div class="topnote">Tableau de bord ambassadeur</div>

    <!-- Hero commission -->
    <div class="commission-hero">
      <div class="ch-label">Commission disponible</div>
      <div class="ch-amount">${euros(d.non_verse_euros)}</div>
      <div class="ch-caption">${STATE.taux}% de chaque réservation confirmée · versement sur demande</div>
      <div class="ch-actions">
        <button class="btn btn-gold" id="demander-virement-btn"
          ${canAsk?'':'disabled'} onclick="demanderVirement()">
          ${askLabel}
        </button>
      </div>
    </div>
    <div class="err-msg" id="dash-err"></div>

    ${virementEnCours ? `
    <!-- Statut de la demande de virement en cours -->
    <div class="payout-status">
      <div class="ps-icon">⏳</div>
      <div>
        <div class="ps-title">Demande de ${euros(virementEnCours.montant_cents/100)} envoyée le ${virementEnCours.created_at?new Date(virementEnCours.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'long'}):''}</div>
        <div class="ps-sub">Loc'Air traite votre demande sous quelques jours ouvrés. Vous recevrez un e-mail dès que le virement sera effectué.</div>
      </div>
    </div>` : ''}

    <!-- Vue d'ensemble -->
    <div class="big-stats">
      <div class="big-stat">
        <div class="bn">${euros(d.total_verse_euros||0)}</div>
        <div class="bl">Total versé</div>
      </div>
      <div class="big-stat">
        <div class="bn">${euros(d.total_annee_euros||0)}</div>
        <div class="bl">En ${annee}</div>
      </div>
      <div class="big-stat">
        <div class="bn">${d.reservations_total||0}</div>
        <div class="bl">Réservations total</div>
      </div>
    </div>

    ${prevision > 0 ? `
    <!-- Pipeline à venir -->
    <div class="pipeline-note">
      <div class="pn-amount">${euros(prevision)}</div>
      <div class="pn-text">En attente de confirmation client — commission potentielle si ces réservations sont finalisées.</div>
    </div>` : ''}

    <!-- Stat grid mensuelle -->
    <div class="stat-grid">
      <div class="stat-cell">
        <div class="stat-n">${d.reservations_aujourdhui||0}</div>
        <div class="stat-l">Réservation${(d.reservations_aujourdhui||0)>1?'s':''} aujourd'hui</div>
      </div>
      <div class="stat-cell">
        <div class="stat-n accent">${euros(d.gain_aujourdhui_euros)}</div>
        <div class="stat-l">Gagné aujourd'hui</div>
      </div>
      <div class="stat-cell">
        <div class="stat-n">${d.reservations_mois||0}</div>
        <div class="stat-l">Réservation${(d.reservations_mois||0)>1?'s':''} ce mois</div>
      </div>
      <div class="stat-cell">
        <div class="stat-n accent">${euros(d.gain_mois_euros)}</div>
        <div class="stat-l">Gagné ce mois</div>
      </div>
    </div>

    <!-- Lien d'affiliation + partage + QR -->
    <div class="aff-section">
      <div class="aff-title">Lien d'affiliation</div>
      <div class="aff-desc">Partagez ce lien à vos clients. Chaque réservation effectuée depuis ce lien vous est automatiquement attribuée.</div>
      <div class="link-copy-row">
        <input type="text" id="aff-link" value="${escHtml(link)}" readonly onclick="this.select()"/>
        <button class="copy-btn" onclick="copyLink()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copier
        </button>
      </div>
      <div class="ok-msg" id="copy-ok">Lien copié !</div>

      <!-- Boutons de partage rapide -->
      <div class="share-row">
        <a class="share-btn share-wa" href="${escHtml(`https://wa.me/?text=${encodeURIComponent('Réservez votre climatiseur mobile Loc\'Air directement ici : ' + link)}`)}" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.528 5.855L.057 23.943l6.243-1.635A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.894a9.877 9.877 0 01-5.031-1.38l-.361-.214-3.706.972.988-3.614-.235-.372A9.855 9.855 0 012.106 12C2.106 6.53 6.53 2.106 12 2.106c5.47 0 9.894 4.424 9.894 9.894 0 5.47-4.424 9.894-9.894 9.894z"/></svg>
          Envoyer sur WhatsApp
        </a>
        <a class="share-btn share-email" href="${escHtml(`mailto:?subject=Réservez votre climatiseur mobile Loc'Air&body=Bonjour,%0A%0AJe vous partage ce lien pour réserver votre climatiseur mobile Loc'Air :%0A${link}%0A%0ACordialement`)}" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Par e-mail
        </a>
      </div>

      <!-- QR code -->
      <div class="qr-section">
        <div class="qr-img-wrap">
          <img id="qr-img" src="${escHtml(qrUrl)}" alt="QR code lien d'affiliation" width="88" height="88" loading="lazy"/>
        </div>
        <div class="qr-info">
          <p>Imprimez ce QR code et affichez-le dans vos appartements. Vos clients scannent et réservent directement.</p>
          <a class="qr-dl" onclick="downloadQR(event,'${escHtml(qrUrl)}')" href="${escHtml(qrUrl)}" download="locair-qr-${escHtml(STATE.code)}.png" target="_blank">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Télécharger le QR code
          </a>
        </div>
      </div>

      <!-- Rappel du mécanisme d'attribution : évite les commissions "perdues"
           par un partenaire qui pense avoir droit à une commission pour un
           client simplement informé verbalement, sans passer par le lien. -->
      <div class="aff-note">
        <span class="an-icon">💡</span>
        <span>La commission est attribuée automatiquement quand votre client clique sur ce lien ou scanne ce QR code avant de réserver. Une simple mention de Loc'Air ne suffit pas — pensez à toujours partager le lien ou le QR code.</span>
      </div>
    </div>

    ${reservationsHistoryHtml(d.reservations)}
    ${virementsHistoryHtml(d.virements)}

    <!-- Export PDF -->
    <button class="export-btn" onclick="exportPdf()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Exporter relevé de commissions (PDF)
    </button>
  `;

  // Stocker les données pour l'export PDF
  window._DASH_DATA = d;
  window._DASH_LINK = link;
}

function reservationsHistoryHtml(reservations){
  if(!reservations || !reservations.length){
    // Vide mais motivant : indique la prochaine action plutôt qu'un simple
    // constat, pour encourager le partage (logique PartnerStack/Rewardful).
    return `<div class="section-hd">Réservations apportées</div><p class="empty" style="padding:24px 10px">Aucune réservation pour l'instant. Partagez votre lien ou votre QR code ci-dessus : la première réservation apparaîtra ici avec votre commission.</p>`;
  }
  const groups = {};
  reservations.forEach(r => {
    const key = (r.created_at||'').slice(0,7);
    (groups[key] = groups[key] || []).push(r);
  });
  const keys = Object.keys(groups).sort().reverse();
  const monthLabel = key => {
    const [y,mo] = key.split('-').map(Number);
    return new Date(y,mo-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  };
  return `
    <div class="section-hd">Réservations apportées</div>
    ${keys.map((key,i) => {
      const items = groups[key];
      const total = items.reduce((s,r)=>s+(r.commission_cents||0),0);
      return `
      <details class="month-card" ${i===0?'open':''}>
        <summary>
          <span style="text-transform:capitalize">${monthLabel(key)}</span>
          <span class="month-sum">${items.length} résa · ${euros(total/100)}</span>
        </summary>
        ${items.map(r => `
          <div class="resa-row">
            <div>
              <div class="resa-client">${escHtml(r.client||'Client')}${r.prolongation?'<span class="chip chip-prolong" style="margin-left:6px;vertical-align:middle">Prolongation</span>':''}</div>
              <div class="resa-meta">${r.date_debut?new Date(r.date_debut).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):''} ${r.ref?'· '+escHtml(r.ref):''}${r.prolongation&&r.origine_ref?' · 🔗 '+escHtml(r.origine_ref):''}</div>
            </div>
            <div class="resa-right">
              <div class="resa-amount">${euros(r.commission_cents/100)}</div>
              <span class="chip ${r.payee?'chip-verse':'chip-pending'}">${r.payee?'Versé':'À verser'}</span>
            </div>
          </div>`).join('')}
      </details>`;
    }).join('')}`;
}

function virementsHistoryHtml(virements){
  // Inclut aussi la demande en cours (statut 'demande'), pas seulement les
  // virements déjà versés — un partenaire doit pouvoir vérifier à tout
  // moment que sa demande a bien été enregistrée, sans se fier uniquement
  // au bouton du haut (traçabilité complète, comme un relevé de paiements).
  const hist = (virements||[]);
  if(!hist.length) return '';
  return `
    <div class="section-hd">Virements</div>
    <div class="card" style="padding:4px 18px">
      ${hist.map(v=>{
        const verse = v.statut==='verse';
        const dateLabel = verse
          ? (v.verse_at?new Date(v.verse_at).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'')
          : ('Demandé le '+(v.created_at?new Date(v.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):''));
        return `
        <div class="vir-row">
          <div>
            <div class="vir-amount">${euros(v.montant_cents/100)}</div>
            <div class="vir-date">${dateLabel}</div>
          </div>
          <span class="chip ${verse?'chip-verse':'chip-pending'}">${verse?'Versé':'En attente'}</span>
        </div>`;}).join('')}
    </div>`;
}

async function copyLink(){
  const input = document.getElementById('aff-link');
  try{ await navigator.clipboard.writeText(input.value); }
  catch(e){ input.select(); document.execCommand('copy'); }
  const ok = document.getElementById('copy-ok');
  ok.style.display = 'block';
  setTimeout(() => { ok.style.display = 'none'; }, 2200);
}

async function demanderVirement(){
  const errEl = document.getElementById('dash-err');
  const btn   = document.getElementById('demander-virement-btn');
  if(errEl) errEl.style.display = 'none';
  if(btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }
  try{
    const r = await fetch(API('partenaire-earnings'), {method:'POST', headers:authHeaders(), body:JSON.stringify({action:'demander_virement'})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Erreur');
    await loadDashboard();
  }catch(e){
    if(errEl){ errEl.textContent = e.message; errEl.style.display = 'block'; }
    if(btn){ btn.disabled = false; btn.textContent = 'Demander le virement →'; }
  }
}

// ── QR code download ──────────────────────────────────────────────────────────
async function downloadQR(e, url){
  // Empêche la navigation par défaut d'abord, puis tente le download blob.
  // Si le fetch CORS échoue, on ouvre l'URL dans un nouvel onglet (right-click → Enregistrer).
  e.preventDefault();
  try{
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('fetch failed');
    const blob = await resp.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = `locair-qr-${STATE.code||'ambassadeur'}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(objUrl), 5000);
  }catch(_){
    // Fallback CORS : ouvre l'image dans un onglet (clic droit → Enregistrer l'image)
    window.open(url, '_blank', 'noopener,noreferrer');
  }
}
